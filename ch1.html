        .module-card:hover { background-color: var(--accent); border-color: var(--text-muted); transform: translateY(-5px); }
        .module-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .module-card p { color: var(--text-muted); font-family: 'Courier New', monospace; }
        
        .content-area { background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; padding: 25px; flex-grow: 1; font-size: 1.1rem; line-height: 1.7; color: #d0d0d0; overflow-y: auto; max-height: 68vh; }

        .quiz-top-header h2 { margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }
        .progress-bar-container { width: 100%; background-color: var(--accent); border-radius: 8px; height: 6px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--text-muted); width: 0%; transition: width 0.3s ease; }
        
        /* Live Score Tracker Styles */
        .live-score-tracker { display: flex; gap: 20px; font-size: 1rem; font-weight: 600; background: var(--bg-color); padding: 10px 20px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 20px; justify-content: center;}
        .score-correct { color: var(--correct-border); }
        .score-wrong { color: var(--wrong-border); }

        .question-text { font-size: 1.25rem; margin-bottom: 25px; line-height: 1.4; font-weight: 500; color: var(--text-main); } 
        
        .mcq-options { display: flex; flex-direction: column; gap: 10px; }
        .mcq-option { background-color: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 15px 20px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1.05rem; transition: all 0.2s; }
        .mcq-option:hover:not(.disabled) { background-color: var(--accent); }
        .mcq-option.disabled { cursor: default; }
        .mcq-option.correct { background-color: var(--correct-bg); border-color: var(--correct-border); }
        .mcq-option.wrong { background-color: var(--wrong-bg); border-color: var(--wrong-border); }
        
        .feedback-box { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: left; font-weight: 600; display: none; font-size: 1rem; }
        .feedback-solution { display: block; background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border); padding: 20px; font-size: 1.05rem; font-weight: normal; }
        
        .quiz-nav-controls { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--accent); }
        .quiz-nav-btn { background-color: var(--highlight); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; min-width: 110px; }
        .quiz-nav-btn:hover:not(:disabled) { background-color: #666666; }
        .quiz-nav-btn:disabled { background-color: var(--bg-color); color: #555; cursor: not-allowed; border: 1px solid #333; }
        
        /* Final Results Screen Styles */

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'flex';
        }

        // ==========================================
        // QUIZ DATA (Theory Engine)
        // ==========================================
        const quizData = [
            // PASTE THE 96 ASI/MACH METER THEORY QUESTIONS HERE
            {
                q: "Dynamic pressure is:",
                options: ["a) Density and static pressure", "b) Pitot pressure minus static pressure", "c) Pitot pressure plus static pressure"],
                correct: 1,
                sol: "<strong>Explanation:</strong> Total (Pitot) Pressure is the sum of Dynamic and Static pressure. Therefore, Dynamic Pressure equals Pitot pressure minus Static pressure."
            },
            {
                q: "The reason for having a square-law compensation in the airspeed-indicator mechanism is:",
                options: ["a) The differential pressure decreases with the square of the airspeed", "b) The ram air pressure decreases with the square-root of the airspeed", "c) The differential pressure increases with the square of the airspeed"],
                correct: 2,
                sol: "<strong>Explanation:</strong> The formula for dynamic (differential) pressure is 1/2 &rho; V&sup2;. Because velocity is squared, pressure increases exponentially as speed increases, requiring mechanical compensation to keep the dial linear."
            },
            {
                q: "A pitot tube covered by ice which blocks the ram air inlet will affect the following instrument (s):",
                options: ["a) altimeter only.", "b) vertical speed indicator only.", "c) airspeed indicator only."],
                correct: 2,
                sol: "<strong>Explanation:</strong> The Airspeed Indicator is the only standard flight instrument that uses pitot (ram air) pressure. The Altimeter and VSI only use the static system."
            },
            {
                q: "The Airspeed Indicator measures:",
                options: ["a) Static pressure", "b) Differential pressure", "c) Static pressure changes"],
                correct: 1,
                sol: "<strong>Explanation:</strong> It measures the difference between Total Pressure from the pitot tube and Static Pressure from the static ports (which is Differential/Dynamic pressure)."
            },
            {
                q: "If static source of ASI is blocked during level flight, ASI will:",
                options: ["a) Under-read", "b) Over-read", "c) Will read correct"],
                correct: 2,
                sol: "<strong>Explanation:</strong> If you remain in level flight, the ambient static pressure outside doesn't change. Therefore, the trapped static pressure inside the instrument matches reality, and the ASI remains accurate until you change altitude."
            },
            {
                q: "If the static tube is clogged, which instrument(s) is/are affected?",
                options: ["a) Vertical speed indicator & ASI only.", "b) Altimeter & VSI only.", "c) Airspeed indicator, VSI and altimeter."],
                correct: 2,
                sol: "<strong>Explanation:</strong> All three primary pitot-static instruments rely on ambient static pressure to function correctly."
            },
            {
                q: "Indicated airspeed corrected for position error is:",
                options: ["a) Calibrated airspeed.", "b) Ground speed.", "c) Equivalent air speed."],
                correct: 0,
                sol: "<strong>Explanation:</strong> Calibrated Airspeed (CAS) is Indicated Airspeed (IAS) corrected for instrument and position (pressure) errors."
            },
            {
                q: "Which of the following is most dangerous?",
                options: ["a) Pilot blocked during climb.", "b) Static blocked during descend (over-read)", "c) Pilot blocked during descend"],
                correct: 1,
                sol: "<strong>Explanation:</strong> If the ASI over-reads in a descent, the pilot thinks they are flying faster than they actually are. This can easily lead to stalling the aircraft during approach."
            },
            {
                q: "If static source of an a/c is blocked during climb, Altimeter ________ and ASI ________ will:",
                options: ["a) Under-read, under-read", "b) Under-read, over-read", "c) Over-read, under-read"],
                correct: 0,
                sol: "<strong>Explanation:</strong> In a climb, true static pressure drops, but the blocked line traps higher pressure. High static pressure makes the altimeter read low. For the ASI, subtracting a larger static pressure from total pressure makes it under-read."
            },
            {
                q: "Compressibility Error requires a.... (i) correction because it is.... (ii) of .... (iii) pressure. It gives.... (iv):",
                options: ["a) (i) negative (ii) an increase (iii) dynamic (iv) EAS", "b) (i) positive (ii) an increase (iii) dynamic (iv) TAS", "c) (i) negative (ii) a decrease (iii) static (iv) EAS"],
                correct: 0,
                sol: "<strong>Explanation:</strong> Ramming air into the pitot tube compresses it, artificially increasing dynamic pressure. Therefore, a negative correction must be applied to CAS to find Equivalent Airspeed (EAS)."
            },
            {
                q: "The airspeed indicator is calibrated to:",
                options: ["a) ISA at the height the aircraft is flying", "b) the full ISA", "c) ISA at mean sea level"],
                correct: 2,
                sol: "<strong>Explanation:</strong> Standard ASIs are mechanically calibrated assuming standard sea-level air density (1.225 kg/m&sup3;)."
            },
            {
                q: "In a standard atmosphere and at the sea level, the calibrated airspeed (CAS) is:",
                options: ["a) higher than the true airspeed (TAS)", "b) independent of the true airspeed (TAS)", "c) equal to the true airspeed (TAS)"],
                correct: 2,
                sol: "<strong>Explanation:</strong> At standard sea level, density is perfect, meaning no density correction is needed. CAS perfectly equals TAS."
            },
            {
                q: "A white arc on a ASI indicates:",
                options: ["a) flaps extension speed range", "b) safe cruise speed", "c) safe speed on approach to land."],
                correct: 0,
                sol: "<strong>Explanation:</strong> The white arc represents the safe operating speed range for extending and flying with flaps."
            },
            {
                q: "A pitot blockage of both the ram air input and the drain hole with the static port open causes the airspeed indicator to:",
                options: ["a) freeze at zero", "b) read a little low", "c) React like an altimeter"],
                correct: 2,
                sol: "<strong>Explanation:</strong> Pitot pressure is trapped. As you climb, static pressure drops. The ASI subtracts the dropping static pressure from the trapped pitot pressure, causing the needle to rise like an altimeter."
            },
            {
                q: "If the static line to the ASI becomes blocked during a climb, the ASI reading will:",
                options: ["a) remain fixed.", "b) progressively over read.", "c) progressively under read."],
                correct: 2,
                sol: "<strong>Explanation:</strong> The trapped static pressure remains high, while actual dynamic pressure drops as air gets thinner. Subtracting an artificially high static pressure makes the ASI under-read more and more as you climb."
            },
            {
                q: "The pressure measured at the forward facing orifice of a pitot tube is the:",
                options: ["a) dynamic pressure", "b) total pressure", "c) static pressure"],
                correct: 1,
                sol: "<strong>Explanation:</strong> The front hole captures the total kinetic energy of the air, which is the sum of ambient static pressure and the dynamic pressure of the aircraft's movement."
            },
            {
                q: "VNO is the maximum speed:",
                options: ["a) with flaps extended in landing position.", "b) At which the flight controls can be fully deflected.", "c) not to be exceeded except in still air and with caution."],
                correct: 2,
                sol: "<strong>Explanation:</strong> VNO is the Maximum Structural Cruising Speed (top of the green arc). Speeds above this (yellow arc) should only be flown in smooth air."
            },
            {
                q: "The limits of the white scale of an airspeed indicator are:",
                options: ["a) VSI for the lower limit and VFE for the upper limit", "b) VSO for the lower limit and VFE for the upper limit", "c) VSO for the lower limit and VLE for the upper limit"],
                correct: 1,
                sol: "<strong>Explanation:</strong> VSO (Stall speed in landing configuration) is the bottom of the white arc, and VFE (Max flap extended speed) is the top."
            },
            {
                q: "If the static source to an airspeed indicator (ASI) becomes blocked during a descent the instrument will:",
                options: ["a) continue to indicate the speed applicable to that at the time of the blockage", "b) read zero", "c) over-read"],
                correct: 2,
                sol: "<strong>Explanation:</strong> Trapped static pressure remains low. As you descend, you are subtracting an artificially low static pressure from your pitot pressure, causing an over-read."
            },
            {
                q: "Dynamic pressure sensed by or pitot tube : Today's airspeed indicators (calibrated to the Saint-Venant formula), indicate, in the absence of static (and instrumental) error:",
                options: ["a) Is not affected by the density of surround up air.", "b) Increases if air density increases", "c) Increases if air density decreases"],
                correct: 1,
                sol: "<strong>Explanation:</strong> Dynamic pressure formula is 1/2 &rho; V&sup2;. If density (&rho;) increases, the resulting dynamic pressure increases."
            },
            {
                q: "The errors to which the mach meter is subject are:",
                options: ["a) instrument error, position error, compressibility error and manoeuvre induced error.", "b) instrument error, position error, density error and manoeuvre induced error.", "c) instrument error, position error."],
                correct: 2,
                sol: "<strong>Explanation:</strong> By using a ratio of pressures, the Mach meter cleverly cancels out density and temperature variables, leaving only mechanical instrument error and aerodynamic position error."
            },
            {
                q: "The combined Mach meter / ASI is subject to the following errors:",
                options: ["a) instrument and compressibility only", "b) instrument, pressure and temperature only", "c) position, density, instrument, compressibility, manoeuvre induced"],
                correct: 2,
                sol: "<strong>Explanation:</strong> Because it houses a traditional ASI, the combined unit inherits all the density and compressibility errors that a standard ASI suffers from."
            },
            {
                q: "How many diaphragms are present in a basic Mach meter?",
                options: ["a) Four.", "b) Two.", "c) Three."],
                correct: 1,
                sol: "<strong>Explanation:</strong> It uses two: an airspeed capsule (to measure dynamic pressure) and an altimeter aneroid capsule (to measure static pressure)."
            },
            {
                q: "Indication of Mach number is obtained from:",
                options: ["a) indicated speed and altitude using a speed indicator equipped with an altimeter type aneroid", "b) an ordinary airspeed indicator scaled for Mach number instead of knots", "c) a kind of echo sound comparing velocity of sound with indicated speed"],
                correct: 0,
                sol: "<strong>Explanation:</strong> This describes the physical mechanics: a dynamic pressure capsule (speed) linked to an evacuated static capsule (altitude) to physically compute the ratio."
            },
            {
                q: "The Mach number is the:",
                options: ["a) true airspeed (TAS) divided by the local speed of sound", "b) equivalent airspeed (EAS) divided by the local speed of sound", "c) indicated airspeed (IAS) divided by the local speed of sound"],
                correct: 0,
                sol: "<strong>Explanation:</strong> This is the fundamental aerodynamic definition of Mach."
            },
            {
                q: "The principle of the Mach indicator is based on the computation of the ratio:",
                options: ["a) (Pt+Ps) to Ps", "b) Pt to Ps", "c) (Pt-Ps) to Ps"],
                correct: 2,
                sol: "<strong>Explanation:</strong> (Pt - Ps) is Dynamic Pressure. The Mach meter calculates the ratio of Dynamic Pressure to Static Pressure (Ps)."
            },
            {
                q: "The Mach number is:",
                options: ["a) a direct function of temperature; it varies in proportion to the square root of the absolute temperature", "b) The ratio of the aircraft true airspeed to the sonic velocity at the altitude considered", "c) the ratio of the aircraft conventional airspeed to the sonic velocity at the altitude considered"],
                correct: 1,
                sol: "<strong>Explanation:</strong> Sonic velocity is just another term for the Local Speed of Sound. Mach is TAS divided by LSS."
            },
            {
                q: "Sound propagates through the air at a speed which only depends on:",
                options: ["a) temperature", "b) temperature and the pressure", "c) pressure"],
                correct: 0,
                sol: "<strong>Explanation:</strong> The Local Speed of Sound (LSS) is determined exclusively by the absolute temperature of the air mass."
            },
            {
                q: "Mach meter readings are subject to:",
                options: ["a) setting error", "b) density error", "c) position pressure error"],
                correct: 2,
                sol: "<strong>Explanation:</strong> It relies heavily on an accurate static pressure input for the denominator of its ratio, making it vulnerable to position (pressure) errors over the static port."
            },
            {
                q: "The reading of a Mach indicator is independent of:",
                options: ["a) The outside temperature", "b) The static pressure", "c) The total pressure"],
                correct: 0,
                sol: "<strong>Explanation:</strong> While *True* Mach changes with temperature, the mechanical instrument calculates its ratio using purely pitot and static pressures, making its internal mechanics blind to temperature."
            },
            {
                q: "As an airplane climbs higher, the true airspeed for a given indicated airspeed will:",
                options: ["a) Decrease", "b) Increase", "c) Remain the same"],
                correct: 1,
                sol: "<strong>Explanation:</strong> Air density drops as you climb. To ram the exact same amount of dynamic pressure into the pitot tube (constant IAS), you must fly faster through the thinner air."
            },
            {
                q: "Which of the following instruments require pitot and static pressure inputs?",
                options: ["a) Airspeed indicator, vertical speed indicator, altimeter.", "b) Airspeed indicator, mach meter and vertical speed indicator.", "c) Airspeed indicator and mach meter."],
                correct: 2,
                sol: "<strong>Explanation:</strong> Both the ASI and the Mach meter must subtract static pressure from total (pitot) pressure to function. The VSI and Altimeter only use static."
            },
            {
                q: "During a steady climb the pitot head becomes totally blocked by ice. As the climb continues the indications of the mach meter will:",
                options: ["a) progressively under indicate the Mach number", "b) stick at the Mach number at the time of blockage", "c) increase no matter what the actual Mach number"],
                correct: 2,
                sol: "<strong>Explanation:</strong> With total pressure trapped, as you climb, static pressure continues to drop. The ratio of (Trapped High Pt - Dropping Ps) / Dropping Ps artificially skyrockets."
            },
            {
                q: "The Mach number is a function of the:",
                options: ["a) Isobaric gradient of the fluid.", "b) Humidity of the air.", "c) Absolute temperature of the air."],
                correct: 2,
                sol: "<strong>Explanation:</strong> Mach is TAS / LSS. Because the Local Speed of Sound relies entirely on absolute temperature, Mach is fundamentally a function of temperature."
            },
            {
                q: "A mach meter comprises of?",
                options: ["a) A combination of ASI and altimeter.", "b) A combination of VSI and altimeter.", "c) An ASI with its scale marked in mach numbers."],
                correct: 0,
                sol: "<strong>Explanation:</strong> It houses two capsules: an airspeed capsule (for dynamic pressure) and an evacuated altimeter aneroid (for static pressure)."
            },
            {
                q: "Mach meter indications?",
                options: ["a) Vary with airspeed and temperature.", "b) Vary only with airspeed.", "c) Vary only with temperature."],
                correct: 1,
                sol: "<strong>Explanation:</strong> Assuming altitude is constant, the mechanical pointer only moves when dynamic pressure (airspeed) changes, because it cannot physically sense temperature."
            },
            {
                q: "How will mach meter indication respond if an aircraft passes through a cold front when flying at constant CAS and altitude?",
                options: ["a) Increase.", "b) Decrease.", "c) Remain constant."],
                correct: 2,
                sol: "<strong>Explanation:</strong> Constant altitude means static pressure is constant. Constant CAS means dynamic pressure is constant. Since neither pressure changes, the physical needle doesn't move."
            },
            {
                q: "A mach meter indicates mach number based on the ratio of?",
                options: ["a) Static pressure to pitot pressure.", "b) Pitot pressure to static pressure.", "c) Dynamic pressure to static pressure."],
                correct: 2,
                sol: "<strong>Explanation:</strong> The formula is (Pt - Ps) / Ps. Since (Pt - Ps) is Dynamic pressure, it compares Dynamic to Static."
            },
            {
                q: "The airspeed indicator of an aircraft is provided with a moving red and white hatched pointer. This pointer indicates the:",
                options: ["a) speed indicated on the auto throttle control box, versus temperature", "b) speed indicated on the auto throttle control box, versus altitude", "c) maximum speed in VMO operation versus altitude"],
                correct: 2,
                sol: "<strong>Explanation:</strong> This is the 'Barber Pole'. It dynamically adjusts based on altitude to show the absolute structural or compressibility speed limit (VMO/MMO)."
            },
            {
                q: "The velocity maximum operating (VMO) is a speed expressed in:",
                options: ["a) calibrated airspeed (CAS).", "b) true airspeed (TAS).", "c) equivalent airspeed (EAS)."],
                correct: 0,

        function startQuiz() {
            if (quizData.length === 0) {
                alert("The Theory Engine is currently empty.");
                return;
            }
            switchView('quiz-page');
            currentQuizIndex = 0;
            quizAnswers = new Array(quizData.length).fill(null);
            scoreCorrect = 0;
            scoreWrong = 0;
            updateLiveScore();
            renderQuiz();
        }

        function updateLiveScore() {
            document.getElementById('live-correct').innerText = scoreCorrect;
            document.getElementById('live-wrong').innerText = scoreWrong;
        }

        function renderQuiz() {
            if (quizData.length === 0) return;
            const qData = quizData[currentQuizIndex];
            
            document.getElementById('quiz-counter').innerText = `Theory Q${currentQuizIndex + 1} of ${quizData.length}`;
            document.getElementById('quiz-progress').style.width = `${((currentQuizIndex + 1) / quizData.length) * 100}%`;
            document.getElementById('quiz-q-text').innerHTML = `<strong>Q${currentQuizIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = quizAnswers[currentQuizIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === quizAnswers[currentQuizIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectQuizOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            const solArea = document.getElementById('quiz-sol-area');
            const solBox = document.getElementById('quiz-sol-box');
            const revealBtn = document.getElementById('quiz-reveal-btn');
            
            if (qData.sol) {
                solArea.style.display = 'block';
                solBox.innerHTML = qData.sol;
                solBox.style.display = 'none';
                
                if (hasAnswered) {
                    revealBtn.style.display = 'inline-block';
                    revealBtn.onclick = () => { solBox.style.display = 'block'; };
                } else {
                    revealBtn.style.display = 'none';
                }
            } else {
                solArea.style.display = 'none';
            }
            
            document.getElementById('quiz-prev-btn').disabled = currentQuizIndex === 0;
            
            // Modify Next button behavior for the last question
            const nextBtn = document.getElementById('quiz-next-btn');
            if (currentQuizIndex === quizData.length - 1) {
                nextBtn.innerText = "Finish Quiz";
            } else {
                nextBtn.innerText = "Next";
            }
        }

        function selectQuizOption(selectedIndex) { 
            quizAnswers[currentQuizIndex] = selectedIndex; 
            if (selectedIndex === quizData[currentQuizIndex].correct) {
                scoreCorrect++;
            } else {
                scoreWrong++;
            }
            updateLiveScore();
            renderQuiz(); 
        }

        function goPrevQuiz() { if (currentQuizIndex > 0) { currentQuizIndex--; renderQuiz(); } }
        
        function goNextQuiz() { 
            if (currentQuizIndex < quizData.length - 1) { 
                currentQuizIndex++; 
                renderQuiz(); 
            } else {
                showResults();
            }
        }

        function showResults() {
            switchView('results-page');
            const total = quizData.length;
            const percentage = Math.round((scoreCorrect / total) * 100);
            
            const circle = document.getElementById('final-percentage');
            circle.innerText = `${percentage}%`;
            
            if(percentage >= 70) {
                circle.style.borderColor = "var(--correct-border)";
                circle.style.color = "var(--correct-border)";
            } else {
                circle.style.borderColor = "var(--wrong-border)";
                circle.style.color = "var(--wrong-border)";
            }
            
            document.getElementById('final-breakdown').innerText = `${scoreCorrect} Correct | ${scoreWrong} Wrong | ${total - (scoreCorrect + scoreWrong)} Skipped`;
        }

        let currentPdfIndex = 0;
        let pdfAnswers = [];

        function startPdf() {
            if (pdfData.length === 0) {
                alert("The PDF Data Engine is currently empty.");
                return;
            }
            switchView('pdf-page');
            currentPdfIndex = 0;
            pdfAnswers = new Array(pdfData.length).fill(null);
            renderPdf();
        }

        function renderPdf() {
            if (pdfData.length === 0) return;
            const qData = pdfData[currentPdfIndex];
            
            document.getElementById('pdf-counter').innerText = `PDF Question ${currentPdfIndex + 1} of ${pdfData.length}`;
            document.getElementById('pdf-progress').style.width = `${((currentPdfIndex + 1) / pdfData.length) * 100}%`;
            document.getElementById('pdf-q-text').innerHTML = `<strong>Q${currentPdfIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('pdf-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = pdfAnswers[currentPdfIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === pdfAnswers[currentPdfIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectPdfOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            const solArea = document.getElementById('pdf-sol-area');
            const solBox = document.getElementById('pdf-sol-box');
            const revealBtn = document.getElementById('pdf-reveal-btn');
            
            if (qData.sol) {
                solArea.style.display = 'block';
                solBox.innerHTML = qData.sol;
                solBox.style.display = 'none';
                
                if (hasAnswered) {
                    revealBtn.style.display = 'inline-block';
                    revealBtn.onclick = () => { solBox.style.display = 'block'; };
                } else {
                    revealBtn.style.display = 'none';
                }
            } else {
                solArea.style.display = 'none';
            }
            
            document.getElementById('pdf-prev-btn').disabled = currentPdfIndex === 0;
            document.getElementById('pdf-next-btn').disabled = currentPdfIndex === pdfData.length - 1;
        }

        function selectPdfOption(selectedIndex) { 
            pdfAnswers[currentPdfIndex] = selectedIndex; 
            renderPdf(); 
        }

        function goPrevPdf() { if (currentPdfIndex > 0) { currentPdfIndex--; renderPdf(); } }
        function goNextPdf() { if (currentPdfIndex < pdfData.length - 1) { currentPdfIndex++; renderPdf(); } }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        window.onload = function() {
            document.getElementById('quiz-card-count').innerText = quizData.length + " Theory MCQs";
            document.getElementById('pdf-card-count').innerText = pdfData.length + " PDF Questions";
        };
