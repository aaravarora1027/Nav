<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH 4 | Payload</title>
    <style>
        :root {
            --bg-color: #050505; --panel-bg: #121212; --text-main: #f0f0f0; --text-muted: #888888;
            --accent: #2a2a2a; --accent-hover: #404040; --border: #333333; --highlight: #555555;
            --correct-bg: #1e4620; --correct-border: #4caf50; --wrong-bg: #4a1919; --wrong-border: #f44336;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 95%; max-width: 1200px; background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); padding: 30px; min-height: 85vh; display: flex; flex-direction: column; position: relative; }
        .view-section { display: none; flex-direction: column; flex-grow: 1; animation: fadeIn 0.3s ease-in-out; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .nav-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; cursor: pointer; border-radius: 4px; transition: background 0.2s; text-decoration: none; }
        .nav-btn:hover { background-color: var(--accent); }
        .btn { background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); padding: 15px 50px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .btn:hover { background-color: var(--accent); border-color: var(--text-main); }
        
        .module-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; margin-top: 30px; }
        .module-card { background-color: var(--bg-color); border: 1px solid var(--border); padding: 50px 20px; text-align: center; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .module-card:hover { background-color: var(--accent); border-color: var(--text-muted); transform: translateY(-5px); }
        .module-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .module-card p { color: var(--text-muted); font-family: 'Courier New', monospace; }
        
        .content-area { background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; padding: 25px; flex-grow: 1; font-size: 1.1rem; line-height: 1.7; color: #d0d0d0; overflow-y: auto; max-height: 68vh; }
        
        .quiz-top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .quiz-top-header h2 { margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }
        .score-badge { background: var(--accent); border: 1px solid #444; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; color: var(--text-main); }
        .progress-bar-container { width: 100%; background-color: var(--accent); border-radius: 8px; height: 6px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--text-muted); width: 0%; transition: width 0.3s ease; }
        .question-text { font-size: 1.25rem; margin-bottom: 15px; line-height: 1.4; font-weight: 500; color: var(--text-main); } 
        .options-grid { display: flex; flex-direction: column; gap: 8px; } 
        .option-btn { background-color: var(--accent); color: var(--text-main); border: 2px solid transparent; border-radius: 8px; padding: 12px 20px; font-size: 1rem; cursor: pointer; text-align: left; transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { background-color: var(--accent-hover); }
        .option-btn:disabled { cursor: default; }
        .correct-ans { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: white; }
        .wrong-ans { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: white; }
        .feedback-box { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: left; font-weight: 600; display: none; font-size: 1rem; }
        .feedback-correct { display: block; background-color: rgba(76, 175, 80, 0.15); color: var(--correct-border); border: 1px solid var(--correct-bg); padding: 15px; font-size: 1.15rem; }
        .feedback-wrong { display: block; background-color: rgba(244, 67, 54, 0.15); color: var(--wrong-border); border: 1px solid var(--wrong-bg); padding: 15px; font-size: 1.15rem; }
        .sol-box { display: block; background-color: var(--panel-bg); color: var(--text-main); border: 1px solid var(--border); font-family: 'Courier New', monospace; padding: 20px; margin-top: 15px; font-weight: normal; line-height: 1.6; }
        .quiz-nav-controls { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--accent); }
        .quiz-nav-btn { background-color: var(--highlight); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; min-width: 110px; }
        .quiz-nav-btn:hover:not(:disabled) { background-color: #666666; }
        .quiz-nav-btn:disabled { background-color: var(--bg-color); color: #555; cursor: not-allowed; border: 1px solid #333; }
        #finish-screen { text-align: center; padding-top: 40px; }
        #finish-screen h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--text-main);}
        #finish-screen p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="module-page" class="view-section" style="display: flex;">
            <div class="header-bar">
                <h2>Chapter 4: Payload</h2>
                <a href="index.html" class="nav-btn">Back to Hub</a>
            </div>
            <div class="module-grid">
                <div class="module-card" onclick="initQuiz()">
                    <h3>Quiz</h3>
                    <p id="quiz-label">Loading...</p>
                </div>
                <div class="module-card" onclick="startNumericals()">
                    <h3>Numericals</h3>
                    <p id="num-label">Loading...</p>
                </div>
            </div>
        </div>

        <div id="quiz-page" class="view-section">
            <div class="quiz-top-header">
                <h2 id="quiz-counter">Question 1 of X</h2>
                <div class="score-badge">Score: <span id="quiz-score-display">0</span></div>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="quiz-progress"></div></div>
            <div class="content-area" style="max-height: none; padding: 20px;">
                <div class="question-text" id="quiz-q-text">Loading question...</div>
                <div class="options-grid" id="quiz-options-container"></div>
                <div id="quiz-feedback-box" class="feedback-box"></div>
            </div>
            <div class="quiz-nav-controls">
                <button id="quiz-prev-btn" class="quiz-nav-btn" onclick="goPrevQuiz()">Previous</button>
                <button class="nav-btn" onclick="switchView('module-page')" style="border-color: var(--border);">Exit Quiz</button>
                <button id="quiz-next-btn" class="quiz-nav-btn" onclick="goNextQuiz()">Next</button>
            </div>
        </div>

        <div id="quiz-finish-screen" class="view-section" style="justify-content: center;">
            <div id="finish-screen" style="display: block;">
                <h1>Quiz Complete!</h1>
                <p>You scored <span id="final-score"></span> out of <span id="total-questions"></span>.</p>
                <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
                    <button class="btn" onclick="switchView('module-page')">Back to Modules</button>
                    <button class="btn" style="background-color: var(--highlight);" onclick="initQuiz()">Restart Quiz</button>
                </div>
            </div>
        </div>

        <div id="numerical-linear-page" class="view-section">
            <div class="quiz-top-header">
                <h2 id="num-counter">Numerical 1 of X</h2>
                <button class="nav-btn" onclick="switchView('module-page')">Exit Numericals</button>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="num-progress"></div></div>
            
            <div class="content-area" style="max-height: none; padding: 20px;">
                <div class="question-text" id="num-q-text">Loading problem...</div>
                <div style="margin-top: 25px; display: flex; gap: 15px;">
                    <button class="btn" style="padding: 10px 20px; font-size: 1rem;" onclick="document.getElementById('num-ans-box').style.display='block'">Reveal Answer</button>
                    <button class="btn" style="padding: 10px 20px; font-size: 1rem; background-color: var(--highlight);" onclick="document.getElementById('num-sol-box').style.display='block'">Reveal Solution</button>
                </div>
                <div id="num-ans-box" class="feedback-box feedback-correct" style="display:none;"></div>
                <div id="num-sol-box" class="feedback-box sol-box" style="display:none;"></div>
            </div>
            
            <div class="quiz-nav-controls">
                <button id="num-prev-btn" class="quiz-nav-btn" onclick="goPrevNum()">Previous</button>
                <button id="num-next-btn" class="quiz-nav-btn" onclick="goNextNum()">Next</button>
            </div>
        </div>

    </div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'flex';
        }

        const quizData = [ 
            { q: "The Dry Operating Mass of an aero plane includes:", options: { a: "Crew and crew baggage, catering, removable passenger service equipment, potable water and lavatory chemicals", b: "Passengers, baggage and cargo", c: "Fuel and passengers baggage and cargo" }, ans: "a" },
            { q: "At the flight preparation stage, which statement regarding dry operating mass is correct?", options: { a: "The dry operating mass includes fixed equipment needed to carry out a specific flight", b: "The dry operating mass includes take-off fuel", c: "The operating mass is the mass of the aero plane without take-off fuel" }, ans: "a" },
            { q: "In relation to an aero plane, the term 'Basic Empty Mass' value is:", options: { a: "found in the latest version of the weighing schedule as corrected to allow for modifications", b: "printed in the loading manual and includes unusable fuel", c: "found in the flight manual and is inclusive of unusable fuel plus fluids contained in closed systems" }, ans: "a" },
            { q: "When establishing the mass breakdown of an aero plane, the empty mass is defined as the sum of the:", options: { a: "basic mass plus special equipment mass", b: "standard empty mass plus specific equipment mass plus trapped fluids plus unusable fuel mass", c: "basic mass plus variable equipment mass" }, ans: "b" },
            { q: "An aero plane is weighed: nose wheel 5330kg, left main 12370kg, right main 12480kg. If 'operational items' amount to 1780kg with a crew mass of 545kg, the empty mass is:", options: { a: "31960kg", b: "30180kg", c: "28400kg" }, ans: "b" },
            { q: "When preparing to carry out the weighing procedure on an aero plane, which of the following is not required?", options: { a: "drain all engine tank oil", b: "drain all usable fuel", c: "drain all chemical toilet fluid tanks" }, ans: "a" },
            { q: "An aero plane may be weighed:", options: { a: "in an enclosed, non-air conditioned, hangar", b: "at a specified 'weighing location' on the airfield", c: "in a quiet parking area clear of the normal maneuvering area" }, ans: "a" },
            { q: "The mass of an aero plane weighing more than 2000 Kgs must be determined prior to initial entry into service and thereafter:", options: { a: "at intervals of 5 years if no modifications have taken place", b: "at intervals of 9 years", c: "at regular annual intervals" }, ans: "a" },
            { q: "Where an operator uses an aircraft weighing less than 2000 kgs, this re-weigh interval is:", options: { a: "4 years for each aero plane", b: "whenever a major repair/modification is carried out, which affect weight and balance data.", c: "whenever the Certificate of Airworthiness is renewed" }, ans: "b" },
            { q: "Who is responsible for deriving the Dry Operational Mass from the weighed mass by the addition of the 'operational items'?", options: { a: "The aero plane manufacturer of supplier", b: "The commander of the aero plane", c: "The Operator" }, ans: "c" },
            { q: "The responsibility for determination of the mass of 'operating items' and 'crew members' included within the Dry Operating Mass lies with:", options: { a: "the person compiling the weighing schedule", b: "the operator", c: "the commander" }, ans: "b" },
            { q: "An additional baggage container is loaded... but not entered into the load sheet. The aero plane will be heavier than expected and calculated take-off safety speeds:", options: { a: "will not be achieved", b: "are unaffected but will be increased", c: "will give reduced safety margins" }, ans: "c" },
            { q: "Fuel loaded is 15400kg but erroneously entered as 14500kg. The flight crew will notice that:", options: { a: "speed at un-stick will be higher than expected", b: "V1 will be reached sooner than expected", c: "the aero plane will rotate much earlier than expected" }, ans: "a" },
            { q: "When considering the effects of increased mass on an aero plane, which of the following is true?", options: { a: "Stalling speeds will be higher", b: "Flight endurance will be increased", c: "Gradient of climb for a given power setting will be higher" }, ans: "a" },
            { q: "Prior to departure an aero plane is loaded with 16500 litres of fuel at a density of 780kg/m3. This is entered into the load sheet as 16500kg. As a result of this error, the aero plane is:", options: { a: "lighter than anticipated and the calculated safety speeds will be too high", b: "heavier than anticipated and the calculated safety speeds will be too high", c: "lighter than anticipated and the calculated safety speeds will be too low" }, ans: "a" },
            { q: "A flight benefits from a strong tail wind which was not forecast. The landing mass will be higher than planned and:", options: { a: "the approach path will be steeper", b: "the landing distance required will be longer", c: "the approach path will be steeper and threshold speed higher" }, ans: "b" },
            { q: "If an aero plane is at a higher mass than anticipated, for a given airspeed the angle of attack will:", options: { a: "remain constant, drag will decrease and endurance will decrease.", b: "remain constant, drag will increase and endurance will increase.", c: "be greater, drag will increase and endurance will decrease." }, ans: "c" },
            { q: "An aero plane's weighing schedule indicates empty mass is 57320 kg, DOM is 60120 kg, and MZFM is 72100 kg. Which statement is correct?", options: { a: "operational items have a mass of 2800 kg and the maximum useful load is 14780 kg.", b: "operational items have a mass of 2800 kg and the maximum traffic load for this aero plane is 11980 kg.", c: "operational items have a mass of 2800 kg and the maximum traffic load for this aero plane is 14780 kg." }, ans: "b" },
            { q: "The Zero Fuel Mass and the Dry Operating Mass:", options: { a: "differ by the mass of usable fuel.", b: "differ by the value of the traffic load mass.", c: "are the same value." }, ans: "b" },
            { q: "In relation to an aero plane the Dry Operating Mass is the total mass of the aero plane ready for a specific type of operation but excluding:", options: { a: "usable fuel and crew.", b: "potable water and lavatory chemicals.", c: "usable fuel and traffic load." }, ans: "c" },
            { q: "On an aero plane without central fuel tank, the maximum Zero Fuel Mass is related to:", options: { a: "maximum structural take-off mass.", b: "wing loaded trip fuel.", c: "the bending moment at the wing root." }, ans: "c" },
            { q: "In relation to an aero plane, the term 'Basic Empty Mass' includes the mass of the aero plane structure complete with its powerplants, systems, furnishings and other items of equipment... Its value is", options: { a: "printed in the loading manual and includes unusable fuel.", b: "found in the latest version of the weighing schedule as corrected to allow for modifications.", c: "inclusive of an allowance for crew, crew baggage and other operating items." }, ans: "b" }
        ];

        let activeQuizData = [], userAnswers = [], currentQIndex = 0;
        
        function shuffleArray(array) { 
            for (let i = array.length - 1; i > 0; i--) { 
                const j = Math.floor(Math.random() * (i + 1)); 
                [array[i], array[j]] = [array[j], array[i]]; 
            } 
        }

        function initQuiz() { 
            switchView('quiz-page');
            activeQuizData = JSON.parse(JSON.stringify(quizData)); 
            shuffleArray(activeQuizData); 
            activeQuizData.forEach(q => { 
                let optionsArr = Object.entries(q.options).map(([key, val]) => ({ key, val })); 
                shuffleArray(optionsArr); 
                q.shuffledOptions = optionsArr; 
            }); 
            userAnswers = new Array(activeQuizData.length).fill(null); 
            currentQIndex = 0; 
            renderQuestion(); 
        }

        function updateScore() { 
            let currentScore = 0; 
            userAnswers.forEach((ans, index) => { 
                if (ans === activeQuizData[index].ans) { currentScore++; } 
            }); 
            document.getElementById('quiz-score-display').textContent = currentScore; 
            return currentScore; 
        }

        function renderQuestion() { 
            if(activeQuizData.length === 0) return;
            const qData = activeQuizData[currentQIndex]; 
            const selectedAns = userAnswers[currentQIndex]; 
            
            document.getElementById('quiz-counter').textContent = `Question ${currentQIndex + 1} of ${activeQuizData.length}`; 
            document.getElementById('quiz-progress').style.width = `${((currentQIndex + 1) / activeQuizData.length) * 100}%`; 
            document.getElementById('quiz-q-text').innerHTML = qData.q; 
            updateScore(); 
            
            const optionsContainer = document.getElementById('quiz-options-container'); 
            optionsContainer.innerHTML = ''; 
            qData.shuffledOptions.forEach(opt => { 
                const btn = document.createElement('button'); 
                btn.className = 'option-btn'; 
                btn.innerHTML = opt.val; 
                if (selectedAns !== null) { 
                    btn.disabled = true; 
                    if (opt.key === qData.ans) { btn.classList.add('correct-ans'); } 
                    else if (opt.key === selectedAns) { btn.classList.add('wrong-ans'); } 
                } else { 
                    btn.onclick = () => { userAnswers[currentQIndex] = opt.key; renderQuestion(); }; 
                } 
                optionsContainer.appendChild(btn); 
            }); 
            
            const feedbackBox = document.getElementById('quiz-feedback-box'); 
            feedbackBox.className = 'feedback-box'; 
            if (selectedAns !== null) { 
                feedbackBox.style.display = 'block';
                if (selectedAns === qData.ans) { 
                    feedbackBox.innerHTML = "<strong>Correct!</strong>"; 
                    feedbackBox.classList.add('feedback-correct'); 
                } else { 
                    feedbackBox.innerHTML = "<strong>Incorrect.</strong> The correct answer is highlighted in green."; 
                    feedbackBox.classList.add('feedback-wrong'); 
                } 
            } else { feedbackBox.style.display = 'none'; }
            
            document.getElementById('quiz-prev-btn').disabled = currentQIndex === 0; 
            const nextBtn = document.getElementById('quiz-next-btn'); 
            if (selectedAns === null) { nextBtn.disabled = true; nextBtn.textContent = "Next"; } 
            else { nextBtn.disabled = false; nextBtn.textContent = (currentQIndex === activeQuizData.length - 1) ? "Finish" : "Next"; } 
        }

        function goPrevQuiz() { if (currentQIndex > 0) { currentQIndex--; renderQuestion(); } }
        function goNextQuiz() { 
            if (currentQIndex < activeQuizData.length - 1) { currentQIndex++; renderQuestion(); } 
            else { switchView('quiz-finish-screen'); document.getElementById('final-score').textContent = updateScore(); document.getElementById('total-questions').textContent = activeQuizData.length; } 
        }

        const numericalsData = [
            { 
                q: "Q1. MZFM is given as 47,000 kg, the MTOM is 62,800 kg and the MLM is 54,900 kg. Let us assume that there are no performance Limits so that the Regulated Take-off and Landing masses are equal to the Structural Limited masses. DOM is 34,000kg, actual traffic load is 12,400kg, take off fuel is 16,000 kg and 8,000 kg of fuel was used in flight. Can extra load be carried? If yes, how much?", 
                ans: "400 kg", 
                sol: "Step 1: Check Limits to find Regulated Take-Off Mass (RTOM).<br>- MTOM Limit = 62,800 kg.<br>- Landing Limit = MLM + Trip Fuel = 54,900 + 8,000 = 62,900 kg.<br>- MZFM Limit = MZFM + Take-off Fuel = 47,000 + 16,000 = 63,000 kg.<br>The lowest of these is 62,800 kg, so RTOM = 62,800 kg.<br><br>Step 2: Calculate Maximum Traffic Load.<br>Max TL = RTOM - (DOM + Take-off Fuel)<br>Max TL = 62,800 - (34,000 + 16,000) = 12,800 kg.<br><br>Step 3: Calculate underload.<br>Underload = Max TL - Actual TL = 12,800 - 12,400 = <strong>400 kg</strong>." 
            },
            { 
                q: "Q2. MSTOM = 42,100 kg. MSLM = 35,000 kg. PLLM = 33,000 kg. MZFM = 31,000 kg. DOM = 19,000 kg. Total Fuel Capacity = 12,500 kg. Maximum Trip Fuel = 9,000 kg. Contingency fuel = 1000 kg. Alternate fuel = 500 kg. Final reserve fuel = 400 kg. What is the maximum take-off mass and maximum traffic load?", 
                ans: "41,900 kg / 12,000 kg", 
                sol: "Step 1: Calculate Fuel on Board (FOB).<br>FOB = Trip + Cont + Alt + Reserve = 9,000 + 1,000 + 500 + 400 = 10,900 kg.<br><br>Step 2: Check Limits for Max TOM.<br>- Structural TOM = 42,100 kg.<br>- Landing Limit (using restrictive PLLM) = 33,000 + 9,000 = 42,000 kg.<br>- ZFM Limit = MZFM + FOB = 31,000 + 10,900 = 41,900 kg.<br>The lowest is the ZFM limit, so Max TOM = <strong>41,900 kg</strong>.<br><br>Step 3: Calculate Max Traffic Load.<br>Payload is limited by MZFM: MZFM - DOM = 31,000 - 19,000 = <strong>12,000 kg</strong>." 
            },
            { 
                q: "Q3. Aircraft weight without fuel and payload = 90t (APS weight). RTOW = 167t. RLW = 139.55t. MZFW = 132t. Reserve fuel = 3t. Flight time = 3 hr 33 min. Diversion time = 51 min. Fuel flow throughout = 2.5 t/hr. What is the maximum permissible TOW and payload?", 
                ans: "146 t / 42 t", 
                sol: "Step 1: Calculate Fuel.<br>Trip Time = 3.55 hrs. Trip Fuel = 3.55 &times; 2.5 = 8.875 t.<br>Div Time = 0.85 hrs. Div Fuel = 0.85 &times; 2.5 = 2.125 t.<br>FOB = Trip + Div + Reserve = 8.875 + 2.125 + 3 = 14 t.<br><br>Step 2: Check Limits for Max TOW.<br>- RTOW = 167 t.<br>- Landing Limit = RLW + Trip = 139.55 + 8.875 = 148.425 t.<br>- ZFM Limit = MZFW + FOB = 132 + 14 = 146 t.<br>The lowest limit is <strong>146 t</strong>.<br><br>Step 3: Calculate Max Payload.<br>Payload limited by MZFW: 132 - 90 = <strong>42 t</strong>." 
            },
            { 
                q: "Q4. APS weight = 40.00 t. RLW = 49.55 t. RTOW = 65.00 t. MZFW = 48.00 t. Burn-off = 12.89 t. Reserve = 1.65 t. Calculate the maximum permissible TOM and payload.", 
                ans: "62.44 t / 7.9 t", 
                sol: "Step 1: Calculate FOB.<br>FOB = Burn-off + Reserve = 12.89 + 1.65 = 14.54 t.<br><br>Step 2: Check Limits for TOM.<br>- RTOW = 65.00 t.<br>- Landing Limit = RLW + Burn = 49.55 + 12.89 = 62.44 t.<br>- ZFM Limit = MZFW + FOB = 48.00 + 14.54 = 62.54 t.<br>The lowest is the Landing Limit, so Max TOM = <strong>62.44 t</strong>.<br><br>Step 3: Calculate Max Payload.<br>Payload = Max TOM - (APS + FOB) = 62.44 - (40.00 + 14.54) = <strong>7.9 t</strong>." 
            },
            { 
                q: "Q5. Load sheet reads: A/c wt, no fuel, no payload = 63,200 kg. Max TOW = 99,000 kg. Route fuel = 18,200 kg. Reserve = 3,000 kg. If max landing weight is 76,500 kg, and MZFW 74,000 kg, find: (a) TOW when maximum payload is carried. (b) Maximum payload.", 
                ans: "94,700 kg / 10,300 kg", 
                sol: "Step 1: Calculate FOB.<br>FOB = Route + Reserve = 18,200 + 3,000 = 21,200 kg.<br><br>Step 2: Check Limits for TOM.<br>- Max TOW = 99,000 kg.<br>- Landing Limit = MLM + Route = 76,500 + 18,200 = 94,700 kg.<br>- ZFM Limit = MZFW + FOB = 74,000 + 21,200 = 95,200 kg.<br>The lowest is the Landing Limit, so RTOM = <strong>94,700 kg</strong>.<br><br>Step 3: Calculate Payload.<br>Payload = RTOM - (DOM + FOB) = 94,700 - (63,200 + 21,200) = <strong>10,300 kg</strong>." 
            },
            { 
                q: "Q27. The take-off mass of an aero plane is 117000 kg, comprising a traffic load of 18000kg and fuel of 46000kg. What is the dry operating mass?", 
                ans: "53000 kg", 
                sol: "Formula: Take-Off Mass = Dry Operating Mass + Traffic Load + Fuel.<br>117,000 = DOM + 18,000 + 46,000<br>117,000 = DOM + 64,000<br>DOM = 117,000 - 64,000 = <strong>53,000 kg</strong>." 
            },
            {

        let activeQuizDataNum = [], currentNumIndex = 0;
        
        function startNumericals() { 
            switchView('numerical-linear-page'); 
            activeQuizDataNum = numericalsData; 
            currentNumIndex = 0; 
            renderNumerical(); 
        }

        function renderNumerical() { 
            if (activeQuizDataNum.length === 0) return; 
            const qData = activeQuizDataNum[currentNumIndex]; 
            document.getElementById('num-counter').innerText = `Numerical ${currentNumIndex + 1} of ${activeQuizDataNum.length}`; 
            document.getElementById('num-progress').style.width = `${((currentNumIndex + 1) / activeQuizDataNum.length) * 100}%`; 
            document.getElementById('num-q-text').innerHTML = qData.q; 
            
            const ansBox = document.getElementById('num-ans-box'); 
            ansBox.innerHTML = `<strong>Answer:</strong> ${qData.ans}`; 
            ansBox.style.display = 'none'; 
            
            const solBox = document.getElementById('num-sol-box'); 
            solBox.innerHTML = `<strong>Step-by-Step Solution:</strong><br><br>${qData.sol}`; 
            solBox.style.display = 'none'; 
            
            document.getElementById('num-prev-btn').disabled = currentNumIndex === 0; 
            document.getElementById('num-next-btn').disabled = currentNumIndex === activeQuizDataNum.length - 1; 
        }

        function goPrevNum() { if (currentNumIndex > 0) { currentNumIndex--; renderNumerical(); } }
        function goNextNum() { if (currentNumIndex < activeQuizDataNum.length - 1) { currentNumIndex++; renderNumerical(); } }

        // AUTO-UPDATE MODULE LABELS
        // ==========================================
        window.onload = () => {
            document.getElementById('quiz-label').innerText = `${quizData.length} Theory MCQs`;
            document.getElementById('num-label').innerText = `${numericalsData.length} Calculation Problems`;
