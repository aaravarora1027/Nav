    <style>
        :root {
            --bg-color: #050505; --panel-bg: #121212; --text-main: #f0f0f0; --text-muted: #888888;
            --accent: #2a2a2a; --accent-hover: #404040; --border: #333333; --highlight: #555555;
            --correct-bg: #1e4620; --correct-border: #4caf50; --wrong-bg: #4a1919; --wrong-border: #f44336;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .view-section { display: none; flex-direction: column; flex-grow: 1; animation: fadeIn 0.3s ease-in-out; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .nav-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; cursor: pointer; border-radius: 4px; transition: background 0.2s; text-decoration: none; }
        .nav-btn:hover { background-color: var(--accent); }
        .btn { background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); padding: 15px 50px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .btn:hover { background-color: var(--accent); border-color: var(--text-main); }
        
        .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        .module-card { background-color: var(--bg-color); border: 1px solid var(--border); padding: 50px 40px; text-align: center; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .module-card:hover { background-color: var(--accent); border-color: var(--text-muted); transform: translateY(-5px); }
        .module-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .module-card p { color: var(--text-muted); font-family: 'Courier New', monospace; }
        
        .content-area { background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; padding: 25px; flex-grow: 1; font-size: 1.1rem; line-height: 1.7; color: #d0d0d0; overflow-y: auto; max-height: 68vh; }
        
        .quiz-top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .quiz-top-header h2 { margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }
        .progress-bar-container { width: 100%; background-color: var(--accent); border-radius: 8px; height: 6px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--text-muted); width: 0%; transition: width 0.3s ease; }
        .question-text { font-size: 1.25rem; margin-bottom: 25px; line-height: 1.4; font-weight: 500; color: var(--text-main); } 
        
        .mcq-options { display: flex; flex-direction: column; gap: 10px; }
        .mcq-option { background-color: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 15px 20px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1.05rem; transition: all 0.2s; }
        .mcq-option:hover:not(.disabled) { background-color: var(--accent); }
        .mcq-option.disabled { cursor: default; }
        .mcq-option.correct { background-color: var(--correct-bg); border-color: var(--correct-border); }
        .mcq-option.wrong { background-color: var(--wrong-bg); border-color: var(--wrong-border); }
        
        .feedback-box { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: left; font-weight: 600; display: none; font-size: 1rem; }
        .feedback-correct { display: block; background-color: rgba(76, 175, 80, 0.15); color: var(--correct-border); border: 1px solid var(--correct-bg); padding: 15px; font-size: 1.15rem; margin-bottom: 15px; }
        .feedback-solution { display: block; background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border); padding: 20px; font-size: 1.05rem; font-weight: normal; }
        
        .quiz-nav-controls { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--accent); }
        .quiz-nav-btn { background-color: var(--highlight); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; min-width: 110px; }
        .quiz-nav-btn:hover:not(:disabled) { background-color: #666666; }
        .quiz-nav-btn:disabled { background-color: var(--bg-color); color: #555; cursor: not-allowed; border: 1px solid #333; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'flex';
        }

        // ==========================================
        // QUIZ DATA (Theory Engine - Multiple Choice)
        // ==========================================
        const quizData = [
            // -----------------------------------------------------------------
            {
                q: "Dynamic pressure is:",
                options: ["a) Density and static pressure", "b) Pitot pressure minus static pressure", "c) Pitot pressure plus static pressure"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Dynamic Pressure (q) is the pressure caused by forward movement. A pitot tube measures Total Pressure (Pt), and static ports measure Static Pressure (Ps). The ASI isolates Dynamic Pressure mechanically by subtracting them: Pt - Ps."
            },
            {
                q: "The reason for having a square-law compensation in the airspeed-indicator mechanism is:",
                options: ["a) The differential pressure decreases with the square of the airspeed", "b) The ram air pressure decreases with the square-root of the airspeed", "c) The differential pressure increases with the square of the airspeed"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The formula for Dynamic Pressure is q = 1/2 &rho; V&sup2;. Because velocity (V) is squared, the pressure increases exponentially as speed increases. Mechanical linkages (square-law compensation) are used in the ASI to linearize the dial face so the speed markings are evenly spaced."
            },
            {
                q: "A pitot tube covered by ice which blocks the ram air inlet will affect the following instrument (s):",
                options: ["a) altimeter only.", "b) vertical speed indicator only.", "c) airspeed indicator only."],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The Airspeed Indicator is the only standard flight instrument that requires a Pitot (Ram Air) input. The Altimeter and VSI operate entirely on Static pressure changes."
            },
            {
                q: "The Airspeed Indicator measures:",
                options: ["a) Static pressure", "b) Differential pressure", "c) Static pressure changes"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The ASI is fundamentally a differential pressure gauge. It measures the difference between the total (pitot) pressure fed into the capsule and the static pressure fed into the instrument case."
            },
            {
                q: "If static source of ASI is blocked during level flight, ASI will:",
                options: ["a) Under-read", "b) Over-read", "c) Will read correct"],
                correct: 1,
                sol: "<strong>DGCA Key Note:</strong><br>While technically it reads correct until you change altitude/speed, the DGCA key strictly marks <strong>b) Over-read</strong> as the correct answer. Memorize this specific key for the exam."
            },
            {
                q: "If the static tube is clogged, which instrument(s) is/are affected?",
                options: ["a) Vertical speed indicator & ASI only.", "b) Altimeter & VSI only.", "c) Airspeed indicator, VSI and altimeter."],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>All three primary pitot-static flight instruments (ASI, Altimeter, and VSI) require an accurate ambient static pressure input to function correctly. A blockage will cause all three to display erroneous readings."
            },
            {
                q: "Indicated airspeed corrected for position error is:",
                options: ["a) Calibrated airspeed.", "b) Ground speed.", "c) Equivalent air speed."],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>1. IAS corrected for Instrument & Position Error = <strong>CAS</strong>.<br>2. CAS corrected for Compressibility Error = <strong>EAS</strong>.<br>3. EAS corrected for Density = <strong>TAS</strong>."
            },
            {
                q: "Which of the following is most dangerous?",
                options: ["a) Pitot blocked during climb.", "b) Static blocked during descend (over-read).", "c) Pitot blocked during descend"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>A static blockage during descent traps a lower pressure in the instrument case. This causes the ASI to over-read. This is highly dangerous because the ASI will show a safe flying speed when the aircraft may actually be dangerously close to a stall."
            },
            {
                q: "If static source of an a/c is blocked during climb. Altimeter ________ and ASI will ________ :",
                options: ["a) Under-read, under-read", "b) Under-read, over-read", "c) Over-read, under-read"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br><strong>Altimeter:</strong> Traps the high pressure of the lower altitude, so it under-reads.<br><strong>ASI:</strong> ASI = Pt - Ps. Subtracting an artificially high trapped static pressure makes the result smaller, causing the ASI to under-read."
            },
            {
                q: "Compressibility Error requires a.... (i) correction because it is.... (ii) of .... (iii) pressure. It gives.... (iv):",
                options: ["a) (i) negative (ii) an increase (iii) dynamic (iv) EAS", "b) (i) positive (ii) an increase (iii) dynamic (iv) TAS", "c) (i) negative (ii) a decrease (iii) static (iv) EAS"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>At high speeds, air compresses inside the pitot tube, artificially inflating the dynamic pressure reading. To find your true Equivalent Airspeed (EAS), you must apply a <strong>negative</strong> correction to subtract this false increase."
            },
            {
                q: "The airspeed indicator is calibrated to:",
                options: ["a) ISA at the height the aircraft is flying", "b) the full ISA", "c) ISA at mean sea level"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The ASI mechanism is manufactured and calibrated assuming standard International Standard Atmosphere (ISA) conditions at Mean Sea Level: 1.225 kg/m&sup3; and 15&deg;C."
            },
            {
                q: "In a standard atmosphere and at the sea level, the calibrated airspeed (CAS) is:",
                options: ["a) higher than the true airspeed (TAS)", "b) independent of the true airspeed (TAS)", "c) equal to the true airspeed (TAS)"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Because the ASI is calibrated for ISA at Sea Level, if the aircraft is actually flying in exact ISA Sea Level conditions, there is no density error. Therefore, CAS directly equals TAS."
            },
            {
                q: "A white arc on a ASI indicates:",
                options: ["a) flaps extension speed range.", "b) safe cruise speed.", "c) safe speed on approach to land."],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The White Arc indicates the flap operating range. The lower limit is Vso (stall speed in landing configuration) and the upper limit is Vfe (max flap extended speed)."
            },
            {
                q: "A pitot blockage of both the ram air input and the drain hole with the static port open causes the airspeed indicator to:",
                options: ["a) freeze at zero", "b) read a little low", "c) React like an altimeter"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>If the pitot tube is completely blocked, the total pressure (Pt) is trapped. As the aircraft climbs, the ambient static pressure (Ps) drops. The equation Pt(trapped) - Ps(dropping) causes the ASI needle to increase as you climb—acting exactly like an altimeter."
            },
            {
                q: "If the static line to the ASI becomes blocked during a climb, the ASI reading will:",
                options: ["a) remain fixed.", "b) progressively under read.", "c) progressively over read."],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>A blocked static line during a climb traps a higher pressure inside the ASI case from the lower altitude. Subtracting this artificially high static pressure causes the ASI to indicate a progressively lower speed than actual."
            },
            {
                q: "The pressure measured at the forward facing orifice of a pitot tube is the:",
                options: ["a) dynamic pressure", "b) total pressure", "c) static pressure"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The front opening of the pitot tube brings the oncoming relative wind to a complete halt, capturing both the ambient atmospheric pressure (Static) and the pressure of the forward motion (Dynamic). This combined measurement is Total Pressure (Pt)."
            },
            {
                q: "VNO is the maximum speed:",
                options: ["a) with flaps extended in landing position.", "b) At which the flight controls can be fully deflected.", "c) not to be exceeded except in still air and with caution."],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>VNO stands for Maximum Structural Cruising Speed. It marks the boundary between the green and yellow arcs on the ASI. You should only operate above this speed in smooth air, and only with caution."
            },
            {
                q: "The limits of the white scale of an airspeed indicator are:",
                options: ["a) VSO for the lower limit and VFE for the upper limit", "b) VSI for the lower limit and VFE for the upper limit", "c) VSO for the lower limit and VLE for the upper limit"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Lower Limit (VSO): Stall speed in the landing configuration (flaps and gear down).<br>Upper Limit (VFE): Maximum flap extended speed."
            },
            {
                q: "If the static source to an airspeed indicator (ASI) becomes blocked during a descent the instrument will:",
                options: ["a) continue to indicate the speed applicable to that at the time of the blockage", "b) read zero", "c) over-read"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Trapping the static pressure during descent means the instrument retains the lower pressure from the higher altitude. Subtracting this artificially low static pressure causes the ASI to over-read."
            },
            {
                q: "Dynamic pressure sensed by or pitot tube : Today's airspeed indicators (calibrated to the Saint-Venant formula), indicate, in the absence of static (and instrumental) error :",
                options: ["a) Is not affected by the density of surround up air.", "b) Increases if air density increases", "c) Increases if air density decreases"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>An ASI mechanically measures and displays dynamic pressure (q) as a speed. Because the instrument merely reads the physical pressure entering the capsule, its internal mechanical readout mechanism is completely agnostic to what the actual air density is outside."
            },
            {
                q: "The errors to which the mach meter is subject are:",
                options: ["a) instrument error, position error, compressibility error and manoeuvre induced error.", "b) instrument error, position error, density error and manoeuvre induced error.", "c) instrument error, position error."],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The Mach Meter calculates the ratio of (Pt - Ps) / Ps. Because density and temperature fundamentally affect both Pt and Ps proportionally, they cancel out in the division. Therefore, a Mach Meter only suffers from mechanical instrument errors and position (static port sensing) errors."
            },
            {
                q: "The combined Mach meter / ASI is subject to the following errors:",
                options: ["a) instrument and compressibility only", "b) instrument, pressure and temperature only", "c) position, density, instrument, compressibility, manoeuvre induced"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Because a combined unit contains a standard Airspeed Indicator mechanism, it inherits all the aerodynamic and density-based errors inherent to standard ASIs, even though its Mach-indicating components do not."
            },
            {
                q: "How many diaphragms are present in a basic Mach meter?",
                options: ["a) Four.", "b) Two.", "c) Three."],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>A traditional mechanical Mach meter requires two separate capsules:<br>1. An Airspeed capsule (measuring Pt - Ps).<br>2. An Altitude capsule (measuring Ps)."
            },
            {
                q: "Indication of Mach number is obtained from:",
                options: ["a) indicated speed and altitude using a speed indicator equipped with an altimeter type aneroid", "b) an ordinary airspeed indicator scaled for Mach number instead of knots", "c) a kind of echo sound comparing velocity of sound with indicated speed"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>A Mach meter mechanically divides Dynamic Pressure (speed) by Static Pressure (altitude). It literally combines the inner workings of an ASI and an Altimeter into one complex linkage."
            },
            {
                q: "The Mach number is the:",
                options: ["a) true airspeed (TAS) divided by the local speed of sound", "b) equivalent airspeed (EAS) divided by the local speed of sound", "c) indicated airspeed (IAS) divided by the local speed of sound"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>By definition, Mach Number (M) is the ratio of the aircraft's True Airspeed (TAS) relative to the surrounding air mass, divided by the Local Speed of Sound (LSS). M = TAS / LSS."
            },
            {
                q: "The principle of the Mach indicator is based on the computation of the ratio:",
                options: ["a) (Pt+Ps) to Ps", "b) Pt to Ps", "c) (Pt-Ps) to Ps"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The mathematical basis for the Mach meter is that Mach number is a strict function of dynamic pressure divided by static pressure. The instrument physically calculates the ratio (Pt - Ps) / Ps."
            },
            {
                q: "The Mach number is:",
                options: ["a) a direct function of temperature; it varies in proportion to the square root of the absolute temperature", "b) The ratio of the aircraft true airspeed to the sonic velocity at the altitude considered", "c) the ratio of the aircraft conventional airspeed to the sonic velocity at the altitude considered"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Sonic velocity is another term for the Local Speed of Sound (LSS). Therefore, Mach is the ratio of TAS to the sonic velocity at the aircraft's current flight level."
            },
            {
                q: "Sound propagates through the air at a speed which only depends on:",
                options: ["a) temperature", "b) temperature and the pressure", "c) pressure"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The Local Speed of Sound (LSS) formula is LSS = 38.94 &times; &radic;T. In an ideal gas like the atmosphere, pressure and density cancel each other out, leaving Temperature as the sole variable determining the speed of sound."
            },
            {
                q: "Mach meter readings are subject to:",
                options: ["a) setting error", "b) density error", "c) position pressure error"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Position Error occurs when the static ports fail to measure the true ambient static pressure due to the disruption of airflow. Since the Mach meter relies heavily on Static Pressure (Ps), it is subject to this error."
            },
            {
                q: "The reading of a Mach indicator is independent of:",
                options: ["a) the outside temperature", "b) The static pressure", "c) The total pressure"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>While Temperature changes the TAS and the LSS, it changes both of them by the exact same proportion. In the ratio Mach = TAS / LSS, the temperature variable perfectly cancels itself out. The instrument computes Mach purely using pressure."
            },
            {
                q: "As an airplane climbs higher, the true airspeed for a given indicated airspeed will:",
                options: ["a) Decrease", "b) Increase", "c) Remain the same"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>IAS is a measure of dynamic pressure. As you climb, air density drops. To ram the exact same amount of dynamic pressure into the pitot tube in thin air, the aircraft must physically travel much faster. Thus, TAS increases relative to IAS."
            },
            {
                q: "Which of the following instruments require pitot and static pressure inputs?",
                options: ["a) Airspeed indicator, vertical speed indicator, altimeter.", "b) Airspeed indicator, mach meter and vertical speed indicator.", "c) Airspeed indicator and mach meter."],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Both the ASI and the Mach Meter calculate Dynamic Pressure, which inherently requires taking the Pitot (Total) Pressure and subtracting the Static Pressure."
            },
            {
                q: "During a steady climb the pitot head becomes totally blocked by ice. As the climb continues the indications of the mach meter will:",
                options: ["a) progressively under indicate the Mach number", "b) stick at the Mach number at the time of blockage", "c) increase no matter what the actual Mach number"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Mach ratio is (Pt - Ps) / Ps. A pitot block traps Pt. As you climb, Ps decreases. The numerator gets larger and the denominator gets smaller. A larger number divided by a smaller number causes the Mach reading to surge upward."
            },
            {
                q: "The Mach number is a function of the:",
                options: ["a) Isobaric gradient of the fluid.", "b) Humidity of the air.", "c) Absolute temperature of the air."],
                correct: 0,
                sol: "<strong>DGCA Key Note:</strong><br>Standard physics states Mach is a function of temperature (Local Speed of Sound). However, the DGCA key marks <strong>a) Isobaric gradient of the fluid</strong>. Memorize this key for the exam to avoid losing marks."
            },
            {
                q: "A mach meter comprises of:",
                options: ["a) A combination of ASI and altimeter.", "b) A combination of VSI and altimeter.", "c) An ASI with its scale marked in mach numbers."],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Internally, a mechanical Mach meter contains an airspeed capsule (measuring dynamic pressure) and an aneroid capsule (measuring static pressure, exactly like an altimeter) linked together."
            },
            {
                q: "Mach meter indications?",
                options: ["a) Vary with airspeed and temperature.", "b) Vary only with airspeed.", "c) Vary only with temperature."],
                correct: 2,
                sol: "<strong>DGCA Key Note:</strong><br>While an aircraft's true Mach varies with both TAS and Temp, the DGCA key specifically marks <strong>c) Vary only with temperature</strong>. Memorize this discrepancy for the exam."
            },
            {
                q: "How will mach meter indication respond if an aircraft passes through a cold front when flying at constant CAS and altitude?",

        function shuffleQuiz(dataArray) {
            let shuffledData = JSON.parse(JSON.stringify(dataArray));
            for (let i = shuffledData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledData[i], shuffledData[j]] = [shuffledData[j], shuffledData[i]];
            }
            shuffledData.forEach(question => {
                let correctAnswerText = question.options[question.correct];
                for (let i = question.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [question.options[i], question.options[j]] = [question.options[j], question.options[i]];
                }
                question.correct = question.options.indexOf(correctAnswerText);
            });
            return shuffledData;
        }

        function startQuiz() {
            if (quizData.length === 0) {
                alert("The Theory Engine is currently empty. Please add your questions to the quizData array.");
                return;
            }
            switchView('quiz-page');
            activeQuizData = shuffleQuiz(quizData);
            currentQuizIndex = 0;
            quizAnswers = new Array(activeQuizData.length).fill(null);
            renderQuiz();
        }

        function renderQuiz() {
            if (activeQuizData.length === 0) return;
            const qData = activeQuizData[currentQuizIndex];
            
            document.getElementById('quiz-counter').innerText = `Theory Q${currentQuizIndex + 1} of ${activeQuizData.length}`;
            document.getElementById('quiz-progress').style.width = `${((currentQuizIndex + 1) / activeQuizData.length) * 100}%`;
            document.getElementById('quiz-q-text').innerHTML = `<strong>Q${currentQuizIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = quizAnswers[currentQuizIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === quizAnswers[currentQuizIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectQuizOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            // Smart "Reveal Solution" Logic for Quiz Engine
            const solArea = document.getElementById('quiz-sol-area');
            const solBox = document.getElementById('quiz-sol-box');
            const revealBtn = document.getElementById('quiz-reveal-btn');
            
            if (qData.sol) {
                solArea.style.display = 'block';
                solBox.innerHTML = qData.sol;
                solBox.style.display = 'none'; // Keep hidden initially
                
                if (hasAnswered) {
                    revealBtn.style.display = 'inline-block';
                    revealBtn.onclick = () => { solBox.style.display = 'block'; };
                } else {
                    revealBtn.style.display = 'none'; // Invisible until answered
                }
            } else {
                solArea.style.display = 'none';
            }
            
            document.getElementById('quiz-prev-btn').disabled = currentQuizIndex === 0;
            document.getElementById('quiz-next-btn').disabled = currentQuizIndex === activeQuizData.length - 1;
        }

        function selectQuizOption(selectedIndex) { quizAnswers[currentQuizIndex] = selectedIndex; renderQuiz(); }
        function goPrevQuiz() { if (currentQuizIndex > 0) { currentQuizIndex--; renderQuiz(); } }
        function goNextQuiz() { if (currentQuizIndex < activeQuizData.length - 1) { currentQuizIndex++; renderQuiz(); } }
