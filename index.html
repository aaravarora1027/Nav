<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Nav Command Center</title>
    <style>
        /* --- CORE STYLING --- */
        :root {
            --bg-color: #050505;
            --panel-bg: #121212;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent: #2a2a2a;
            --accent-hover: #404040;
            --border: #333333;
            --highlight: #555555;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;      /* Fixed to viewport height */
            overflow: hidden;   /* Prevents any scrolling */
        }

        .container {
            width: 95%;
            max-width: 1200px;
            height: 94vh;       /* Fills almost entire screen */
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            padding: 20px 30px; /* Reduced padding to maximize internal space */
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .view-section {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            height: 100%;
            animation: fadeIn 0.4s ease-in-out;
        }

        /* --- Landing Page --- */
        #landing-page { justify-content: center; align-items: center; text-align: center; }
        .title { font-size: 3rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
        .subtitle { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 30px; font-family: 'Courier New', monospace; }
        
        .btn {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 40px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            text-decoration: none;
        }
        .btn:hover { background-color: var(--accent); border-color: var(--text-main); }

        /* --- Header & Navigation --- */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px; 
            margin-bottom: 15px; 
            flex-shrink: 0; /* Prevents header from squishing */
        }
        .header-bar h2 { font-size: 1.4rem; }
        .nav-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .nav-btn:hover { background-color: var(--accent); }

        /* --- Chapter Grid (Forced 5x5) --- */
        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); /* Exactly 5 columns */
            grid-template-rows: repeat(5, 1fr);    /* Exactly 5 rows */
            gap: 10px;
            flex-grow: 1; /* Dynamically takes up all remaining vertical space */
            margin-bottom: 15px;
        }
        
        .chapter-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            padding: 5px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-decoration: none; 
            color: var(--text-main);
        }
        
        .chapter-card:hover { 
            background-color: var(--accent); 
            transform: scale(1.02); 
            border-color: var(--text-muted);
        }
        
        .chapter-num { font-size: 1rem; font-weight: bold; }
        .chapter-name { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; padding: 0 4px; line-height: 1.2; }

        /* --- Mock Test Section --- */
        .mock-test-container {
            text-align: center;
            border-top: 1px solid var(--border);
            padding-top: 15px;
            flex-shrink: 0; /* Prevents button area from squishing */
        }
        
        .mock-test-btn {
            padding: 10px 30px;
            font-size: 1rem;
            letter-spacing: 1px;
            background-color: var(--highlight);
            border-color: var(--highlight);
            display: inline-block;
        }
        .mock-test-btn:hover {
            background-color: #666666;
            border-color: var(--text-main);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- LANDING PAGE -->
        <div id="landing-page" class="view-section" style="display: flex;">
            <h1 class="title">Air Navigation</h1>
            <p class="subtitle">DGCA CPL Ground School Terminal</p>
            <button class="btn" onclick="initSystem()">Initialize System</button>
        </div>

        <!-- CHAPTERS LIST -->
        <div id="chapters-page" class="view-section">
            <div class="header-bar">
                <h2>Syllabus Index</h2>
                <button class="nav-btn" onclick="powerOff()">Power Off</button>
            </div>
            
            <div class="chapter-grid" id="chapter-grid-container">
                <!-- JavaScript generates exactly 25 links here in a 5x5 grid -->
            </div>

            <!-- Dedicated Mock Tests Button -->
            <div class="mock-test-container">
                <a href="mock_tests.html" class="btn mock-test-btn">Mock Tests</a>
            </div>
        </div>

    </div>

    <script>
        const chapterTitles = { 
            1: "The Earth",
            2: "Distances on Earth's Surface",
            3: "Convergency",
            4: "Payload",
            5: "Compass & Direction",
            6: "Dead Reckoning",
            7: "In Flight Navigation",
            8: "Scale & Projections",
            9: "Solar System & Time",
            10:"PNR/CP",
            11: "Air Speed Indicator",
            12: "Altimeter",
            13: "Vertical Speed Indicator",
            14: "Temperature",
            15: "Magnetism",
            16: "Gyroscope",
            17: "INS/IRS",
            18: "Basic Radio Theory",
            19: "ADF & NDB",
            20: "Track & Drift",
            21: "VOR",
            22: "ILS",
            23: "Radar",
            24: "Performance",
            25: "GNSS"
        };

        const chapterContainer = document.getElementById('chapter-grid-container');
        for (let i = 1; i <= 25; i++) {
            let a = document.createElement('a');
            a.className = 'chapter-card';
            
            a.href = `ch${i}.html`; 
            
            let titleText = chapterTitles[i] ? `<div class="chapter-name">${chapterTitles[i]}</div>` : ``;
            a.innerHTML = `<div class="chapter-num">CH ${i}</div> ${titleText}`;
            
            chapterContainer.appendChild(a);
        }

        function initSystem() {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('chapters-page').style.display = 'flex';
        }

        function powerOff() {
            document.getElementById('chapters-page').style.display = 'none';
            document.getElementById('landing-page').style.display = 'flex';
        }
    </script>
</body>
</html>
