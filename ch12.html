    <style>
        :root {
            --bg-color: #050505; --panel-bg: #121212; --text-main: #f0f0f0; --text-muted: #888888;
            --accent: #2a2a2a; --accent-hover: #404040; --border: #333333; --highlight: #555555;
            --correct-bg: #1e4620; --correct-border: #4caf50; --wrong-bg: #4a1919; --wrong-border: #f44336;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 95%; max-width: 1200px; background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); padding: 30px; min-height: 85vh; display: flex; flex-direction: column; position: relative; }
        .view-section { display: none; flex-direction: column; flex-grow: 1; animation: fadeIn 0.3s ease-in-out; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .nav-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; cursor: pointer; border-radius: 4px; transition: background 0.2s; text-decoration: none; }
        .nav-btn:hover { background-color: var(--accent); }
        .btn { background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); padding: 15px 50px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .btn:hover { background-color: var(--accent); border-color: var(--text-main); }
        
        .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        .module-card { background-color: var(--bg-color); border: 1px solid var(--border); padding: 50px 40px; text-align: center; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .module-card:hover { background-color: var(--accent); border-color: var(--text-muted); transform: translateY(-5px); }
        .module-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .module-card p { color: var(--text-muted); font-family: 'Courier New', monospace; }
        
        .content-area { background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; padding: 25px; flex-grow: 1; font-size: 1.1rem; line-height: 1.7; color: #d0d0d0; overflow-y: auto; max-height: 68vh; }
        
        .quiz-top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .quiz-top-header h2 { margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }
        .score-tracker { font-size: 1rem; font-weight: bold; color: var(--text-muted); }
        .score-right { color: var(--correct-border); }
        .score-wrong { color: var(--wrong-border); }

        .progress-bar-container { width: 100%; background-color: var(--accent); border-radius: 8px; height: 6px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--text-muted); width: 0%; transition: width 0.3s ease; }
        .question-text { font-size: 1.25rem; margin-bottom: 25px; line-height: 1.4; font-weight: 500; color: var(--text-main); } 
        
        .mcq-options { display: flex; flex-direction: column; gap: 10px; }
        .mcq-option { background-color: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 15px 20px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1.05rem; transition: all 0.2s; }
        .mcq-option:hover:not(.disabled) { background-color: var(--accent); }
        .mcq-option.disabled { cursor: default; }
        .mcq-option.correct { background-color: var(--correct-bg); border-color: var(--correct-border); }
        .mcq-option.wrong { background-color: var(--wrong-bg); border-color: var(--wrong-border); }
        
        .feedback-box { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: left; font-weight: 600; display: none; font-size: 1rem; }
        .feedback-correct { display: block; background-color: rgba(76, 175, 80, 0.15); color: var(--correct-border); border: 1px solid var(--correct-bg); padding: 15px; font-size: 1.15rem; margin-bottom: 15px; }
        .feedback-solution { display: block; background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border); padding: 20px; font-size: 1.05rem; font-weight: normal; }
        
        .quiz-nav-controls { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--accent); }
        .quiz-nav-btn { background-color: var(--highlight); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; min-width: 110px; }
        .quiz-nav-btn:hover:not(:disabled) { background-color: #666666; }
        .quiz-nav-btn:disabled { background-color: var(--bg-color); color: #555; cursor: not-allowed; border: 1px solid #333; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'flex';
        }

        // ==========================================
        // DATA ARRAYS (Empty for now)
        // ==========================================
        const theory_mcqs = [
            // Format: { q: "Question?", options: ["a) Opt 1", "b) Opt 2"], correct: 0, sol: "<strong>Expl:</strong> text" }
            {
        q: "A servo altimeter has a quoted accuracy of 1 hPa at mean sea level. The accuracy in the standard atmosphere is:",
        options: [
            "a) +- 50 ft at 10 000 ft and +- 100 ft at 40 000 ft",
            "b) +- 50 ft at 20 000 ft and +- 90 ft at the tropopause",
            "c) +- 27 ft at MSL and +- 50 ft at 10 000 ft",
            "d) +- 10 ft at MSL and +- 100 ft at 10 000 ft"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> A pressure change of 1 hPa corresponds to approximately 27 feet at Mean Sea Level (MSL) and approximately 50 feet at 10,000 feet due to decreasing air density at higher altitudes."
    },
    {
        q: "Position error is caused due to",
        options: [
            "a) Ground effect",
            "b) Configuration of A/C",
            "c) All of the above",
            "d) None of the above"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Position (or pressure) error occurs when the static port senses a pressure that differs from the true ambient atmospheric pressure. This disturbance is caused by airspeed, aircraft configuration (flaps/gear), and ground effect."
    },
    {
        q: "Pressure error is maximum at:",
        options: [
            "a) High speed and high altitude",
            "b) Low level and high speed",
            "c) As in and under ground effect",
            "d) Low speed and high altitude"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Ground effect heavily disrupts the airflow and localized pressure field around the static ports, creating significant position/pressure error close to the ground."
    },
    {
        q: "A servo altimeter is _________________ than a conventional one because of _______________ :",
        options: [
            "a) More accurate, electrical servos",
            "b) More accurate, electrical pick off coils.",
            "c) Less accurate, electrical servos",
            "d) Less accurate, mechanical linkages"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> Servo altimeters utilize an electromechanical E-and-I bar transducer (electrical pick-off coils) which eliminates the internal friction and mechanical lag found in conventional altimeters, greatly improving accuracy."
    },
    {
        q: "What will happen if an a/c has 2 altimeters, one of which is compensated for position error, whilst the other is not:",
        options: [
            "a) One will over read at high air speed",
            "b) One will under read at high air speed",
            "c) One will under read close to the ground.",
            "d) Both will read the same at all times."
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Close to the ground, position error is amplified due to ground effect (typically causing an under-reading of static pressure). The uncompensated altimeter will be subject to this error, whereas the compensated one will read accurately."
    },
    {
        q: "The purpose of stand by static source is:",
        options: [
            "a) To reduce position error",
            "b) To be used in emergency",
            "c) Both a and b",
            "d) To increase static pressure reading"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> An alternate (standby) static source provides a secondary means of static pressure in the event the primary static ports become blocked by ice or debris."
    },
    {
        q: "If static source of a/c is blocked in un pressurized a/c the correct action for pilot will be:",
        options: [
            "a) Break glass of altimeter",
            "b) Break glass of VSI",
            "c) Use stand by static source.",
            "d) Descend immediately"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> If a standby static source is available, selecting it is the primary emergency action. Breaking the VSI glass is a secondary alternative if no standby source is fitted."
    },
    {
        q: "White zebra crossing on altimeter appears when:",
        options: [
            "a) a/c is below MSA (minimum safe altitude)",
            "b) a/c is above, 10,000'",
            "c) a/c is below 10,000'",
            "d) a/c is above 20,000'"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> A crosshatch or zebra warning flag appears on drum-pointer altimeters when the aircraft descends below 10,000 feet to prevent the pilot from misreading the 10,000-foot pointer by a factor of ten."
    },
    {
        q: "When flying from a sector of warm air into one of colder air, the altimeter will?",
        options: [
            "a) Under read.",
            "b) Over read.",
            "c) Show the actual height above ground.",
            "d) Remain unaffected."
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> \"Hot to cold, don't be bold.\" When flying into colder (denser) air, the pressure levels compress and are physically lower. Your true altitude will be lower than indicated, meaning the instrument is over-reading."
    },
    {
        q: "Temp. error in altimeter is caused due to:",
        options: [
            "a) Non standard MSL temp",
            "b) Non standard temp lapse rate",
            "c) Non standard temp at a/c altitude",
            "d) Frictional heating of the static port"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Temperature error arises because the actual temperature of the column of air differs from International Standard Atmosphere (ISA) conditions, affecting the density and pressure lapse rate."
    },
    {
        q: "Bimetallic strip in altimeter is provided",
        options: [
            "a) To compensate for temp. error",
            "b) To compensate for thermal expansion of mechanical linkages.",
            "c) To compensate for adiabatic rise in temperature of temp error.",
            "d) To correct for static pressure errors."
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> The internal bimetallic compensator only corrects for the expansion and contraction of the instrument's own internal mechanical components due to ambient casing temperature, not external atmospheric temperature deviations."
    },
    {
        q: "Pressure error in an altimeter arises because:",
        options: [
            "a) The true external dynamic pressure is not accurately transmitted to the instrument",
            "b) The true external static pressure is not accurately transmitted to the instrument",
            "c) The true external kinetic pressure is not accurately transmitted to the instrument",
            "d) The aneroid capsule expands unevenly"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> Pressure (position) error occurs when airflow disturbances prevent the static port from sensing the true, undisturbed ambient static pressure of the atmosphere."
    },
    {
        q: "In a non-pressurized aircraft, if one or several static pressure ports are damaged, there is an ultimate emergency means for restoring a practically correct static pressure intake:",
        options: [
            "a) breaking the rate-of-climb indicator glass window",
            "b) Slightly opening a window to restore the ambient pressure in the cabin",
            "c) calculating the ambient static pressure, allowing for the altitude and QNH adjusting the instruments",
            "d) applying suction to the static port"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> Breaking the VSI (Vertical Speed Indicator) glass links the static system to the ambient cabin pressure, restoring functionality to the altimeter and airspeed indicator, albeit with some minor cabin pressure error."
    },
    {
        q: "The pressure altitude is the altitude corresponding:",
        options: [
            "a) in ambient atmosphere, to the reference pressure Ps",
            "b) in standard atmosphere, to the reference pressure Ps",
            "c) in standard atmosphere, to the pressure Ps prevailing at this point",
            "d) in ambient atmosphere, to mean sea level pressure"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Pressure altitude is the height in the International Standard Atmosphere (ISA) where the current ambient pressure (Ps) would exist. It is found by setting 1013.25 hPa on the subscale."
    },
    {
        q: "The altimeter consists of several aneroid capsules located in a sealed casing. The pressure in the aneroid capsule (i) and casing (ii) are respectively:",
        options: [
            "a) (i) static pressure at time t (ii) static pressure at time t-1",
            "b) (i) vacuum (or a very low pressure) (ii) static pressure",
            "c) (i) static pressure (ii) total pressure",
            "d) (i) total pressure (ii) static pressure"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> Altimeters contain partially evacuated (vacuum) aneroid capsules enclosed within an instrument case that is fed by external static pressure. The capsule expands/contracts as case pressure changes."
    },
    {
        q: "Altimeter gives height of aircraft with Respect To:",
        options: [
            "a) M.S.L.",
            "b) A.G.L.",
            "c) Set Datum",
            "d) Standard Tropopause"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> An altimeter indicates vertical distance above whatever pressure datum is set in its subscale window (e.g., QNH for MSL, QFE for AGL, or 1013.25 for Pressure Altitude)."
    },
    {
        q: "We are maintaining a constant flight level. That means:",
        options: [
            "a) the outside air pressure is constant if the temperature remains constant.",
            "b) the outside air pressure is constant.",
            "c) the altitude is constant when the sea-level pressure is constant.",
            "d) the density altitude is constant."
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> A flight level represents a surface of constant atmospheric pressure based on the standard 1013.25 hPa datum. When maintaining a flight level, ambient static pressure is constant."
    },
    {
        q: "The altitude indicated on board an aircraft flying in an atmosphere where all atmosphere layers below the aircraft are warm is:",
        options: [
            "a) the same as the real altitude",
            "b) Lower than the real altitude",
            "c) equal to the standard altitude",
            "d) Higher than the real altitude"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> Warm air expands, increasing the vertical distance between pressure levels. True altitude is higher than standard, meaning the altimeter will indicate an altitude that is lower than the true altitude."
    },
    {
        q: "In case of accidental closing of an aircraft's left static pressure port (rain, birds), the altimeter:",
        options: [
            "a) Over reads the altitude in case of a sideslip to the left and displays the correct information during symmetric flight",
            "b) keeps on providing reliable reading in all situations",
            "c) Under reads the altitude",
            "d) Freezes at the current altitude"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> In symmetric flight, the clear right port senses normal static pressure. In a sideslip left, the clear right port is in the aerodynamic 'wake' (suction), sensing lower pressure and causing the altimeter to over-read."
    },
    {
        q: "The altimeter is fed by:",
        options: [
            "a) differential pressure",
            "b) dynamic pressure",
            "c) static pressure",
            "d) pitot pressure"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> The barometric altimeter operates exclusively on ambient static pressure obtained from the static ports."
    },
    {
        q: "The advantage of sensitive altimeter over service altimeter is.",
        options: [
            "a) It does not form lag error.",
            "b) Instrument error is really eliminated.",
            "c) It can be used up to higher altitude",
            "d) It has no position error."
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Sensitive altimeters typically employ a stack of multiple aneroid capsules and geared pointers, allowing for highly accurate pressure sensing across a much greater range of higher altitudes."
    },
    {
        q: "The error in altimeter readings caused by the variation of the static pressure near the source is known as:",
        options: [
            "a) position pressure error",
            "b) barometric error",
            "c) hysteresis effect",
            "d) temperature error"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> Changes in dynamic airflow around the static vent cause the sensed pressure to differ from undisturbed atmospheric pressure. This is called position or pressure error."
    },
    {
        q: "If the static source of an altimeter becomes blocked during a descent the instrument will:",
        options: [
            "a) under-read",
            "b) gradually indicate zero",
            "c) continue to display the reading at which the blockage occurred",
            "d) over-read"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> A blockage seals the pressure inside the instrument casing. The altimeter cannot sense the increasing external pressure during descent and will freeze at the altitude where the blockage occurred."
    },
    {
        q: "The primary factor which makes the servo-assisted altimeter more accurate than the simple pressure altimeter is the use of:",
        options: [
            "a) an induction pick-off device",
            "b) more effective temperature compensating leaf springs",
            "c) combination of counters/pointers",
            "d) dynamic pressure compensation"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> The induction pick-off (E-and-I bar transducer) reads capsule expansion electrically, removing mechanical linkages. This dramatically reduces friction and mechanical lag errors."
    },
    {
        q: "At sea level, on a typical servo altimeter, the tolerance in feet from indicated must not exceed:",
        options: [
            "a) +/- 30ft",
            "b) +/- 75ft",
            "c) +/- 60ft",
            "d) +/- 100ft"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> According to DGCA question bank standards, the standard acceptable tolerance for a servo altimeter near sea level is typically specified as +/- 60 feet in this context."
    },
    {
        q: "An aircraft is flying straight and level, over a warm air mass. The altimeter reading will be:",
        options: [
            "a) Greater than the real height",
            "b) less than the real height",
            "c) correct",
            "d) fluctuating"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> Warm air creates expanded pressure levels, putting the aircraft physically higher than standard. Thus, the indicated altitude on the altimeter will be less than the true, real height."
    },
    {
        q: "When flying from a sector of warm air into one of colder air, the altimeter will:",
        options: [
            "a) be just as correct as before",
            "b) Under read",
            "c) Over read",
            "d) Freeze"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Flying from warm to cold air (\"High to Low, Look out below\"), true altitude drops below indicated altitude. The altimeter indicates higher than the actual aircraft height, so it over-reads."
    },
    {
        q: "The hysteresis error of an altimeter varies substantially with the:",
        options: [
            "a) Aircraft altitude",
            "b) time passed at a given altitude",
            "c) mach number of the aircraft",
            "d) static air temperature"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> Hysteresis is a time-dependent mechanical deformation. The longer an aneroid capsule remains compressed at a high altitude, the more time it takes to restore its original shape during a rapid descent."
    },
    {
        q: "A pilot is given a QNH of 1003 hPa while coming in to land. He forgets to re-set his altimeter. The error experienced will be.",
        options: [
            "a) Aircraft altitude",
            "b) Pilot Error",
            "c) Barometric error",
            "d) Position error"

        }

        function selectPdfOption(selectedIndex) { 
            pdfAnswers[currentPdfIndex] = selectedIndex;
            if (selectedIndex === pdf_mcqs[currentPdfIndex].correct) {
                pdfRightCount++;
                document.getElementById('pdf-right').innerText = pdfRightCount;
            } else {
                pdfWrongCount++;
                document.getElementById('pdf-wrong').innerText = pdfWrongCount;
            }
            renderPdf(); 
        }
        function goPrevPdf() { if (currentPdfIndex > 0) { currentPdfIndex--; renderPdf(); } }
        function goNextPdf() { if (currentPdfIndex < pdf_mcqs.length - 1) { currentPdfIndex++; renderPdf(); } }

        // ==========================================
        // NUMERICAL ENGINE LOGIC (Flashcard Format)
        // ==========================================
        let currentNumIndex = 0;

        function startNum() {
            if (numerical_data.length === 0) { alert("Numerical Engine is empty."); return; }
            switchView('num-page');
            currentNumIndex = 0;
            renderNum();
        }

        function renderNum() {
            if (numerical_data.length === 0) return;
            const qData = numerical_data[currentNumIndex];
            
            document.getElementById('num-counter').innerText = `Numerical Q${currentNumIndex + 1} of ${numerical_data.length}`;
            document.getElementById('num-progress').style.width = `${((currentNumIndex + 1) / numerical_data.length) * 100}%`;
            document.getElementById('num-q-text').innerHTML = `<strong>Q${currentNumIndex + 1}.</strong> ` + qData.q;
            
            const ansBox = document.getElementById('num-ans-box');
            ansBox.innerHTML = `<strong>Answer:</strong><br>${qData.ans}`;
            ansBox.style.display = 'none';
            
            const solBox = document.getElementById('num-sol-box');
            solBox.innerHTML = qData.sol;
            solBox.style.display = 'none';
            
            document.getElementById('num-prev-btn').disabled = currentNumIndex === 0;
            document.getElementById('num-next-btn').disabled = currentNumIndex === numerical_data.length - 1;
        }

        function goPrevNum() { if (currentNumIndex > 0) { currentNumIndex--; renderNum(); } }
        function goNextNum() { if (currentNumIndex < numerical_data.length - 1) { currentNumIndex++; renderNum(); } }

        // ==========================================
        // HELPER FUNCTIONS
        // ==========================================
        function handleSolutionBox(prefix, qData, hasAnswered) {
            const solArea = document.getElementById(`${prefix}-sol-area`);
            const solBox = document.getElementById(`${prefix}-sol-box`);
            const revealBtn = document.getElementById(`${prefix}-reveal-btn`);
            
            if (qData.sol) {
                solArea.style.display = 'block';
                solBox.innerHTML = qData.sol;
                solBox.style.display = 'none';
                
                if (hasAnswered) {
                    revealBtn.style.display = 'inline-block';
                    revealBtn.onclick = () => { solBox.style.display = 'block'; };
                } else {
                    revealBtn.style.display = 'none';
                }
            } else {
                solArea.style.display = 'none';
            }
        }

        window.onload = function() {
            document.getElementById('theory-card-count').innerText = theory_mcqs.length + " MCQs";
            document.getElementById('pdf-card-count').innerText = pdf_mcqs.length + " MCQs";
            document.getElementById('num-card-count').innerText = numerical_data.length + " Problems";
        };
    </script>
</body>
</html>
