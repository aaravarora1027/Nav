        .module-card:hover { background-color: var(--accent); border-color: var(--text-muted); transform: translateY(-5px); }
        .module-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .module-card p { color: var(--text-muted); font-family: 'Courier New', monospace; }
        
        .content-area { background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; padding: 25px; flex-grow: 1; font-size: 1.1rem; line-height: 1.7; color: #d0d0d0; overflow-y: auto; max-height: 68vh; }
        
        .quiz-top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .quiz-top-header h2 { margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }
        .progress-bar-container { width: 100%; background-color: var(--accent); border-radius: 8px; height: 6px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--text-muted); width: 0%; transition: width 0.3s ease; }
        .question-text { font-size: 1.25rem; margin-bottom: 25px; line-height: 1.4; font-weight: 500; color: var(--text-main); } 
        
        .mcq-options { display: flex; flex-direction: column; gap: 10px; }
        .mcq-option { background-color: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 15px 20px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1.05rem; transition: all 0.2s; }
        .mcq-option:hover:not(.disabled) { background-color: var(--accent); }
        .mcq-option.disabled { cursor: default; }
        .mcq-option.correct { background-color: var(--correct-bg); border-color: var(--correct-border); }
        .mcq-option.wrong { background-color: var(--wrong-bg); border-color: var(--wrong-border); }
        
        .feedback-box { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: left; font-weight: 600; display: none; font-size: 1rem; }
        .feedback-correct { display: block; background-color: rgba(76, 175, 80, 0.15); color: var(--correct-border); border: 1px solid var(--correct-bg); padding: 15px; font-size: 1.15rem; margin-bottom: 15px; }
        .feedback-solution { display: block; background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border); padding: 20px; font-size: 1.05rem; font-weight: normal; }
        
        .quiz-nav-controls { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--accent); }
        .quiz-nav-btn { background-color: var(--highlight); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; min-width: 110px; }
        .quiz-nav-btn:hover:not(:disabled) { background-color: #666666; }
        .quiz-nav-btn:disabled { background-color: var(--bg-color); color: #555; cursor: not-allowed; border: 1px solid #333; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'flex';
        }

        // ==========================================
        // QUIZ DATA (Theory Engine - Multiple Choice)
        // ==========================================
        const quizData = [
            {
                q: "A servo altimeter has a quoted accuracy of 1 hPa at mean sea level. The accuracy in the standard atmosphere is:",
                options: ["a) +- 50 ft at 10 000 ft and +- 100 ft at 40 000 ft", "b) +- 50 ft at 20 000 ft and +- 90 ft at the tropopause", "c) +- 27 ft at MSL and +- 50 ft at 10 000 ft"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>At Mean Sea Level (MSL), 1 hPa of pressure change equals roughly 27 feet of altitude change. As you climb, air density decreases, meaning you have to climb higher to see the same 1 hPa drop. At 10,000 ft, 1 hPa equates to approximately 50 feet."
            },
            {
                q: "Position error is caused due to",
                options: ["a) Ground effect", "b) Configuration of A/C", "c) All of the above"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Position error (or pressure error) is caused by disturbances in the static pressure field around the aircraft's skin. This airflow disturbance changes based on the aircraft's configuration (flaps/gear) and its proximity to the ground (ground effect)."
            },
            {
                q: "Pressure error is maximum at:",
                options: ["a) High speed and high altitude", "b) Low level and high speed", "c) As in and under ground effect"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Pressure (position) error is generally highest when airflow around the static ports is most violently disturbed or compressed, which occurs significantly when flying low in ground effect."
            },
            {
                q: "A servo altimeter is ___________ than a conventional one because of ___________:",
                options: ["a) More accurate, electrical servos", "b) More accurate, electrical pick off coils.", "c) Less accurate, electrical servos"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Servo altimeters use an electromagnetic pick-off coil (like an E-and-I bar) rather than direct mechanical gears. This eliminates physical friction and lag, making them highly accurate."
            },
            {
                q: "What will happen if an a/c has 2 altimeters, one of which is compensated for position error, whilst the other is not:",
                options: ["a) One will over read at high air speed", "b) One will under read at high air speed", "c) One will under read close to the ground."],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Position error significantly alters the static pressure field in ground effect, generally causing the static port to sense higher pressure. Higher pressure causes an altimeter to under-read. The uncompensated altimeter will show this error close to the ground."
            },
            {
                q: "The purpose of stand by static source is:",
                options: ["a) To reduce position error", "b) To be used in emergency", "c) Both a and b"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The standby (alternate) static source is strictly an emergency backup to provide ambient pressure to the flight instruments in the event the primary external static ports become blocked by ice or debris."
            },
            {
                q: "If static source of a/c is blocked in un pressurized a/c the correct action for pilot will be:",
                options: ["a) Break glass of altimeter", "b) Break glass of VSI", "c) Use stand by static source."],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>If equipped, you must always select the standby static source first. Breaking the VSI glass to vent cabin pressure into the static lines is a last-resort emergency method only used if no standby source is available."
            },
            {
                q: "White zebra crossing on altimeter appears when:",
                options: ["a) a/c is below MSA (minimum safe altitude)", "b) a/c is above, 10,000'", "c) a/c is below 10,000"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>A white striped (zebra) sector is visible on older drum-pointer altimeters to indicate low altitude (typically below 10,000 feet). This visual warning prevents pilots from making critical altitude misreading errors (e.g., confusing 1,000 ft for 11,000 ft)."
            },
            {
                q: "When flying from a sector of warm air into one of colder air, the altimeter will?",
                options: ["a) Under read.", "b) Over read.", "c) Show the actual height above ground."],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>\"Hot to Cold, Don't be bold.\" In colder air, density is higher and pressure drops faster with height. The altimeter interprets this lower pressure as being higher up. Thus, it over-reads (Indicated > True)."
            },
            {
                q: "Temp. error in altimeter is caused due to:",
                options: ["a) Non standard MSL temp", "b) Non standard temp lapse rate", "c) Non standard temp at a/c altitude"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Temperature error occurs because the altimeter is mechanically calibrated for ISA standard temperature. Non-standard temperatures in the air mass at the aircraft's altitude alter the air density and the true pressure lapse rate."
            },
            {
                q: "Bimetallic strip in altimeter is provided",
                options: ["a) To compensate for temp. error", "b) To compensate for thermal expansion of mechanical linkages.", "c) To compensate for adiabatic rise in temperature of temp error."],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The bimetallic strip inside the instrument casing compensates for the physical expansion and contraction of the instrument's own internal mechanical linkages due to cockpit temperature changes, NOT the aerodynamic temperature error of the outside air."
            },
            {
                q: "Pressure error in an altimeter arises because:",
                options: ["a) The true external dynamic pressure is not accurately transmitted to the instrument", "b) The true external static pressure is not accurately transmitted to the instrument", "c) The true external kinetic pressure is not accurately transmitted to the instrument"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Pressure error (position error) is caused by turbulent airflow over the aircraft's skin disrupting the static port, preventing it from sensing the true undisturbed ambient (static) atmospheric pressure."
            },
            {
                q: "In a non-pressurized aircraft, if one or several static pressure ports are damaged, there is an ultimate emergency means for restoring a practically correct pressure intake:",
                options: ["a) breaking the rate-of-climb indicator glass window", "b) Slightly opening a window to restore the ambient pressure in the cabin", "c) calculating the ambient static pressure, allowing for the altitude and QNH adjusting the instruments"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>In unpressurized aircraft without an alternate static source, breaking the glass of the VSI (Rate of Climb Indicator) vents the static line to the cabin pressure, which is roughly equal to ambient outside static pressure."
            },
            {
                q: "The pressure altitude is the altitude corresponding:",
                options: ["a) in ambiant atmosphere, to the reference pressure Ps", "b) in standard atmosphere, to the reference pressure Ps", "c) in standard atmosphere, to the pressure Ps prevailing at this point"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Pressure altitude is defined as the vertical distance (height) in the theoretical International Standard Atmosphere (ISA) that corresponds to the ambient static pressure (Ps) currently being measured by the aircraft."
            },
            {
                q: "The altimeter consists of several aneroid capsules located in a sealed casing. The pressure in the aneroid capsule (i) and casing (ii) are respectively:",
                options: ["a) (i) static pressure at time t (ii) static pressure at time t-t", "b) (i) vacuum (or a very low pressure) (ii) static pressure", "c) (i) static pressure (ii) total pressure"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>An altimeter uses an evacuated (vacuum) aneroid capsule to provide a fixed baseline reference. The airtight casing surrounding the capsule is fed with the ambient static pressure, allowing the capsule to crush or expand as altitude changes."
            },
            {
                q: "Altimeter gives height of aircraft with Respect To :",
                options: ["a) M.S.L.", "b) A.G.L.", "c) Set Datum"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>An altimeter is simply an absolute pressure gauge. It gives your height relative to whatever arbitrary pressure datum (QNH for MSL, QFE for AGL, QNE for Flight Levels) the pilot manually dials into the sub-scale."
            },
            {
                q: "We are maintaining a constant flight level. That means:",
                options: ["a) the outside air pressure is constant if the temperature remains constant.", "b) the outside air pressure is constant.", "c) the altitude is constant when the sea-level pressure is constant."],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>A \"Flight Level\" is an isobaric surface (a surface of constant atmospheric pressure) based on 1013.25 hPa. Therefore, flying a constant FL means flying at a constant outside air pressure, regardless of what the temperature is doing."
            },
            {
                q: "The altitude indicated on board an aircraft flying in an atmosphere where all atmosphere layers below the aircraft are warm is:",
                options: ["a) the same as the real altitude", "b) Lower than the real altitude", "c) equal to the standard altitude"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>\"High to Low, Look out below.\" Warm air is less dense, so pressure drops slower as you climb. Because the pressure is higher than standard for that true altitude, the altimeter thinks it is lower down. Therefore, the indicated altitude is lower than your real, true altitude. <em>(Note: Text adjusted slightly from the blurry image to match the correct DGCA 'b' physics)</em>."
            },
            {
                q: "In case of accidental closing of an aircraft's left static pressure port (rain, birds), the altimeter:",
                options: ["a) Over reads the altitude in case of a sideslip to the left and displays the correct information during symmetric flight", "b) keeps on providing reliable reading in all situations", "c) Under reads the altitude"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>In symmetric flight, the open right port provides correct pressure. In a sideslip to the left, the relative wind hits the left side, putting the right port on the leeward (shielded) side. The leeward side experiences lower pressure. Lower pressure causes the altimeter to over-read."
            },
            {
                q: "The altimeter is fed by:",
                options: ["a) differential pressure", "b) dynamic pressure", "c) static pressure"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Unlike the Airspeed Indicator, the altimeter is connected exclusively to the static system to measure ambient atmospheric pressure."
            },
            {
                q: "The advantage of sensitive altimeter over service altimeter is.",
                options: ["a) It does not form lag error.", "b) Instrument error is really eliminated.", "c) It can be used up to higher altitude"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Sensitive altimeters utilize multiple, highly refined aneroid capsules that allow them to accurately measure a much wider range of minute pressure changes, making them suitable for high altitude operations."
            },
            {
                q: "The error in altimeter readings caused by the variation of the static pressure near the source is known as:",
                options: ["a) position pressure error", "b) barometric error", "c) hysteresis effect"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Disruptions to the local static pressure field around the aircraft's skin (due to airflow, flaps, or gear) cause position error, also formally called pressure error."
            },
            {
                q: "If the static source of an altimeter becomes blocked during a descent the instrument will:",
                options: ["a) under-read", "b) gradually indicate zero", "c) continue to display the reading at which the blockage occurred"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>The altimeter relies entirely on changing static pressure. If blocked, the pressure inside the instrument case is completely trapped, and the altimeter will physically freeze at the altitude where the blockage happened."
            },
            {
                q: "The primary factor which makes the servo-assisted altimeter more accurate than the simple pressure altimeter is the use of:",
                options: ["a) an induction pick-off device", "b) more effective temperature compensating leaf springs", "c) combination of counters/pointers"],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>An induction pick-off device (like an E-and-I bar) removes the mechanical friction and linkage lag present in traditional aneroid altimeters, massively improving sensitivity and accuracy."
            },
            {
                q: "At sea level, on a typical servo altimeter, the tolerance in feet from indicated must not exceed:",
                options: ["a) +/- 30ft", "b) +/- 75ft", "c) +/- 60ft"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>For a standard IFR-certified servo altimeter, the allowed mechanical tolerance (instrument error) on the ground at sea level is strictly limited to +/- 60 feet."
            },
            {
                q: "An aircraft is flying straight and level, over a warm air mass. The altimeter reading will be:",
                options: ["a) Greater than the real height", "b) less than the real height", "c) correct"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>\"Hot to Cold, Don't be bold.\" In a warm air mass, pressure drops more slowly with altitude. Because the pressure is higher than standard, the altimeter thinks it is at a lower altitude. Therefore, the indicated reading will be LESS than the real true height."
            },
            {
                q: "When flying from a sector of warm air into one of colder air, the altimeter will:",
                options: ["a) be just as correct as before", "b) Under read", "c) Over read"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>In colder air, density is higher and pressure drops faster with altitude. The altimeter interprets this abnormally low pressure as being higher up. Thus, it over-reads (Indicated > True)."
            },
            {
                q: "The hysteresis error of an altimeter varies substantially with the:",
                options: ["a) Aircraft altitude", "b) time passed at a given altitude", "c) mach number of the aircraft"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Hysteresis is a material memory effect in the aneroid capsule metal. If an aircraft stays at a high altitude for a long time, the capsule gets \"used\" to that shape and is slow to recover during descent. The error heavily depends on the time passed at that altitude."
            },
            {
                q: "A pilot is given a QNH of 1003 hPa while coming in to land. He forgets to re-set his altimeter. The error experienced will be.",
                options: ["a) Pilot Error", "b) Pressure Error", "c) Barometric error"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Failing to set the correct sub-scale pressure setting (QNH, QFE, or Standard) in the Kollsman window directly results in Barometric Error."
            },
            {
                q: "For an altimeter, pressure fluctuations at the static vent cause:",
                options: ["a) Barometric error", "b) Position error", "c) Hysteresis error"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Any fluctuations or inaccuracies at the static vent caused by turbulent airflow over the aircraft's skin are classified as Position Error."
            },
            {
                q: "An aircraft is passing 6,500 ft in a descent when the static line becomes blocked. The altimeter then reads:",
                options: ["a) less than 6,500 ft", "b) zero", "c) 6,500 ft"],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>A static blockage permanently traps the ambient pressure inside the instrument at that exact moment. It will freeze and continue to read the altitude at which it was blocked (6,500 ft) regardless of further descent."
            },
            {
                q: "The purpose of the vibrating device of an altimeter is to?",
                options: ["a) Allow damping of the measurement in the unit.", "b) Reduce the hysteresis effect.", "c) Reduce the effect of friction in the linkages."],
                correct: 2,
                sol: "<strong>Step-by-Step Resolution:</strong><br>A vibrator (or tapper) gently shakes the internal mechanical linkages. This overcomes static friction (stiction), allowing the pointer to move smoothly and respond to small pressure changes."
            },
            {
                q: "Lag error in servo assisted altimeter is virtually removed by:",
                options: ["a) Electromechanical pick off device.", "b) Rocking mechanism.", "c) Using more than one capsule in series."],
                correct: 0,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Traditional mechanical gears have friction that causes lag. Servo altimeters use an electromechanical pick-off (like an E-and-I bar) which has no physical friction, virtually eliminating lag error."
            },
            {
                q: "Transducer in servo assisted altimeter is used to",
                options: ["a) Increase sensitivity of altimeter", "b) to remove lag error.", "c) All the above"],
                correct: 1,
                sol: "<strong>DGCA Key Note:</strong><br>While transducers (pick-offs) effectively accomplish both, the specific DGCA answer key for this question marks <strong>b) to remove lag error</strong> as the primary correct answer."
            },
            {
                q: "In an aircraft a static source is so placed that it is having subjected to dynamic pressure. The error caused of any will be known as:",
                options: ["a) There will be no error", "b) Position Error", "c) Dynamic Pressure Error"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>If the static port inadvertently captures dynamic pressure (ram air) due to poor placement or airflow disruption over the skin, it fails to read true static pressure. This is the definition of Position Error."
            },
            {
                q: "The principle of operation of a servo-assisted pressure altimeter is that:",
                options: ["a) static pressure is used in the same way as a simple altimeter except that several capsules are used", "b) static pressure changes are converted via an E- and I-bar transducer into electrical signal which is used, via a follow-up system, to move a digital counter and pointer system"],
                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>Instead of a direct mechanical gear linkage, the expansion of the capsules moves an I-bar within an E-bar (an inductive transducer), creating an electrical signal that drives a servo motor to display the altitude."
            },
            {
                q: "When flying from low pressure to high pressure, the barometric error of an altimeter will cause the instrument to:",

                correct: 1,
                sol: "<strong>Step-by-Step Resolution:</strong><br>In a right sideslip, the wind hits the right side, creating higher localized dynamic pressure on the right port. Since the left port (which would normally balance it with low leeward pressure) is blocked, the system senses higher pressure. Higher pressure = lower indicated altitude (Under read)."

        let activeQuizData = [];
        let currentQuizIndex = 0;
        let quizAnswers = [];

        function shuffleQuiz(dataArray) {
            let shuffledData = JSON.parse(JSON.stringify(dataArray));
            for (let i = shuffledData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledData[i], shuffledData[j]] = [shuffledData[j], shuffledData[i]];
            }
            shuffledData.forEach(question => {
                let correctAnswerText = question.options[question.correct];
                for (let i = question.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [question.options[i], question.options[j]] = [question.options[j], question.options[i]];
                }
                question.correct = question.options.indexOf(correctAnswerText);
            });
            return shuffledData;
        }

        function startQuiz() {
            if (quizData.length === 0) {
                alert("The Theory Engine is currently empty. Please add your questions to the quizData array.");
                return;
            }
            switchView('quiz-page');
            activeQuizData = shuffleQuiz(quizData); // Keeps questions shuffled for better learning
            currentQuizIndex = 0;
            quizAnswers = new Array(activeQuizData.length).fill(null);
            renderQuiz();
        }

        function renderQuiz() {
            if (activeQuizData.length === 0) return;
            const qData = activeQuizData[currentQuizIndex];
            
            document.getElementById('quiz-counter').innerText = `Theory Q${currentQuizIndex + 1} of ${activeQuizData.length}`;
            document.getElementById('quiz-progress').style.width = `${((currentQuizIndex + 1) / activeQuizData.length) * 100}%`;
            document.getElementById('quiz-q-text').innerHTML = `<strong>Q${currentQuizIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = quizAnswers[currentQuizIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === quizAnswers[currentQuizIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectQuizOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            const solArea = document.getElementById('quiz-sol-area');
            const solBox = document.getElementById('quiz-sol-box');
            const revealBtn = document.getElementById('quiz-reveal-btn');
            
            if (qData.sol) {
                solArea.style.display = 'block';
                solBox.innerHTML = qData.sol;
                solBox.style.display = 'none';
                
                if (hasAnswered) {
                    revealBtn.style.display = 'inline-block';
                    revealBtn.onclick = () => { solBox.style.display = 'block'; };
                } else {
                    revealBtn.style.display = 'none';
                }
            } else {
                solArea.style.display = 'none';
            }
            
            document.getElementById('quiz-prev-btn').disabled = currentQuizIndex === 0;
            document.getElementById('quiz-next-btn').disabled = currentQuizIndex === activeQuizData.length - 1;
        }

        function selectQuizOption(selectedIndex) { quizAnswers[currentQuizIndex] = selectedIndex; renderQuiz(); }
        function goPrevQuiz() { if (currentQuizIndex > 0) { currentQuizIndex--; renderQuiz(); } }
        function goNextQuiz() { if (currentQuizIndex < activeQuizData.length - 1) { currentQuizIndex++; renderQuiz(); } }
