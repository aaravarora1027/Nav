<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH 7 | General Navigation</title>
    <style>
        :root {
            --bg-color: #050505; --panel-bg: #121212; --text-main: #f0f0f0; --text-muted: #888888;
            --accent: #2a2a2a; --accent-hover: #404040; --border: #333333; --highlight: #555555;
            --correct-bg: #1e4620; --correct-border: #4caf50; --wrong-bg: #4a1919; --wrong-border: #f44336;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 95%; max-width: 1200px; background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); padding: 30px; min-height: 85vh; display: flex; flex-direction: column; position: relative; }
        .view-section { display: none; flex-direction: column; flex-grow: 1; animation: fadeIn 0.3s ease-in-out; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .nav-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; cursor: pointer; border-radius: 4px; transition: background 0.2s; text-decoration: none; }
        .nav-btn:hover { background-color: var(--accent); }
        .btn { background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); padding: 15px 50px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .btn:hover { background-color: var(--accent); border-color: var(--text-main); }
        
        .module-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; margin-top: 30px; }
        .module-card { background-color: var(--bg-color); border: 1px solid var(--border); padding: 50px 20px; text-align: center; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .module-card:hover { background-color: var(--accent); border-color: var(--text-muted); transform: translateY(-5px); }
        .module-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .module-card p { color: var(--text-muted); font-family: 'Courier New', monospace; }
        
        .content-area { background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; padding: 25px; flex-grow: 1; font-size: 1.1rem; line-height: 1.7; color: #d0d0d0; overflow-y: auto; max-height: 68vh; }
        
        .quiz-top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .quiz-top-header h2 { margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }
        .score-badge { background: var(--accent); border: 1px solid #444; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; color: var(--text-main); }
        .progress-bar-container { width: 100%; background-color: var(--accent); border-radius: 8px; height: 6px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--text-muted); width: 0%; transition: width 0.3s ease; }
        .question-text { font-size: 1.25rem; margin-bottom: 15px; line-height: 1.4; font-weight: 500; color: var(--text-main); } 
        .options-grid { display: flex; flex-direction: column; gap: 8px; } 
        .option-btn { background-color: var(--accent); color: var(--text-main); border: 2px solid transparent; border-radius: 8px; padding: 12px 20px; font-size: 1rem; cursor: pointer; text-align: left; transition: all 0.2s ease; }
        .option-btn:hover:not(:disabled) { background-color: var(--accent-hover); }
        .option-btn:disabled { cursor: default; }
        .correct-ans { background-color: var(--correct-bg) !important; border-color: var(--correct-border) !important; color: white; }
        .wrong-ans { background-color: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; color: white; }
        .feedback-box { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: left; font-weight: 600; display: none; font-size: 1rem; }
        .feedback-correct { display: block; background-color: rgba(76, 175, 80, 0.15); color: var(--correct-border); border: 1px solid var(--correct-bg); padding: 15px; font-size: 1.15rem; }
        .feedback-wrong { display: block; background-color: rgba(244, 67, 54, 0.15); color: var(--wrong-border); border: 1px solid var(--wrong-bg); padding: 15px; font-size: 1.15rem; }
        .sol-box { display: block; background-color: var(--panel-bg); color: var(--text-main); border: 1px solid var(--border); font-family: 'Courier New', monospace; padding: 20px; margin-top: 15px; font-weight: normal; line-height: 1.6; }
        .quiz-nav-controls { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--accent); }
        .quiz-nav-btn { background-color: var(--highlight); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; min-width: 110px; }
        .quiz-nav-btn:hover:not(:disabled) { background-color: #666666; }
        .quiz-nav-btn:disabled { background-color: var(--bg-color); color: #555; cursor: not-allowed; border: 1px solid #333; }
        
        #finish-screen { text-align: center; padding-top: 40px; }
        #finish-screen h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--text-main);}
        #finish-screen p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- MODULE SELECTION PAGE -->
        <div id="module-page" class="view-section" style="display: flex;">
            <div class="header-bar">
                <h2>Chapter 7: General Navigation</h2>
                <a href="index.html" class="nav-btn">Back to Hub</a>
            </div>
            <div class="module-grid">
                <div class="module-card" onclick="initPdfQuiz()">
                    <h3>PDF Questions</h3>
                    <p id="pdf-label">Loading...</p>
                </div>
                <div class="module-card" onclick="startNumericals()">
                    <h3>Numericals</h3>
                    <p id="num-label">Loading...</p>
                </div>
            </div>
        </div>

        <!-- PDF QUESTIONS VIEW (Behaves like MCQ) -->
        <div id="pdf-quiz-page" class="view-section">
            <div class="quiz-top-header">
                <h2 id="pdf-counter">Question 1 of X</h2>
                <div class="score-badge">Score: <span id="pdf-score-display">0</span></div>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="pdf-progress"></div></div>
            <div class="content-area" style="max-height: none; padding: 20px;">
                <div class="question-text" id="pdf-q-text">Loading question...</div>
                <div class="options-grid" id="pdf-options-container"></div>
                <div id="pdf-feedback-box" class="feedback-box"></div>
            </div>
            <div class="quiz-nav-controls">
                <button id="pdf-prev-btn" class="quiz-nav-btn" onclick="goPrevPdf()">Previous</button>
                <button class="nav-btn" onclick="switchView('module-page')" style="border-color: var(--border);">Exit Questions</button>
                <button id="pdf-next-btn" class="quiz-nav-btn" onclick="goNextPdf()">Next</button>
            </div>
        </div>

        <!-- PDF QUESTIONS FINISH SCREEN -->
        <div id="pdf-finish-screen" class="view-section" style="justify-content: center;">
            <div id="finish-screen" style="display: block;">
                <h1>Questions Complete!</h1>
                <p>You scored <span id="pdf-final-score"></span> out of <span id="pdf-total-questions"></span>.</p>
                <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
                    <button class="btn" onclick="switchView('module-page')">Back to Modules</button>
                    <button class="btn" style="background-color: var(--highlight);" onclick="initPdfQuiz()">Restart Questions</button>
                </div>
            </div>
        </div>

        <!-- NUMERICALS VIEW -->
        <div id="numerical-linear-page" class="view-section">
            <div class="quiz-top-header">
                <h2 id="num-counter">Numerical 1 of X</h2>
                <button class="nav-btn" onclick="switchView('module-page')">Exit Numericals</button>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="num-progress"></div></div>
            
            <div class="content-area" style="max-height: none; padding: 20px;">
                <div class="question-text" id="num-q-text">Loading problem...</div>
                <div style="margin-top: 25px; display: flex; gap: 15px;">
                    <button class="btn" style="padding: 10px 20px; font-size: 1rem;" onclick="document.getElementById('num-ans-box').style.display='block'">Reveal Answer</button>
                    <button class="btn" style="padding: 10px 20px; font-size: 1rem; background-color: var(--highlight);" onclick="document.getElementById('num-sol-box').style.display='block'">Reveal Solution</button>
                </div>
                <div id="num-ans-box" class="feedback-box feedback-correct" style="display:none;"></div>
                <div id="num-sol-box" class="feedback-box sol-box" style="display:none;"></div>
            </div>
            
            <div class="quiz-nav-controls">
                <button id="num-prev-btn" class="quiz-nav-btn" onclick="goPrevNum()">Previous</button>
                <button id="num-next-btn" class="quiz-nav-btn" onclick="goNextNum()">Next</button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // SPA NAVIGATION
        // ==========================================
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'flex';
        }

        function shuffleArray(array) { 
            for (let i = array.length - 1; i > 0; i--) { 
                const j = Math.floor(Math.random() * (i + 1)); 
                [array[i], array[j]] = [array[j], array[i]]; 
            } 
        }

        // ==========================================
        // PDF QUESTIONS DATA & LOGIC
        // ==========================================
        const pdfQuizData = [ 
            // Data will be injected here
        ];

        let activePdfData = [], pdfUserAnswers = [], currentPdfIndex = 0;

        function initPdfQuiz() { 
            switchView('pdf-quiz-page');
            activePdfData = JSON.parse(JSON.stringify(pdfQuizData)); 
            
            if (activePdfData.length === 0) {
                document.getElementById('pdf-q-text').innerHTML = "No questions available yet.";
                return;
            }

            shuffleArray(activePdfData); 
            activePdfData.forEach(q => { 
                let optionsArr = Object.entries(q.options).map(([key, val]) => ({ key, val })); 
                shuffleArray(optionsArr); 
                q.shuffledOptions = optionsArr; 
            }); 
            pdfUserAnswers = new Array(activePdfData.length).fill(null); 
            currentPdfIndex = 0; 
            renderPdfQuestion(); 
        }

        function updatePdfScore() { 
            let currentScore = 0; 
            pdfUserAnswers.forEach((ans, index) => { 
                if (ans === activePdfData[index].ans) { currentScore++; } 
            }); 
            document.getElementById('pdf-score-display').textContent = currentScore; 
            return currentScore; 
        }

        function renderPdfQuestion() { 
            if(activePdfData.length === 0) return;
            const qData = activePdfData[currentPdfIndex]; 
            const selectedAns = pdfUserAnswers[currentPdfIndex]; 
            
            document.getElementById('pdf-counter').textContent = `Question ${currentPdfIndex + 1} of ${activePdfData.length}`; 
            document.getElementById('pdf-progress').style.width = `${((currentPdfIndex + 1) / activePdfData.length) * 100}%`; 
            document.getElementById('pdf-q-text').innerHTML = qData.q; 
            updatePdfScore(); 
            
            const optionsContainer = document.getElementById('pdf-options-container'); 
            optionsContainer.innerHTML = ''; 
            qData.shuffledOptions.forEach(opt => { 
                const btn = document.createElement('button'); 
                btn.className = 'option-btn'; 
                btn.innerHTML = opt.val; 
                if (selectedAns !== null) { 
                    btn.disabled = true; 
                    if (opt.key === qData.ans) { btn.classList.add('correct-ans'); } 
                    else if (opt.key === selectedAns) { btn.classList.add('wrong-ans'); } 
                } else { 
                    btn.onclick = () => { pdfUserAnswers[currentPdfIndex] = opt.key; renderPdfQuestion(); }; 
                } 
                optionsContainer.appendChild(btn); 
            }); 
            
            const feedbackBox = document.getElementById('pdf-feedback-box'); 
            feedbackBox.className = 'feedback-box'; 
            if (selectedAns !== null) { 
                feedbackBox.style.display = 'block';
                if (selectedAns === qData.ans) { 
                    feedbackBox.innerHTML = "<strong>Correct!</strong>"; 
                    feedbackBox.classList.add('feedback-correct'); 
                } else { 
                    feedbackBox.innerHTML = "<strong>Incorrect.</strong> The correct answer is highlighted in green."; 
                    feedbackBox.classList.add('feedback-wrong'); 
                } 
            } else { feedbackBox.style.display = 'none'; }
            
            document.getElementById('pdf-prev-btn').disabled = currentPdfIndex === 0; 
            const nextBtn = document.getElementById('pdf-next-btn'); 
            if (selectedAns === null) { nextBtn.disabled = true; nextBtn.textContent = "Next"; } 
            else { nextBtn.disabled = false; nextBtn.textContent = (currentPdfIndex === activePdfData.length - 1) ? "Finish" : "Next"; } 
        }

        function goPrevPdf() { if (currentPdfIndex > 0) { currentPdfIndex--; renderPdfQuestion(); } }
        function goNextPdf() { 
            if (currentPdfIndex < activePdfData.length - 1) { currentPdfIndex++; renderPdfQuestion(); } 
            else { 
                switchView('pdf-finish-screen'); 
                document.getElementById('pdf-final-score').textContent = updatePdfScore(); 
                document.getElementById('pdf-total-questions').textContent = activePdfData.length; 
            } 
        }

        // ==========================================
        // NUMERICALS DATA & LOGIC
        // ==========================================
        const numericalsData = [
            // Data will be injected here
            { 
                q: "Given:<br>Imperial Gallon = 100<br>Specific Gravity = 0.77<br><br>Convert this to Litres (L), Kilograms (kg), Pounds (lbs), and US Gallons (USG).", 
                ans: "454 L<br>350 kg<br>770 lbs<br>119.8 USG", 
                sol: "&bull; <strong>Litres:</strong> 100 L = 22 IG<br>(100 &times; 100) / 22 = 454 L<br><br>&bull; <strong>Kilograms:</strong> L &times; SG = kg<br>454 &times; 0.77 = 350 kg<br><br>&bull; <strong>Pounds:</strong> kg &times; 2.205 = lbs<br>350 &times; 2.205 = 770 lbs<br><br>&bull; <strong>US Gallons:</strong> 100 L = 26.4 USG<br>(26.4 &times; 454) / 100 = 119.8 USG" 
            },
            { 
                q: "Given:<br>Fuel Efficiency = 9.3 kg/NM<br>Specific Gravity (SG) = 0.79<br>TAS = 360 kts<br>Wind component = +45 kts<br><br>Find:<br>a) Fuel consumption in IG/hour<br>b) Fuel consumption in L/min<br>c) Fuel consumption in NM/USG", 
                ans: "a) 1048.8 IG/hour<br>b) 79.45 L/min<br>c) 0.32 NM/USG", 
                sol: "<strong>Groundspeed (G/S):</strong> 360 + 45 = 405 kts<br><br><strong>a) IG/hour:</strong><br>FC = 405 &times; 9.3 = 3766 kg/hour<br>3766 kg/hr = 8286 lbs/hour<br>Formula: IG &times; SG &times; 10 = lbs<br>IG &times; 0.79 &times; 10 = 8286<br>IG = 8286 / 7.9 = 1048.8 IG/hour<br><br><strong>b) L/min:</strong><br>Formula: L &times; SG = kg<br>L &times; 0.79 = 3766 kg<br>L = 3766 / 0.79 = 4767 L/hour<br>4767 / 60 = 79.45 L/min<br><br><strong>c) NM/USG:</strong><br>Formula: 100 L = 26.4 USG<br>(26.4 &times; 4767) / 100 = 1258.5 USG/hour<br>Efficiency = 405 NM / 1258.5 USG = 0.32 NM/USG" 
            },
            { 
                q: "Which of the following will give fuel economy or best performance?<br><br>a) TAS 300 kts, FC 800 IG/h<br>b) TAS 340 kts, FC 907 IG/h<br>c) TAS 380 kts, FC 988 IG/h<br>d) TAS 420 kts, FC 1121 IG/h", 
                ans: "c) 380 kts & 988 IG/h gives best economy", 
                sol: "Find the lowest Fuel Efficiency in IG/NM (Fuel Consumption &divide; Speed):<br><br>a) 800 / 300 = 2.666 IG/NM<br>b) 907 / 340 = 2.667 IG/NM<br>c) 988 / 380 = 2.600 IG/NM<br>d) 1121 / 420 = 2.669 IG/NM<br><br>Option (c) requires the least amount of fuel per nautical mile." 
            },
            { 
                q: "Find best economy (Specific Gravity = 0.79):<br><br>a) TAS 180 kts, FC 1.25 USG/NM<br>b) TAS 240 kts, FC 4.1 IG/min<br>c) TAS 220 kts, FC 815 kg/hour<br>d) TAS 160 kts, FC 12.7 L/min", 
                ans: "b) 240 kts & 4.1 IG/min will have best fuel efficiency (4.66 L/NM)", 
                sol: "Convert all values to a standard metric, Litres per NM (L/NM):<br><br><strong>a)</strong> 1.25 USG/NM &rarr; 100 L = 26.4 USG &rarr; (100 &times; 1.25) / 26.4 = 4.73 L/NM<br><br><strong>b)</strong> 4.1 IG/min &rarr; 246 IG/hour. <br>100 L = 22 IG &rarr; (100 &times; 246) / 22 = 1118.18 L/hour.<br>1118.18 / 240 kts = 4.66 L/NM<br><br><strong>c)</strong> 815 kg/hour &rarr; L &times; 0.79 = 815 &rarr; L = 1031.64 L/hour.<br>1031.64 / 220 kts = 4.68 L/NM<br><br><strong>d)</strong> 12.7 L/min &rarr; 12.7 &times; 60 = 762 L/hour.<br>762 / 160 kts = 4.76 L/NM<br><br>Option (b) is the most efficient." 
            },
            { 
                q: "Which aircraft is economical with SG = 0.8?<br><br>a) 34.5 L/km<br>b) 0.065 NM/L<br>c) 16.85 kg/NM<br>d) 0.2 NM/IG", 
                ans: "b) 0.065 NM/L will have best fuel efficiency (15.38 L/NM)", 
                sol: "Convert all values to a standard metric, Litres per NM (L/NM):<br><br><strong>a)</strong> 34.5 L/km &rarr; 34.5 &times; 1.852 = 63.8 L/NM<br><br><strong>b)</strong> 0.065 NM/L &rarr; 1 / 0.065 = 15.38 L/NM<br><br><strong>c)</strong> 16.85 kg/NM &rarr; L &times; SG = kg &rarr; L &times; 0.8 = 16.85 &rarr; L = 21.06 L/NM<br><br><strong>d)</strong> 0.2 NM/IG &rarr; 1 / 0.2 = 5 IG/NM. <br>100 L = 22 IG &rarr; (100 &times; 5) / 22 = 22.7 L/NM<br><br>Option (b) consumes the least Litres per NM." 
            },
            { 
                q: "For a flight of 110 NM. Pilot observes after covering 40 NM, A/C is off track by 8 NM to port. How many degrees of correction pilot should apply?", 
                ans: "18.8&deg; Starboard", 
                sol: "<strong>Distance Flown:</strong> 40 NM<br><strong>Distance to Go:</strong> 110 - 40 = 70 NM<br><strong>Off Track:</strong> 8 NM Port<br><br><strong>Correction Angle (CA):</strong><br>CA = (Distance Off &times; 60 / Distance Flown) + (Distance Off &times; 60 / Distance to Go)<br>CA = (8 &times; 60 / 40) + (8 &times; 60 / 70)<br>CA = 12 + 6.85 = 18.85&deg; &approx; 18.8&deg; Starboard (S)" 
            },
            { 
                q: "For a cross country of 130 NM. Flying for 40 mins at GS 110 kts. Pilot found A/C 10 NM to starboard. How many degrees of correction should be applied?", 
                ans: "19&deg; Port", 
                sol: "<strong>Distance Flown (D1):</strong><br>Time = 40 mins, GS = 110 kts<br>D1 = Speed &times; Time = 110 &times; (40/60) = 73.3 NM<br><br><strong>Distance to Go (D2):</strong><br>D2 = 130 - 73.3 = 56.7 NM<br><br><strong>Correction Angle (CA):</strong><br>CA = (10 &times; 60 / 73.3) + (10 &times; 60 / 56.7)<br>CA = 8.18 + 10.58 = 18.76&deg; &approx; 19&deg; Port (P)" 
            },
            { 
                q: "For a flight of 135 NM, After 40 mins at G/S 95 kts Pilot drifted 7&deg; starboard. How many degrees of correction should be applied?", 
                ans: "14&deg; Port", 
                sol: "<strong>Distance Flown (D1):</strong><br>Time = 40 mins, Speed = 95 kts<br>D1 = 95 &times; (40/60) = 63.3 NM<br><br><strong>Distance to Go (D2):</strong><br>D2 = 135 - 63.3 = 71.7 NM<br><br><strong>Find Off-Track Distance (x):</strong><br>Track Error = (x &times; 60) / D1<br>7 = (x &times; 60) / 63.3 &rarr; x = (7 &times; 63.3) / 60 = 7.38 NM<br><br><strong>Closing Angle (&theta;):</strong><br>&theta; = (7.38 &times; 60) / 71.7 = 6.17&deg;<br><br><strong>Total Correction (CA):</strong><br>CA = 7.38 + 6.17 = 13.55&deg; &approx; 14&deg;" 
            },
            { 
                q: "Flying for 2 hrs at GS 180 kts, A/C pinpoints itself 18 NM right off track. If remaining time to reach destination is 1 hr. Find correction in Hdg required if AC was flying on Hdg 90&deg;.", 
                ans: "New Heading = 81&deg;", 
                sol: "<strong>Distance Flown:</strong> 2 hrs @ 180 kts = 360 NM<br><strong>Distance to Go:</strong> 1 hr @ 180 kts = 180 NM<br><br><strong>Correction Angle (CA):</strong><br>CA = (18 &times; 60 / 360) + (18 &times; 60 / 180)<br>CA = 3 + 6 = 9&deg; Port (Left)<br><br><strong>New Heading:</strong><br>Since you are right (Starboard) of track, you must steer left (Port) by 9 degrees.<br>New Hdg = 90&deg; - 9&deg; = 81&deg;" 
            },
            { 
                q: "Glide angle = 3&deg;, G/S = 100 kts. Find ROD.", 
                ans: "506.5 ft/min", 
                sol: "Formula: ROD = (Glide Angle &times; G/S / 60) &times; 101.3<br><br>ROD = (3 &times; 100 / 60) &times; 101.3<br>ROD = 506.5 ft/min" 
            },
            { 
                q: "Descend slope = 12%, GS = 540 kts. Find ROD.", 
                ans: "6564.24 ft/min", 
                sol: "Formula: Gradient (%) = (ROD in NM/hr / GS) &times; 100<br><br>12 = (x / 540) &times; 100<br>x = (12 &times; 540) / 100 = 64.8 NM/hr<br><br>Convert NM/hr to ft/min by multiplying by 101.3:<br>64.8 &times; 101.3 = 6564.24 ft/min" 
            },
            { 
                q: "Descend gradient = 5.2%. Distance = 7 NM from runway. Find height.", 
                ans: "2213 ft", 
                sol: "Formula: Gradient (%) = (Height in NM / Distance in NM) &times; 100<br><br>5.2 = (x / 7) &times; 100<br>x = (5.2 &times; 7) / 100 = 0.364 NM<br><br>Convert NM to feet (1 NM = 6080 ft):<br>0.364 &times; 6080 = 2213 ft" 
            },
            { 
                q: "Assuming zero wind, what distance is covered by an aircraft descending 15000 ft with TAS of 320 kts maintaining ROD of 3000 ft/min?", 
                ans: "26.6 NM", 
                sol: "<strong>Time to descend:</strong><br>Time = Height / ROD = 15000 / 3000 = 5 mins<br><br><strong>Distance covered:</strong><br>Distance = Speed &times; Time<br>Distance = 320 &times; (5 / 60) = 26.6 NM" 
            },
            { 
                q: "A/C height 2500 ft, Glide Path (&angle;GS) = 3&deg;. At what distance from runway can the A/C capture the glide path?", 
                ans: "8.22 NM", 
                sol: "Formula: &angle;GS = (Height &times; 60) / (Distance in ft)<br><br>3 = (2500 &times; 60) / x<br>x = (2500 &times; 60) / 3 = 50,000 ft<br><br>Convert feet to NM:<br>50,000 / 6080 = 8.22 NM" 
            },
            {

            solBox.innerHTML = `<strong>Step-by-Step Solution:</strong><br><br>${qData.sol}`; 
            solBox.style.display = 'none'; 
            
            document.getElementById('num-prev-btn').disabled = currentNumIndex === 0; 
            document.getElementById('num-next-btn').disabled = currentNumIndex === numericalsData.length - 1; 
        }

        function goPrevNum() { if (currentNumIndex > 0) { currentNumIndex--; renderNumerical(); } }
        function goNextNum() { if (currentNumIndex < numericalsData.length - 1) { currentNumIndex++; renderNumerical(); } }

        // ==========================================
        // AUTO-UPDATE MODULE LABELS
        // ==========================================
        window.onload = () => {
            const pdfLabel = document.getElementById('pdf-label');
            const numLabel = document.getElementById('num-label');
            if (pdfLabel) pdfLabel.innerText = `${pdfQuizData.length} Questions`;
            if (numLabel) numLabel.innerText = `${numericalsData.length} Problems`;
        };
    </script>
</body>
</html>
