                sol: "<strong>Explanation:</strong> Turning from south-west (225°) to south-east (135°) requires rolling through South. In the Northern Hemisphere, the compass leads the actual heading when turning through South (the UNOS rule). Therefore, you must overshoot your rollout on the compass to end up on the correct actual heading. The correct compass indication to roll out on is 115°."
            },
            {
                q: "During deceleration following a landing in a southerly direction, a magnetic compass made for the northern hemisphere indicates:",
                options: [
                    "an apparent turn to the west",
                    "no apparent turn only on northern latitudes",
                    "no apparent turn",
                    "an apparent turn to the east"
                ],
                correct: 2, 
                sol: "<strong>Explanation:</strong> Acceleration and deceleration errors (ANDS) are maximum on East and West headings. On North and South headings, the aircraft is aligned with the magnetic meridian, meaning acceleration or deceleration does not cause the compass card to rotate. There is no apparent turn."
            },
            {
                q: "Among the errors of a magnetic compass, are errors:",
                options: [
                    "of parallax, due to oscillations of the compass rose",
                    "due to cross-wind gusts particularly on westerly or easterly headings",
                    "due to Schuler type oscillations",
                    "in North seeking, due to bank angle and magnetic heading"
                ],
                correct: 3, 
                sol: "<strong>Explanation:</strong> Turning errors occur in a direct reading compass due to the bank angle of the aircraft, which allows the vertical component of the Earth's magnetic field to pull on the magnetic assembly, negatively affecting its North-seeking capability."
            },
            {
                q: "When turning on to a northerly heading the rose of a magnetic compass tends to \"undershoot\" when turning onto a southerly heading it tends to \"overshoot\".\n\n1) these compass indications are less reliable in the northern hemisphere than in the southern hemisphere\n2) these compass oscillations following a lateral gust are not identical if the aircraft is heading north or south\n3) this behaviour is due to the mechanical construction of the compass\n4) this behaviour is a symptom of a badly swung compass\n\nThe correct statements are:",
                options: [
                    "1 and 2",
                    "2 and 3",
                    "3 and 4",
                    "1 and 4"
                ],
                correct: 1, 
                sol: "<strong>Explanation:</strong> Statements 2 and 3 are correct. The mechanical construction (pendulous suspension) allows the compass card to dip, which makes it susceptible to the vertical magnetic component. Additionally, lateral gusts will cause different oscillatory behaviors on North vs South headings due to this same magnetic dip effect."
            },
            {
                q: "In a steep turn, the northerly turning error on a magnetic compass on the northern hemisphere is:",
                options: [
                    "none on a 270° heading in a left turn",
                    "equal to 180° on a 090° heading in a right turn",
                    "none on a 090° heading in a right turn",
                    "equal to 180° on a 270° heading in a right turn"
                ],
                correct: 1, 
                sol: "<strong>Explanation:</strong> In a steep right turn passing through East (090°), the compass card can be dipped so severely that the vertical component of the Earth's magnetic field completely overpowers the horizontal component, pulling the north end of the needle downwards and potentially causing a 180° error."
            },
            {
                q: "An aircraft is taking off on a runway heading 045°, in still air, with a compass having 0° deviation. The runway is on an agonic line. What will the compass read if you are in the northern hemisphere?",
                options: [
                    "compass moves to less than 045°",
                    "compass moves to more than 045°",
                    "compass stays on 045° if wings are kept level",
                    "compass remains on 045°"
                ],
                correct: 0, 
                sol: "<strong>Explanation:</strong> An agonic line is a line of zero variation, but not zero dip. Because there is still a vertical magnetic component (dip) in the Northern hemisphere, acceleration on a Northerly/Easterly heading (045°) will cause the compass to register a false turn towards the North (ANDS rule). Moving towards North from 045° means the compass reads a value less than 045°."
            },
            {
                q: "A compass swing is used to:",
                options: [
                    "align compass north with magnetic north",
                    "align compass north with true north",
                    "align magnetic north with true north",
                    "align compass north with the lubber line"
                ],
                correct: 0, 
                sol: "<strong>Explanation:</strong> The primary purpose of a compass swing is to compensate for the aircraft's internal magnetic fields, thereby aligning Compass North as closely as possible with Magnetic North."
            },
            {
                q: "The purpose of compass swinging is to determine the deviation of a magnetic compass:",
                options: [
                    "on a given heading",
                    "on any heading",
                    "at any latitude",
                    "at a given latitude"
                ],
                correct: 1, 
                sol: "<strong>Explanation:</strong> Compass swinging maps out the residual deviation on various headings, allowing the crew to determine the deviation on any heading via the provided deviation card or curve."
            },
            {
                q: "The quadrantal deviation of the magnetic compass is due to the action of:",
                options: [
                    "the hard iron ices and the soft iron pieces influenced by the hard iron pieces",
                    "the soft iron pieces influenced by the geomagnetic field",
                    "the hard iron pieces influenced by the geomagnetic field",
                    "the hard iron pieces influenced by the mild iron pieces"
                ],
                correct: 1, 
                sol: "<strong>Explanation:</strong> Quadrantal deviation varies in four quadrants (reaching maximums on intercardinal headings) and is caused by the aircraft's soft iron pieces acquiring temporary magnetism as their orientation to the Earth's geomagnetic field changes during turns."
            },
            {
                q: "The compass heading can be derived from the magnetic heading by reference to a:",
                options: [
                    "map showing the isogonic lines",
                    "map showing the isoclinic lines",
                    "deviation correction curve",
                    "compass swinging curve"
                ],
                correct: 3, 
                sol: "<strong>Explanation:</strong> Compass deviation can be displayed in the cockpit as a table or a curve. The compass swinging curve (or deviation card) derived from a compass swing is used to correct magnetic heading to compass heading."
            },
            {
                q: "The fields affecting a magnetic compass originate from:\n1) magnetic masses\n2) ferrous metal masses\n3) non-ferrous metal masses\n4) electrical currents\n\nThe combination of correct statements is:",
                options: [
                    "1, 2, 3",
                    "1, 2, 4",
                    "2, 3, 4",
                    "1, 3, 4"
                ],
                correct: 1, 
                sol: "<strong>Explanation:</strong> A magnetic compass is affected by permanent magnets (magnetic masses), soft iron (ferrous metal masses), and electromagnetic fields generated by electrical currents. Non-ferrous metals do not have magnetic properties and do not cause deviation."
            },
            {
                q: "About a magnetic compass:",
                options: [
                    "a) errors of parallax are due to the oscillation of the compass rose",
                    "b) acceleration errors are due to the angle of dip",
                    "c) acceleration errors are due to Schuler oscillations",
                    "d) turning error is due to the vertical component of the earth's magnetic field"
                ],
                correct: 3, 
                sol: "<strong>Explanation:</strong> Turning errors are fundamentally caused by the vertical component (Z) of the Earth's magnetic field pulling on the pendulous compass assembly when the aircraft is banked."
            },
            {
                q: "Concerning the direct reading magnetic compass, the turning error:",
                options: [
                    "does not depend on the magnetic latitude",
                    "decreases with the magnetic latitude",
                    "increases with the magnetic latitude",
                    "decreases with the magnetic longitude"
                ],
                correct: 2, 
                sol: "<strong>Explanation:</strong> Turning error is caused by the vertical component of the Earth's magnetic field. Since this vertical component (dip) increases as you move towards the magnetic poles (higher magnetic latitudes), the turning error increases accordingly."
            },
            {
                q: "The main cause of error in a DRMC is:",
                options: [
                    "parallax in the rose",
                    "turning",
                    "acceleration",
                    "magnetic dip"
                ],
                correct: 1, 
                sol: "<strong>Explanation:</strong> While a direct reading magnetic compass (DRMC) is subject to several errors, turning errors are the most significant and complex to manage dynamically during flight maneuvers."
            }
        ];

        const numerical_data = [
            // Format: { q: "Question?", ans: "Final Answer", sol: "Step-by-step logic" }
            {
                q: "Based on a compass swing, the following deviations were recorded: North = +7°, East = 0°, South = +1°, West = +4°. Calculate Coefficient B and Coefficient C.",
                ans: "Coefficient B = -2°, Coefficient C = +3°",
                sol: "<strong>Explanation:</strong> Coefficient B = (Deviation East - Deviation West) / 2 = (0° - 4°) / 2 = -2°. Coefficient C = (Deviation North - Deviation South) / 2 = (+7° - 1°) / 2 = +3°."
            },
            {
                q: "With Coefficient B = -2° and Coefficient C = +3°, and initial raw readings of North 353°, South 183°, East 088°, and West 268°, calculate the corrected reading on N, S, E and W headings respectively.",
                ans: "North = 356°, South = 180°, East = 086°, West = 270°",
                sol: "<strong>Explanation:</strong> Apply Coefficient B and C to the compass headings. North: 353° + 3° = 356°. South: 183° - 3° = 180°. East: 088° - 2° = 086°. West: 268° + 2° = 270°."
            },
            {
                q: "Given Coefficient B = -2° and Coefficient C = +3°, what is the approximate heading on which deviation will be maximum?",
                ans: "326°",
                sol: "<strong>Explanation:</strong> Maximum deviation occurs where tan(Heading) = B / C. Therefore, tan(Heading) = -2° / +3° = -0.666°. The heading is approximately 326°."
            },
            {
                q: "Given Coefficient B = -2° and Coefficient C = +3°, what is the approximate heading on which deviation is zero?",
                ans: "304°",
                sol: "<strong>Explanation:</strong> Zero deviation occurs when B sin(Heading) + C cos(Heading) = 0. Therefore, tan(Heading) = -C / B = -(+3) / -2 = -1.5. Heading = -56° (which corresponds to 360° - 56° = 304°)."
            },
            {
                q: "Given Coefficient B = -2°, Coefficient C = +3°, and knowing maximum deviation occurs at a heading of 326°, what is the total deviation on this heading?",
                ans: "3.61° E",
                sol: "<strong>Explanation:</strong> Total Deviation = B sin(Heading) + C cos(Heading). Substituting the values: Total Deviation = -2 * sin(326°) + 3 * cos(326°) = -2 * (-0.56) + 3 * (0.83) = 1.12 + 2.49 = 3.61° E."
            },
            {
                q: "Given coefficients A = +3, B = +2, and C = -10. What total deviation would be expected (a) on 222(C) and (b) on 146(C)?",
                ans: "(a) 9° E, (b) 12° E",
                sol: "<strong>Explanation:</strong> Total Deviation = A + B sin(Heading) + C cos(Heading). For (a): +3 + 2*sin(222°) - 10*cos(222°) = +3 - 1.338 + 7.431 = 9° E. For (b): +3 + 2*sin(146°) - 10*cos(146°) = +3 + 1.118 + 8.290 = 12° E."
            }
        ];

        // ==========================================
        // THEORY ENGINE LOGIC
        // ==========================================
        let currentTheoryIndex = 0;
        let theoryAnswers = [];
        let theoryRightCount = 0;
        let theoryWrongCount = 0;

        function startTheory() {
            if (theory_mcqs.length === 0) { alert("Theory Engine is empty."); return; }
            switchView('theory-page');
            currentTheoryIndex = 0;
            theoryRightCount = 0;
            theoryWrongCount = 0;
            document.getElementById('theory-right').innerText = "0";
            document.getElementById('theory-wrong').innerText = "0";
            theoryAnswers = new Array(theory_mcqs.length).fill(null);
            renderTheory();
        }

        function renderTheory() {
            if (theory_mcqs.length === 0) return;
            const qData = theory_mcqs[currentTheoryIndex];
            
            document.getElementById('theory-counter').innerText = `Theory Q${currentTheoryIndex + 1} of ${theory_mcqs.length}`;
            document.getElementById('theory-progress').style.width = `${((currentTheoryIndex + 1) / theory_mcqs.length) * 100}%`;
            document.getElementById('theory-q-text').innerHTML = `<strong>Q${currentTheoryIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('theory-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = theoryAnswers[currentTheoryIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === theoryAnswers[currentTheoryIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectTheoryOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            handleSolutionBox('theory', qData, hasAnswered);
            
            document.getElementById('theory-prev-btn').disabled = currentTheoryIndex === 0;
            document.getElementById('theory-next-btn').disabled = currentTheoryIndex === theory_mcqs.length - 1;
        }

        function selectTheoryOption(selectedIndex) { 
            theoryAnswers[currentTheoryIndex] = selectedIndex;
            if (selectedIndex === theory_mcqs[currentTheoryIndex].correct) {
                theoryRightCount++;
                document.getElementById('theory-right').innerText = theoryRightCount;
            } else {
                theoryWrongCount++;
                document.getElementById('theory-wrong').innerText = theoryWrongCount;
            }
            renderTheory(); 
        }
        function goPrevTheory() { if (currentTheoryIndex > 0) { currentTheoryIndex--; renderTheory(); } }
        function goNextTheory() { if (currentTheoryIndex < theory_mcqs.length - 1) { currentTheoryIndex++; renderTheory(); } }

        // ==========================================
        // PDF ENGINE LOGIC
        // ==========================================
        let currentPdfIndex = 0;
        let pdfAnswers = [];
        let pdfRightCount = 0;
        let pdfWrongCount = 0;

        function startPdf() {
            if (pdf_mcqs.length === 0) { alert("PDF Engine is empty."); return; }
            switchView('pdf-page');
            currentPdfIndex = 0;
            pdfRightCount = 0;
            pdfWrongCount = 0;
            document.getElementById('pdf-right').innerText = "0";
            document.getElementById('pdf-wrong').innerText = "0";
            pdfAnswers = new Array(pdf_mcqs.length).fill(null);
            renderPdf();
        }

        function renderPdf() {
            if (pdf_mcqs.length === 0) return;
            const qData = pdf_mcqs[currentPdfIndex];
            
            document.getElementById('pdf-counter').innerText = `PDF Q${currentPdfIndex + 1} of ${pdf_mcqs.length}`;
            document.getElementById('pdf-progress').style.width = `${((currentPdfIndex + 1) / pdf_mcqs.length) * 100}%`;
            document.getElementById('pdf-q-text').innerHTML = `<strong>Q${currentPdfIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('pdf-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = pdfAnswers[currentPdfIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === pdfAnswers[currentPdfIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectPdfOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            handleSolutionBox('pdf', qData, hasAnswered);
            
            document.getElementById('pdf-prev-btn').disabled = currentPdfIndex === 0;
            document.getElementById('pdf-next-btn').disabled = currentPdfIndex === pdf_mcqs.length - 1;
        }

        function selectPdfOption(selectedIndex) { 
            pdfAnswers[currentPdfIndex] = selectedIndex;
            if (selectedIndex === pdf_mcqs[currentPdfIndex].correct) {
                pdfRightCount++;
                document.getElementById('pdf-right').innerText = pdfRightCount;
            } else {
                pdfWrongCount++;
                document.getElementById('pdf-wrong').innerText = pdfWrongCount;
            }
            renderPdf(); 
        }
        function goPrevPdf() { if (currentPdfIndex > 0) { currentPdfIndex--; renderPdf(); } }
        function goNextPdf() { if (currentPdfIndex < pdf_mcqs.length - 1) { currentPdfIndex++; renderPdf(); } }

        // ==========================================
        // NUMERICAL ENGINE LOGIC (Flashcards)
        // ==========================================
        let currentNumIndex = 0;

        function startNumerical() {
            if (numerical_data.length === 0) { alert("Numerical Engine is empty."); return; }
            switchView('numerical-page');
            currentNumIndex = 0;
            renderNumerical();
        }

        function renderNumerical() {
            if (numerical_data.length === 0) return;
            const qData = numerical_data[currentNumIndex];
            
            document.getElementById('num-counter').innerText = `Numerical Card ${currentNumIndex + 1} of ${numerical_data.length}`;
            document.getElementById('num-progress').style.width = `${((currentNumIndex + 1) / numerical_data.length) * 100}%`;
            
            // Text ONLY (No numbering)
            document.getElementById('num-q-text').innerHTML = qData.q;
            
            // Reset visibility
            document.getElementById('num-ans-box').style.display = 'none';
            document.getElementById('num-sol-box').style.display = 'none';
            
            // Populate content
            document.getElementById('num-ans-box').innerHTML = `<strong>Answer:</strong> ${qData.ans}`;
            document.getElementById('num-sol-box').innerHTML = qData.sol || "No solution provided.";
            
            document.getElementById('num-prev-btn').disabled = currentNumIndex === 0;
            document.getElementById('num-next-btn').disabled = currentNumIndex === numerical_data.length - 1;
        }

        function goPrevNum() { if (currentNumIndex > 0) { currentNumIndex--; renderNumerical(); } }
        function goNextNum() { if (currentNumIndex < numerical_data.length - 1) { currentNumIndex++; renderNumerical(); } }

        // ==========================================
        // HELPER FUNCTIONS
        // ==========================================
        function handleSolutionBox(prefix, qData, hasAnswered) {
            const solArea = document.getElementById(`${prefix}-sol-area`);
            const solBox = document.getElementById(`${prefix}-sol-box`);
            const revealBtn = document.getElementById(`${prefix}-reveal-btn`);
            
            if (qData.sol) {
                solArea.style.display = 'block';
                solBox.innerHTML = qData.sol;
                solBox.style.display = 'none';
                
                if (hasAnswered) {
                    revealBtn.style.display = 'inline-block';
                    revealBtn.onclick = () => { solBox.style.display = 'block'; };
                } else {
                    revealBtn.style.display = 'none';
                }
            } else {
                solArea.style.display = 'none';
            }
        }

        window.onload = function() {
            document.getElementById('theory-card-count').innerText = theory_mcqs.length + " MCQs";
            document.getElementById('pdf-card-count').innerText = pdf_mcqs.length + " MCQs";
            document.getElementById('num-card-count').innerText = numerical_data.length + " Cards";
        };
    </script>
</body>
