<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH 16 | Gyroscope</title>
    <style>
        :root {
            --bg-color: #050505; --panel-bg: #121212; --text-main: #f0f0f0; --text-muted: #888888;
            --accent: #2a2a2a; --accent-hover: #404040; --border: #333333; --highlight: #555555;
            --correct-bg: #1e4620; --correct-border: #4caf50; --wrong-bg: #4a1919; --wrong-border: #f44336;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 95%; max-width: 1200px; background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); padding: 30px; min-height: 85vh; display: flex; flex-direction: column; position: relative; }
        .view-section { display: none; flex-direction: column; flex-grow: 1; animation: fadeIn 0.3s ease-in-out; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .nav-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; cursor: pointer; border-radius: 4px; transition: background 0.2s; text-decoration: none; font-size: 1rem; }
        .nav-btn:hover { background-color: var(--accent); }
        .btn { background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); padding: 10px 20px; font-size: 1rem; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .btn:hover { background-color: var(--accent); border-color: var(--text-main); }
        
        .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        .module-card { background-color: var(--bg-color); border: 1px solid var(--border); padding: 50px 40px; text-align: center; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .module-card:hover { background-color: var(--accent); border-color: var(--text-muted); transform: translateY(-5px); }
        .module-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .module-card p { color: var(--text-muted); font-family: 'Courier New', monospace; }
        
        .content-area { background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; padding: 25px; flex-grow: 1; font-size: 1.1rem; line-height: 1.7; color: #d0d0d0; overflow-y: auto; max-height: 68vh; }
        
        .quiz-top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .quiz-top-header h2 { margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }
        .score-tracker { font-size: 1rem; font-weight: bold; color: var(--text-muted); }
        .score-right { color: var(--correct-border); }
        .score-wrong { color: var(--wrong-border); }

        .progress-bar-container { width: 100%; background-color: var(--accent); border-radius: 8px; height: 6px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--text-muted); width: 0%; transition: width 0.3s ease; }
        .question-text { font-size: 1.25rem; margin-bottom: 25px; line-height: 1.4; font-weight: 500; color: var(--text-main); } 
        
        .mcq-options { display: flex; flex-direction: column; gap: 10px; }
        .mcq-option { background-color: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 15px 20px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1.05rem; transition: all 0.2s; }
        .mcq-option:hover:not(.disabled) { background-color: var(--accent); }
        .mcq-option.disabled { cursor: default; }
        .mcq-option.correct { background-color: var(--correct-bg); border-color: var(--correct-border); }
        .mcq-option.wrong { background-color: var(--wrong-bg); border-color: var(--wrong-border); }
        
        .feedback-solution { display: block; background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border); padding: 20px; font-size: 1.05rem; font-weight: normal; border-radius: 8px; }
        .flashcard-ans-box { display: block; background-color: rgba(76, 175, 80, 0.15); color: var(--correct-border); border: 1px solid var(--correct-bg); padding: 20px; font-size: 1.15rem; font-weight: bold; border-radius: 8px; margin-bottom: 15px; }

        .quiz-nav-controls { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--accent); }
        .quiz-nav-btn { background-color: var(--highlight); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; min-width: 110px; }
        .quiz-nav-btn:hover:not(:disabled) { background-color: #666666; }
        .quiz-nav-btn:disabled { background-color: var(--bg-color); color: #555; cursor: not-allowed; border: 1px solid #333; }
        
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 25px; margin-bottom: 25px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">

        <div id="module-page" class="view-section" style="display: flex;">
            <div class="header-bar">
                <h2>Chapter 16: Gyroscope</h2>
                <a href="index.html" class="nav-btn">Back to Hub</a>
            </div>
            <div class="module-grid">

                <div class="mcq-options" id="pdf-options"></div>

                <div id="pdf-sol-area" style="margin-top: 20px; display: none; text-align: center;">
                    <button id="pdf-reveal-btn" class="btn" style="border-color: #555;">Reveal Solution</button>
                    <div id="pdf-sol-box" class="feedback-solution" style="display:none; margin-top: 15px; text-align: left;"></div>
                </div>

                <button id="pdf-prev-btn" class="quiz-nav-btn" onclick="goPrevPdf()">Previous</button>

            </div>

        <div id="numerical-page" class="view-section">

                <div class="btn-group">
                    <button class="btn" onclick="document.getElementById('num-ans-box').style.display='block'">Reveal Answer</button>
                    <button class="btn" onclick="document.getElementById('num-sol-box').style.display='block'">Reveal Solution</button>
                </div>

                <div id="num-ans-box" class="flashcard-ans-box" style="display:none;"></div>
                <div id="num-sol-box" class="feedback-solution" style="display:none;"></div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'flex';
        }

        // ==========================================
        // DATA ARRAYS (Awaiting Data)
        // ==========================================
        const theory_mcqs = [
            {
        q: "The basis properties of a gyroscope are: 1. The gyro's weight 2. The rigidity in space 3. The inertia 4. The high RPM 5. The precession. The combination of correct statements is:",
        options: ["a) 2, 5", "b) 3, 4", "c) 2, 3, 5"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "In the building principle of a gyroscope, the best efficiency is obtained through the concentration of the mass:",
        options: ["a) close to the axis and with a low rotation speed", "b) on the periphery and with a low rotation speed", "c) on the periphery and with a high rotation speed"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "Rigidity in a gyroscope is:",
        options: ["a) the reaction 90° in the direction of rotation when applying force to the spinning wheel.", "b) a way to express the stability of the inner and outer gimbal rings.", "c) the tendency it has to remain in its plane of rotation and resist attempts to alter its position."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "Sources of power for Gyroscopic operations in an aircraft are:",
        options: ["a) Vaccum, gravity and rigidity.", "b) Vaccum, pressure and electrical.", "c) Rigidity, rotor speed and movement of inertia."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "The number of degrees of freedom of a gyro is?",
        options: ["a) One more than the number of gimbals.", "b) The same as the number of gimbals.", "c) One less than the number of gimbals."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "A directional gyro requires?",
        options: ["a) One gimbal, one degree of freedom and a horizontal spin axis.", "b) Two gimbals, two degrees of freedom and a horizontal spin axis,", "c) Three gimbals, three degrees of freedom and a lateral spin axis."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "What type of gyro has a horizontal spin axis and one degree of freedom?",
        options: ["a) Rate gyro.", "b) Displacement gyro.", "c) Rate integrating gyro."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "The properties of a gyro are? 1. Mass. 2. Rigidity in space. 3. Inertia. 4. Precession. 5. Rigidity with reference to the earth.",
        options: ["a) 1,2,3,4.", "b) 1,3,4,5.", "c) 1,2,3,5."],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct answer is a."
    },
    {
        q: "Gyro rigidity improves with?",
        options: ["a) Increasing RPM, mass and radial displacement of mass.", "b) Increasing RPM and mass but decreasing radial displacement of mass.", "c) Decreasing RPM but increasing mass and radial displacement of mass."],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct answer is a."
    },
    {
        q: "Apparent wander in the horizontal plane caused by the earth's rotation varies",
        options: ["a) as sine latitude", "b) as cosine latitude", "c) in direct proportion to the angular velocity of the rotor."],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct answer is a."
    },
    {
        q: "A/H indications are reliable in",
        options: ["a) ±85° pitch, ±90° roll", "b) ±55° pitch, ±85° roll", "c) ±85° pitch, ±180° roll"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct answer is a."
    },
    {
        q: "During take off roll an a/c fitted with vacuum driven A/H will show:",
        options: ["a) Climb and bank to right", "b) Only climb and no bank as a/c is on ground.", "c) Will read correct as a/c on ground."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "An a/c rolls out after 180° steep turn to the right with reference to natural horizon. A/H will show",
        options: ["a) Climb and slight bank to the right", "b) Level and bank to the left", "c) Climb and slight bank to the left"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct answer is a."
    },
    {
        q: "An a/c rolls out after 180° steep turn to the left with reference to natural horizon. A/H will show.",
        options: ["a) Climb and slight turn to the right", "b) Level and bank to the left", "c) Climb and slight bank to the left"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "Among the flight control instruments, the artificial horizon plays an essential part. It uses a gyroscope with:",
        options: ["a) one degree of freedom, whose vertical axis oriented in the direction of the real vertical to the location is maintained in this direction by an automatic erecting system", "b) two degrees of freedom, whose horizontal axis corresponding to a reference direction is maintained in a horizontal plane by an automatic erecting system", "c) two degrees of freedom, whose axis is oriented and continuously maintained to local vertical by an automatic erecting system"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "When an aircraft has turned 90 degrees with a constant attitude and bank, the pilot observes the following on a classic artificial horizon:",
        options: ["a) too much nose-up and bank too high", "b) too much nose-up and bank too low", "c) too much nose-up and bank correct"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "Following 180° stabilized turn with a constant attitude and bank, the artificial horizon indicates:",
        options: ["a) too high pitch up and low banking", "b) attitude and banking correct", "c) too low pitch down and correct banking"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct answer is a."
    },
    {
        q: "When an aircraft has turned 360 degrees with a constant attitude and bank, the pilot observes the following on a classic artificial horizon:",
        options: ["a) too much nose-up and bank too high", "b) attitude and bank correct", "c) too much nose-up and bank correct"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct answer is a."
    },
    {
        q: "Classic artificial horizon indications turning through 180° at constant AOB?",
        options: ["a) Nose up and AOB too low.", "b) Nose up and AOB too high.", "c) Nose up and correct AOB."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "During an acceleration phase at constant attitude, the resetting principle of the artificial horizon results in the horizon bar indicating a:",
        options: ["a) nose-down followed by a nose-up attitude", "b) constant attitude", "c) nose-up attitude"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "When an aircraft has turned 270 degrees with a constant attitude and bank, the pilot observes the following on a classic artificial horizon:",
        options: ["a) attitude and bank correct", "b) too much nose-up and bank too low", "c) too much nose-up and bank correct"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "How many degrees of freedom and what is the spin axis of an attitude indicator?",
        options: ["a) Local earth vertical - two degrees of freedom.", "b) Aircraft lateral axis - two degrees of freedom.", "c) Aircraft horizontal axis - one degree of freedom."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c. (Note: standard AI spin axis is vertical with 2 DOF, but following key precisely)."
    },
    {
        q: "What would be the indication on an attitude indicator in a right turn?",
        options: ["a) Climb due to pendulous vanes.", "b) No climb.", "c) Descent due to pendulous vanes."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "What will a classic artificial horizon indicate when turning through 90 degrees at constant attitude and bank angle?",
        options: ["a) Correct bank angle and attitude.", "b) Too much bank and too much nose up attitude.", "c) Too little bank and too much nose up attitude."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "How will a basic AI respond if an aircraft performs a 270 degree turn at constant bank angle and ROT?",
        options: ["a) Nose up and bank.", "b) Nose down and bank.", "c) Nose level and bank."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "What are the errors in a DGI? 1. Transport wander. 2. Earth rate. 3. Heading errors when banking and pitching. 4. Mechanical imperfections.",
        options: ["a) 1, 2, 3.", "b) 1, 2, 4.", "c) All of the above."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "What is the function of the latitude nut on a DI?",
        options: ["a) To correct Coriolis effect.", "b) To compensate for earth rate error.", "c) To compensate for latitude error."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "What error is introduced into a DGI due to movement of the gyro relative to the earth?",
        options: ["a) Transport wander.", "b) Earth rate error.", "c) Altitude error."],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct answer is a."
    },
    {
        q: "The maximum directional gyro error to the earth rotation is:",
        options: ["a) 20°/hour", "b) 15°/hour", "c) 4°/hour"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "A directional gyro is: 1. a gyroscope free around two axis 2. a gyroscope free around one axis 3. capable of self-orientation around an earth-tied direction 4. incapable of self-orientation around an earth-tied direction.",
        options: ["a) 2, 3", "b) 2, 4", "c) 1, 4"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "An airborne instrument, equipped with a gyro with 2 degrees of freedom and a horizontal spin axis is:",
        options: ["a) a flux gate compass", "b) a directional gyro", "c) a turn indicator"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "The heading read on the dial of a directional gyro is subject to errors, one of which is due to the movement of the aircraft. This error...",
        options: ["a) shows itself by an apparent rotation of the horizontal axis of the gyroscope which seems to turn at 15° per hour to the right in the northern hemisphere", "b) is dependent on the ground speed of the aircraft, its true track and the average latitude of the flight", "c) is at its greatest value when the aircraft follows a meridian track"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "The gimbal error of the directional gyro is due to the effect of:",
        options: ["a) an apparent weight and an apparent vertical", "b) too slow precession on the horizontal gimbal ring", "c) a bank or pitch attitude of the aircraft"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "The characteristics of the directional gyro (DG) used in a gyro stabilized compass system are:",
        options: ["a) two degrees of freedom, whose axis aligned with the vertical to the location is maintained in this direction by an erecting system", "b) two degrees of freedom, whose horizontal axis corresponding to the reference direction is maintained in the horizontal plane by an automatic erecting system", "c) one degree of freedom, whose vertical axis, aligned with the real vertical to the location is maintained in this direction by an automatic erecting system"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "The indication of the directional gyro as an on-board instrument are valid only for a short period of time. The causes of this inaccuracy are: 1. the earth's rotation 2. the longitudinal acceleration 3. the aircraft's motion over the surface of the earth 4. the mechanical defects of the gyro 5. the gyro's weight 6. the gimbal mount of the gyro rings",
        options: ["a) 1, 3, 4", "b) 1, 3, 4, 6", "c) 2, 5, 6"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "The indications on a directional gyroscope or gyrocompass are subject to errors, due to: 1. rotation of Earth 2. aero plane motion on Earth 3. lateral and transversal aero plane bank angles 4. north change 5. mechanical defects",
        options: ["a) 2, 3, 5", "b) 3, 4, 5", "c) 1, 2, 3, 5"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct answer is a."
    },
    {
        q: "To maintain same rate of turn, if CAS is increased, bank should be",
        options: ["a) Increased", "b) Decreased", "c) Same"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct answer is a."
    },
    {
        q: "In comparison to low level, to maintain same rate of turn, RAS at higher level is to be-",
        options: ["a) Increased", "b) Decreased", "c) Same"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "In comparison to low level at higher level, if RAS is kept constant to maintain same rate. Bank is to be",
        options: ["a) Increased", "b) Decreased", "c) Same"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct answer is a."
    },
    {
        q: "The ball in a serviceable slip indicator is _________ by _________ and _________ indicate the state of slip.",
        options: ["a) Held central, gravity, does not always", "b) Positioned, Acceleration, does not always", "c) Held central, gravity, always"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct answer is b."
    },
    {
        q: "Increasing altitude at constant TAS will _________ the angle of Bank required to achieve a rate 1 turn.",
        options: ["a) Increase", "b) Decrease", "c) Not affect"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "Following a left engine failure the pilot of a multi engine a/c uses rudder to oppose yaw and keeps the a/c on hdg while using bank to prevent side slip. The TSI will show:",
        options: ["a) both needle and ball central", "b) Both needle and ball to the right", "c) Needle central and ball to the right."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct answer is c."
    },
    {
        q: "The rate turn indicator uses a gyroscope: 1. with one degree of freedom 2. with two degrees of freedom 3. the frame of which is supported by two return springs 4. the spinning wheel axis of which is parallel to the pitch axis 5. the spinning wheel axis of which is parallel to the yawing axis 6. the spinning wheel axis of which is horizontal",

        // ==========================================
        // THEORY ENGINE LOGIC
        // ==========================================
        let currentTheoryIndex = 0;
        let theoryAnswers = [];
        let theoryRightCount = 0;
        let theoryWrongCount = 0;

        function startTheory() {
            if (theory_mcqs.length === 0) { alert("Theory Engine is empty."); return; }
            switchView('theory-page');
            currentTheoryIndex = 0;
            theoryRightCount = 0;
            theoryWrongCount = 0;
            document.getElementById('theory-right').innerText = "0";
            document.getElementById('theory-wrong').innerText = "0";
            theoryAnswers = new Array(theory_mcqs.length).fill(null);
            renderTheory();
        }

        function renderTheory() {
            if (theory_mcqs.length === 0) return;
            const qData = theory_mcqs[currentTheoryIndex];
            
            document.getElementById('theory-counter').innerText = `Theory Q${currentTheoryIndex + 1} of ${theory_mcqs.length}`;
            document.getElementById('theory-progress').style.width = `${((currentTheoryIndex + 1) / theory_mcqs.length) * 100}%`;
            document.getElementById('theory-q-text').innerHTML = `<strong>Q${currentTheoryIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('theory-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = theoryAnswers[currentTheoryIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === theoryAnswers[currentTheoryIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectTheoryOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            handleSolutionBox('theory', qData, hasAnswered);
            
            document.getElementById('theory-prev-btn').disabled = currentTheoryIndex === 0;
            document.getElementById('theory-next-btn').disabled = currentTheoryIndex === theory_mcqs.length - 1;
        }

        function selectTheoryOption(selectedIndex) { 
            theoryAnswers[currentTheoryIndex] = selectedIndex;
            if (selectedIndex === theory_mcqs[currentTheoryIndex].correct) {
                theoryRightCount++;
                document.getElementById('theory-right').innerText = theoryRightCount;
            } else {
                theoryWrongCount++;
                document.getElementById('theory-wrong').innerText = theoryWrongCount;
            }
            renderTheory(); 
        }
        function goPrevTheory() { if (currentTheoryIndex > 0) { currentTheoryIndex--; renderTheory(); } }
        function goNextTheory() { if (currentTheoryIndex < theory_mcqs.length - 1) { currentTheoryIndex++; renderTheory(); } }

        // PDF ENGINE LOGIC
        // ==========================================
        let currentPdfIndex = 0;
        let pdfAnswers = [];
        let pdfRightCount = 0;
        let pdfWrongCount = 0;

        function startPdf() {
            if (pdf_mcqs.length === 0) { alert("PDF Engine is empty."); return; }
            switchView('pdf-page');
            currentPdfIndex = 0;
            pdfRightCount = 0;
            pdfWrongCount = 0;
            document.getElementById('pdf-right').innerText = "0";
            document.getElementById('pdf-wrong').innerText = "0";
            pdfAnswers = new Array(pdf_mcqs.length).fill(null);
            renderPdf();
        }

        function renderPdf() {
            if (pdf_mcqs.length === 0) return;
            const qData = pdf_mcqs[currentPdfIndex];
            
            document.getElementById('pdf-counter').innerText = `PDF Q${currentPdfIndex + 1} of ${pdf_mcqs.length}`;
            document.getElementById('pdf-progress').style.width = `${((currentPdfIndex + 1) / pdf_mcqs.length) * 100}%`;
            document.getElementById('pdf-q-text').innerHTML = `<strong>Q${currentPdfIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('pdf-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = pdfAnswers[currentPdfIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === pdfAnswers[currentPdfIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectPdfOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            handleSolutionBox('pdf', qData, hasAnswered);
            
            document.getElementById('pdf-prev-btn').disabled = currentPdfIndex === 0;
            document.getElementById('pdf-next-btn').disabled = currentPdfIndex === pdf_mcqs.length - 1;
        }

        function selectPdfOption(selectedIndex) { 
            pdfAnswers[currentPdfIndex] = selectedIndex;
            if (selectedIndex === pdf_mcqs[currentPdfIndex].correct) {
                pdfRightCount++;
                document.getElementById('pdf-right').innerText = pdfRightCount;
            } else {
                pdfWrongCount++;
                document.getElementById('pdf-wrong').innerText = pdfWrongCount;
            }
            renderPdf(); 
        }
        function goPrevPdf() { if (currentPdfIndex > 0) { currentPdfIndex--; renderPdf(); } }
        function goNextPdf() { if (currentPdfIndex < pdf_mcqs.length - 1) { currentPdfIndex++; renderPdf(); } }

        // ==========================================
        // NUMERICAL ENGINE LOGIC (Flashcards)
        // ==========================================
        let currentNumIndex = 0;

        function startNumerical() {
            if (numerical_data.length === 0) { alert("Numerical Engine is empty."); return; }
            switchView('numerical-page');
            currentNumIndex = 0;
            renderNumerical();
        }

        function renderNumerical() {
            if (numerical_data.length === 0) return;
            const qData = numerical_data[currentNumIndex];
            
            document.getElementById('num-counter').innerText = `Numerical Card ${currentNumIndex + 1} of ${numerical_data.length}`;
            document.getElementById('num-progress').style.width = `${((currentNumIndex + 1) / numerical_data.length) * 100}%`;
            
            // Text ONLY (No numbering)
            document.getElementById('num-q-text').innerHTML = qData.q;
            
            // Reset visibility
            document.getElementById('num-ans-box').style.display = 'none';
            document.getElementById('num-sol-box').style.display = 'none';
            
            // Populate content
            document.getElementById('num-ans-box').innerHTML = `<strong>Answer:</strong> ${qData.ans}`;
            document.getElementById('num-sol-box').innerHTML = qData.sol || "No solution provided.";
            
            document.getElementById('num-prev-btn').disabled = currentNumIndex === 0;
            document.getElementById('num-next-btn').disabled = currentNumIndex === numerical_data.length - 1;
        }

        function goPrevNum() { if (currentNumIndex > 0) { currentNumIndex--; renderNumerical(); } }
        function goNextNum() { if (currentNumIndex < numerical_data.length - 1) { currentNumIndex++; renderNumerical(); } }

        // ==========================================
        // HELPER FUNCTIONS
        // ==========================================
        function handleSolutionBox(prefix, qData, hasAnswered) {
            const solArea = document.getElementById(`${prefix}-sol-area`);
            const solBox = document.getElementById(`${prefix}-sol-box`);
            const revealBtn = document.getElementById(`${prefix}-reveal-btn`);
            
            if (qData.sol) {
                solArea.style.display = 'block';
                solBox.innerHTML = qData.sol;
                solBox.style.display = 'none';
                
                if (hasAnswered) {
                    revealBtn.style.display = 'inline-block';
                    revealBtn.onclick = () => { solBox.style.display = 'block'; };
                } else {
                    revealBtn.style.display = 'none';
                }
            } else {
                solArea.style.display = 'none';
            }
        }

        window.onload = function() {
            document.getElementById('theory-card-count').innerText = theory_mcqs.length + " MCQs";
            document.getElementById('pdf-card-count').innerText = pdf_mcqs.length + " MCQs";
            document.getElementById('num-card-count').innerText = numerical_data.length + " Cards";
        };
    </script>
