<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH 23 | Radar</title>
    <style>
        :root {
            --bg-color: #050505; --panel-bg: #121212; --text-main: #f0f0f0; --text-muted: #888888;
            --accent: #2a2a2a; --accent-hover: #404040; --border: #333333; --highlight: #555555;
            --correct-bg: #1e4620; --correct-border: #4caf50; --wrong-bg: #4a1919; --wrong-border: #f44336;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 95%; max-width: 1200px; background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); padding: 30px; min-height: 85vh; display: flex; flex-direction: column; position: relative; }
        .view-section { display: none; flex-direction: column; flex-grow: 1; animation: fadeIn 0.3s ease-in-out; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .nav-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; cursor: pointer; border-radius: 4px; transition: background 0.2s; text-decoration: none; font-size: 1rem; }
        .nav-btn:hover { background-color: var(--accent); }
        .btn { background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); padding: 10px 20px; font-size: 1rem; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .btn:hover { background-color: var(--accent); border-color: var(--text-main); }
        
        .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        .module-card { background-color: var(--bg-color); border: 1px solid var(--border); padding: 50px 40px; text-align: center; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .module-card:hover { background-color: var(--accent); border-color: var(--text-muted); transform: translateY(-5px); }
        .module-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .module-card p { color: var(--text-muted); font-family: 'Courier New', monospace; }
        
        .content-area { background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; padding: 25px; flex-grow: 1; font-size: 1.1rem; line-height: 1.7; color: #d0d0d0; overflow-y: auto; max-height: 68vh; }
        
        .quiz-top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .quiz-top-header h2 { margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }
        .score-tracker { font-size: 1rem; font-weight: bold; color: var(--text-muted); }
        .score-right { color: var(--correct-border); }
        .score-wrong { color: var(--wrong-border); }

        .progress-bar-container { width: 100%; background-color: var(--accent); border-radius: 8px; height: 6px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--text-muted); width: 0%; transition: width 0.3s ease; }
        .question-text { font-size: 1.25rem; margin-bottom: 25px; line-height: 1.4; font-weight: 500; color: var(--text-main); } 
        
        .mcq-options { display: flex; flex-direction: column; gap: 10px; }
        .mcq-option { background-color: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 15px 20px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1.05rem; transition: all 0.2s; }
        .mcq-option:hover:not(.disabled) { background-color: var(--accent); }
        .mcq-option.disabled { cursor: default; }
        .mcq-option.correct { background-color: var(--correct-bg); border-color: var(--correct-border); }
        .mcq-option.wrong { background-color: var(--wrong-bg); border-color: var(--wrong-border); }
        
        .feedback-solution { display: block; background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border); padding: 20px; font-size: 1.05rem; font-weight: normal; border-radius: 8px; }
        .flashcard-ans-box { display: block; background-color: rgba(76, 175, 80, 0.15); color: var(--correct-border); border: 1px solid var(--correct-bg); padding: 20px; font-size: 1.15rem; font-weight: bold; border-radius: 8px; margin-bottom: 15px; }

        .quiz-nav-controls { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--accent); }
        .quiz-nav-btn { background-color: var(--highlight); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; min-width: 110px; }
        .quiz-nav-btn:hover:not(:disabled) { background-color: #666666; }
        .quiz-nav-btn:disabled { background-color: var(--bg-color); color: #555; cursor: not-allowed; border: 1px solid #333; }
        
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 25px; margin-bottom: 25px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- MODULE SELECTION -->
        <div id="module-page" class="view-section" style="display: flex;">
            <div class="header-bar">
                <h2>Chapter 23: Radar</h2>
                <a href="index.html" class="nav-btn">Back to Hub</a>
            </div>
            <div class="module-grid">
                <div class="module-card" onclick="startTheory()">
                    <h3>Theory Engine</h3>
                    <p id="theory-card-count">Loading MCQs...</p>
                </div>
                <div class="module-card" onclick="startPdf()">
                    <h3>PDF Data</h3>
                    <p id="pdf-card-count">Loading PDF MCQs...</p>
                </div>
                <div class="module-card" onclick="startNumerical()">
                    <h3>Numericals</h3>
                    <p id="num-card-count">Loading Flashcards...</p>
                </div>
            </div>
        </div>

        <!-- THEORY ENGINE (MCQ) -->
        <div id="theory-page" class="view-section">
            <div class="quiz-top-header">
                <h2 id="theory-counter">Theory Question 1 of X</h2>
                <div class="score-tracker">
                    Right: <span id="theory-right" class="score-right">0</span> | 
                    Wrong: <span id="theory-wrong" class="score-wrong">0</span>
                </div>
                <button class="nav-btn" onclick="switchView('module-page')">Exit Engine</button>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="theory-progress"></div></div>
            
            <div class="content-area">
                <div class="question-text" id="theory-q-text">Loading question...</div>
                <div class="mcq-options" id="theory-options"></div>

                <div id="theory-sol-area" style="margin-top: 20px; display: none; text-align: center;">
                    <button id="theory-reveal-btn" class="btn" style="border-color: #555;">Reveal Solution</button>
                    <div id="theory-sol-box" class="feedback-solution" style="display:none; margin-top: 15px; text-align: left;"></div>
                </div>
            </div>
            
            <div class="quiz-nav-controls">
                <button id="theory-prev-btn" class="quiz-nav-btn" onclick="goPrevTheory()">Previous</button>
                <button id="theory-next-btn" class="quiz-nav-btn" onclick="goNextTheory()">Next</button>
            </div>
        </div>

        <!-- PDF ENGINE (MCQ) -->
        <div id="pdf-page" class="view-section">
            <div class="quiz-top-header">
                <h2 id="pdf-counter">PDF Question 1 of X</h2>
                <div class="score-tracker">
                    Right: <span id="pdf-right" class="score-right">0</span> | 
                    Wrong: <span id="pdf-wrong" class="score-wrong">0</span>
                </div>
                <button class="nav-btn" onclick="switchView('module-page')">Exit PDF Data</button>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="pdf-progress"></div></div>
            
            <div class="content-area">
                <div class="question-text" id="pdf-q-text">Loading question...</div>
                <div class="mcq-options" id="pdf-options"></div>

                <div id="pdf-sol-area" style="margin-top: 20px; display: none; text-align: center;">
                    <button id="pdf-reveal-btn" class="btn" style="border-color: #555;">Reveal Solution</button>
                    <div id="pdf-sol-box" class="feedback-solution" style="display:none; margin-top: 15px; text-align: left;"></div>
                </div>
            </div>
            
            <div class="quiz-nav-controls">
                <button id="pdf-prev-btn" class="quiz-nav-btn" onclick="goPrevPdf()">Previous</button>
                <button id="pdf-next-btn" class="quiz-nav-btn" onclick="goNextPdf()">Next</button>
            </div>
        </div>

        <!-- NUMERICAL ENGINE (FLASHCARDS) -->
        <div id="numerical-page" class="view-section">
            <div class="quiz-top-header">
                <h2 id="num-counter">Numerical 1 of X</h2>
                <button class="nav-btn" onclick="switchView('module-page')">Exit Numericals</button>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="num-progress"></div></div>
            
            <div class="content-area">
                <div class="question-text" id="num-q-text" style="font-size: 1.4rem;">Loading problem...</div>
                
                <div class="btn-group">
                    <button class="btn" onclick="document.getElementById('num-ans-box').style.display='block'">Reveal Answer</button>
                    <button class="btn" onclick="document.getElementById('num-sol-box').style.display='block'">Reveal Solution</button>
                </div>

                <div id="num-ans-box" class="flashcard-ans-box" style="display:none;"></div>
                <div id="num-sol-box" class="feedback-solution" style="display:none;"></div>
            </div>
            
            <div class="quiz-nav-controls">
                <button id="num-prev-btn" class="quiz-nav-btn" onclick="goPrevNum()">Previous</button>
                <button id="num-next-btn" class="quiz-nav-btn" onclick="goNextNum()">Next</button>
            </div>
        </div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'flex';
        }

        // ==========================================
        // DATA ARRAYS (Awaiting Data)
        // ==========================================
        const theory_mcqs = [
            {
        q: "The maximum range of a pulsed radar is governed by which parameter?",
        options: ["a) PW", "b) PRF", "c) Speed of Propagation"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b) PRF."
    },
    {
        q: "The advantage of CW radar over a pulse system is that:",
        options: ["a) there is no minimum range.", "b) a single antenna can be used for TX and RX.", "c) is useful for SSR operations."],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a) there is no minimum range."
    },
    {
        q: "An AWR to be switched on:",
        options: ["a) During taxing by taking precautions for building and hangers.", "b) Only after take off in take off direction", "c) At line up point in take off direction."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c) At line up point in take off direction."
    },
    {
        q: "AWR operation on ground is",
        options: ["a) Totally prohibited", "b) Unrestricted in the aerodrome maintenance area.", "c) Only permitted with certain precautions to safeguard the health of personnel."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c) Only permitted with certain precautions."
    },
    {
        q: "When an altimeter is used for SSR it is always referenced to:",
        options: ["a) 1013.25 hPa", "b) QFE", "c) The pressure setting in use"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a) 1013.25 hPa."
    },
    {
        q: "Mode 'C' or mode 'S' of SSR is not to be used when indication differ more than",
        options: ["a) ±100'", "b) ±200'", "c) None of the above"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c) None of the above."
    },
    {
        q: "A DME receiver does not lock on to its own transmitter because of:",
        options: ["a) It works on the principle of random PRF", "b) DME is free from ground clutter.", "c) Transmitter and receiver are working at different frequency."],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a) It works on the principle of random PRF."
    },
    {
        q: "No. of a/c required to saturate DME beacon are",
        options: ["a) 100", "b) 126", "c) 127"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c) 127."
    },
    {
        q: "Max no of a/c that can use a DME stn are",
        options: ["a) 100", "b) 126", "c) 127"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b) 126."
    },
    {
        q: "An a/c is flying at a height of 20,000 ft over a DME stn it will show.",
        options: ["a) Zero", "b) 2,000'", "c) Appx 6 km"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c) Appx 6 km."
    },
    {
        q: "Ground Speed indications when using a DME will be reliable/ accurate when a/c is flying",
        options: ["a) towards/ away from ground stn", "b) a/c is flying 90º to ground stn (max error)", "c) a/c is flying at height less than 1000' per nm"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a) towards/ away from ground stn."
    },
    {
        q: "An a/c DME shows 50 nm, accuracy of indicated distance will be",
        options: ["a) 0.15 nm ±0.5 nm", "b) 0.625 nm ±0.25nm", "c) 0.5 nm ±"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b) 0.625 nm ±0.25nm."
    },
    {
        q: "A letter Z at the end of identification code means:",
        options: ["a) DME and VOR are not co-located but serving same stn and at a dist of more than 7 nm", "b) DME and VOR are co-located and are serving same stn.", "c) DME and VOR are not co-located, are serving same stn. are within 7 nm from each other."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c)."
    },
    {
        q: "In which situation will speed indications on a airborne Distance Measuring Equipment (DME) most closely represent the groundspeed of an aircraft flying at FL400?",
        options: ["a) When overhead the station, with no change of heading at transit", "b) When tracking directly towards the station at a range of 100NM or more", "c) When passing abeam the station and within 5NM of it"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b)."
    },
    {
        q: "What is the maximum distance between VOR and DME/TACAN ground installations if they are to have same morse code identifier?",
        options: ["a) 2000m", "b) 300m", "c) 600m"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c) 600m."
    },
    {
        q: "A DME in tracking mode subsequently experiences a reduction in signal strength will switch the equipment in the first instance to:",
        options: ["a) standby mode", "b) memory mode", "c) signal controlled search"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b) memory mode."
    },
    {
        q: "Of what use, if any, is a military TACAN station to civil aviation?",
        options: ["a) It is of no use to civil aviation", "b) It can provide DME distance", "c) It can provide a magnetic bearing"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b) It can provide DME distance."
    },
    {
        q: "A DME that has difficulty obtaining a \"lock-on\":",
        options: ["a) stays in search mode but reduces PRF to max. 60PPS after 1500 pulse pairs have been transmitted", "b) stays in search mode but without a reduction in PRF", "c) stays in search mode but reduces PRF to max. 60PPS after 100 seconds"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a)."
    },
    {
        q: "A VOR and DME are co-located. You want to identify the DME by listening to the Call sign. Having heard the same call sign 4 times in 30 seconds the:",
        options: ["a) VOR and DME call signs were the same and broadcast with the same pitch", "b) DME call sign was not transmitted, the distance information is sufficient proof of correct operation", "c) DME call sign is the one with the higher pitch that was broadcast only once"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c)."
    },
    {
        q: "The aircraft DME receiver cannot lock on to interrogation signals reflected from the ground because:",
        options: ["a) DME pulse recurrent rates are varied", "b) aircraft transmitter and DME ground station are transmitted on different frequencies", "c) reflections are subject to Doppler frequency shift"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b)."
    },
    {
        q: "Distance Measuring Equipment (DME) operates in the:",
        options: ["a) UHF band and is a secondary radar system", "b) SHF band and uses frequency modulation techniques", "c) UHF band and is a primary radar system"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a)."
    },
    {
        q: "The DME (Distance Measuring Equipment) operates within the following frequencies:",
        options: ["a) 329 to 335MHz", "b) 962 to 1213MHz", "c) 962 to 1213KHz"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b) 962 to 1213MHz."
    },
    {
        q: "On a DME, display counters rotating throughout their range indicates:",
        options: ["a) airborne equipment failure", "b) the airborne equipment is conducting a frequency search", "c) the airborne receiver is conducting a range search"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c)."
    },
    {
        q: "During a flight at FL210, a pilot does not receive any DME distance indication from a DME station located approximately 220NM away. The reason for this that the:",
        options: ["a) Aero plane is circling around the station", "b) Aero plane is below the \"line of sight\" altitude", "c) Altitude is too high"],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b)."
    },
    {
        q: "For a conventional DME facility \"Beacon Saturation\" will occur whenever the number of simultaneous interrogations exceeds:",
        options: ["a) 60", "b) 200", "c) 100"],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c) 100."
    },
    {
        q: "Which of the following will give the most accurate calculation of aircraft ground speed?",
        options: ["a) A DME station sited on the flight route", "b) A VOR station sited on the flight route", "c) A DME station sited across the flight route"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a)."
    },
    {
        q: "An aircraft will not accept replies from its own transmissions that are reflected from the ground because the:",
        options: ["a) the aircraft's registration is embedded onto the signal.", "b) pulses are transmitted in pairs.", "c) interrogation and reply frequencies are 63 Mhz apart."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c)."
    },
    {
        q: "If an ident signal is received once in 30 seconds on a frequency paired VOR/DME, then:",
        options: ["a) the VOR only is operational.", "b) the TACAN signal is degraded.", "c) the DME only is operational."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c)."
    },
    {
        q: "An aircraft DME receiver rejects pulses meant for other aircraft because:",
        options: ["a) the random PRF is unique to each aircraft.", "b) transmission and reply frequencies are 63 MHz apart.", "c) the pulses are unique to each aircraft."],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a)."
    },
    {
        q: "The DME automatic standby will activate the DME interrogator when:",
        options: ["a) there are too many aircraft in the area for it to service.", "b) a VOR frequency that has a frequency paired DME is selected.", "c) the DME ident signal is received."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b)."
    },
    {
        q: "Airborne DME equipment is able to discriminate between pulses intended for it self and pulses intended for other aircraft because:",
        options: ["a) aircraft will only accept unique twin pulses.", "b) aircraft reject pulses not synchronised with its own random pulse recurrence rate.", "c) each aircraft has its own frequency allocation."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b)."
    },
    {
        q: "The range indicated by DME is considered to be accurate to within:",
        options: ["a) 0.2 nm.", "b) 3% of range.", "c) 1.25 % of range ± 0.25nm."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c)."
    },
    {
        q: "DME and VOR are frequency paired because:",
        options: ["a) cockpit workload is reduced.", "b) both ground transmitter aerials can be placed on the same site if required.", "c) the same receiver can be used for both aids."],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a)."
    },
    {
        q: "A DME receiver is able to distinguish between replies to its own interrogation pulses and those intended for other aircraft using the same transponder because:",
        options: ["a) DME is a secondary radar and each aircraft transmits and receives on a different frequency.", "b) when DME is in the range search mode it will accept only pulses separated by + or - 63 MHz from the interrogation frequency.", "c) each aircraft transmits pulses at a random rate (jittering) and will only accept replies that match this randomisation."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c)."
    },
    {
        q: "Referring to DME during the initial stage of the search pattern before lock-on:",
        options: ["a) the airborne transmitter transmits 150 pulses each second.", "b) the aircraft transmits 24 pulses per second and the receiver checks a maximum of 150 pulses per second.", "c) the ground receiver maintains the ground transmitter pulse transmission rate at no more than 150 per second."],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a)."
    },
    {
        q: "DME is a (i) radar operating in the (ii) band and transmits (iii).",
        options: ["a) (i) secondary; (ii) UHF; (iii) pulse pairs", "b) (i) secondary; (ii) SHF; (iii) 2400 pulse pairs per second", "c) (i) primary; (ii) SHF; (iii) CW pulses"],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a). Note: Key marked c) in image 10 row 54, but actually the options in the book for Q54 indicate a) matches secondary, UHF, pulse pairs. Key indicates a is correct."
    },
    {
        q: "The accuracy of a DME:",
        options: ["a) is approximately +- 2 nm.", "b) is approximately +- 0.5 nm.", "c) decreases with increase of range."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c)."
    },
    {
        q: "The OFF flag on aircraft DME mileage displays indicate:",
        options: ["a) any of the below; B or C.", "b) the DME is off.", "c) DME is tuned to the wrong frequency."],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a)."
    },
    {
        q: "Groundspeed measurement using DME equipment is most accurate flying:",
        options: ["a) towards the station at short range.", "b) past the station at short range.", "c) from the station at long range."],
        correct: 2,
        sol: "<strong>Explanation:</strong> Correct option is c)."
    },
    {
        q: "A VOR/DME share the same first two letters of their respective identifiers; the last identifying letter of the DME is a Z.. This means that:",
        options: ["a) they are a maximum distance of 30m apart.", "b) they are more than 600m apart but serve the same location.", "c) they are widely separated and do not serve the same location."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b)."
    },
    {
        q: "When a DME is used instead of marker beacons to provide range to the threshold on an ILS approach and where the DME frequency is paired with the ILS, the DME indications should not be used at altitudes greater than:",
        options: ["a) 25,000 ft", "b) 6,000 ft.", "c) 3,000 ft."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b)."
    },
    {
        q: "IF a VOR station and a DME station, having different locations, are selected to provide a fix:",
        options: ["a) all 2 answers below are correct.", "b) two different IDs will have to be checked.", "c) two sets, with separate frequency control, are required in the aircraft."],
        correct: 0,
        sol: "<strong>Explanation:</strong> Correct option is a)."
    },
    {
        q: "The airborne DME equipment will transmit pulse pairs at a comparatively high PRF:",
        options: ["a) At all times, except when the panel control LO is operated.", "b) When first switched on and after a channel selection.", "c) Whenever a stable signal is being received from the selected ground station."],
        correct: 1,
        sol: "<strong>Explanation:</strong> Correct option is b)."
    },

        let currentTheoryIndex = 0;
        let theoryAnswers = [];
        let theoryRightCount = 0;
        let theoryWrongCount = 0;

        function startTheory() {
            if (theory_mcqs.length === 0) { alert("Theory Engine is empty."); return; }
            switchView('theory-page');
            currentTheoryIndex = 0;
            theoryRightCount = 0;
            theoryWrongCount = 0;
            document.getElementById('theory-right').innerText = "0";
            document.getElementById('theory-wrong').innerText = "0";
            theoryAnswers = new Array(theory_mcqs.length).fill(null);
            renderTheory();
        }

        function renderTheory() {
            if (theory_mcqs.length === 0) return;
            const qData = theory_mcqs[currentTheoryIndex];
            
            document.getElementById('theory-counter').innerText = `Theory Q${currentTheoryIndex + 1} of ${theory_mcqs.length}`;
            document.getElementById('theory-progress').style.width = `${((currentTheoryIndex + 1) / theory_mcqs.length) * 100}%`;
            document.getElementById('theory-q-text').innerHTML = `<strong>Q${currentTheoryIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('theory-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = theoryAnswers[currentTheoryIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === theoryAnswers[currentTheoryIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectTheoryOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            handleSolutionBox('theory', qData, hasAnswered);
            
            document.getElementById('theory-prev-btn').disabled = currentTheoryIndex === 0;
            document.getElementById('theory-next-btn').disabled = currentTheoryIndex === theory_mcqs.length - 1;
        }

        function selectTheoryOption(selectedIndex) { 
            theoryAnswers[currentTheoryIndex] = selectedIndex;
            if (selectedIndex === theory_mcqs[currentTheoryIndex].correct) {
                theoryRightCount++;
                document.getElementById('theory-right').innerText = theoryRightCount;
            } else {
                theoryWrongCount++;
                document.getElementById('theory-wrong').innerText = theoryWrongCount;
            }
            renderTheory(); 
        }
        function goPrevTheory() { if (currentTheoryIndex > 0) { currentTheoryIndex--; renderTheory(); } }
        function goNextTheory() { if (currentTheoryIndex < theory_mcqs.length - 1) { currentTheoryIndex++; renderTheory(); } }

        let currentNumIndex = 0;

        function renderNumerical() {
            if (numerical_data.length === 0) return;
            const qData = numerical_data[currentNumIndex];
            
            document.getElementById('num-counter').innerText = `Numerical Card ${currentNumIndex + 1} of ${numerical_data.length}`;
            document.getElementById('num-progress').style.width = `${((currentNumIndex + 1) / numerical_data.length) * 100}%`;
            
            // Text ONLY (No numbering)
            document.getElementById('num-q-text').innerHTML = qData.q;
            
            // Reset visibility
            document.getElementById('num-ans-box').style.display = 'none';
            document.getElementById('num-sol-box').style.display = 'none';
            
            // Populate content
            document.getElementById('num-ans-box').innerHTML = `<strong>Answer:</strong> ${qData.ans}`;
            document.getElementById('num-sol-box').innerHTML = qData.sol || "No solution provided.";
            
            document.getElementById('num-prev-btn').disabled = currentNumIndex === 0;
            document.getElementById('num-next-btn').disabled = currentNumIndex === numerical_data.length - 1;

        // ==========================================
        // HELPER FUNCTIONS
        // ==========================================
        function handleSolutionBox(prefix, qData, hasAnswered) {
            const solArea = document.getElementById(`${prefix}-sol-area`);
            const solBox = document.getElementById(`${prefix}-sol-box`);
            const revealBtn = document.getElementById(`${prefix}-reveal-btn`);
            
            if (qData.sol) {
                solArea.style.display = 'block';
                solBox.innerHTML = qData.sol;
                solBox.style.display = 'none';
                
                if (hasAnswered) {
                    revealBtn.style.display = 'inline-block';
                    revealBtn.onclick = () => { solBox.style.display = 'block'; };
                } else {
                    revealBtn.style.display = 'none';
                }
            } else {
                solArea.style.display = 'none';
            }
        }

        window.onload = function() {
            document.getElementById('theory-card-count').innerText = theory_mcqs.length + " MCQs";
            document.getElementById('pdf-card-count').innerText = pdf_mcqs.length + " MCQs";
            document.getElementById('num-card-count').innerText = numerical_data.length + " Cards";
        };
