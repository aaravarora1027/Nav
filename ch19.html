            --bg-color: #050505; --panel-bg: #121212; --text-main: #f0f0f0; --text-muted: #888888;

        .nav-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; cursor: pointer; border-radius: 4px; transition: background 0.2s; text-decoration: none; font-size: 1rem; }
        .nav-btn:hover { background-color: var(--accent); }
        .btn { background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); padding: 10px 20px; font-size: 1rem; cursor: pointer; transition: all 0.2s; border-radius: 4px; }

        .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; justify-content: center; }
        .module-card { background-color: var(--bg-color); border: 1px solid var(--border); padding: 50px 40px; text-align: center; cursor: pointer; border-radius: 4px; transition: all 0.2s; max-width: 400px; margin: 0 auto; width: 100%; }
        .module-card:hover { background-color: var(--accent); border-color: var(--text-muted); transform: translateY(-5px); }
        .module-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .module-card p { color: var(--text-muted); font-family: 'Courier New', monospace; }
        
        .content-area { background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; padding: 25px; flex-grow: 1; font-size: 1.1rem; line-height: 1.7; color: #d0d0d0; overflow-y: auto; max-height: 68vh; }
        
        .quiz-top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .quiz-top-header h2 { margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }
        .score-tracker { font-size: 1rem; font-weight: bold; color: var(--text-muted); }
        .score-right { color: var(--correct-border); }
        .score-wrong { color: var(--wrong-border); }

        .progress-bar-container { width: 100%; background-color: var(--accent); border-radius: 8px; height: 6px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--text-muted); width: 0%; transition: width 0.3s ease; }
        .question-text { font-size: 1.25rem; margin-bottom: 25px; line-height: 1.4; font-weight: 500; color: var(--text-main); } 
        
        .mcq-options { display: flex; flex-direction: column; gap: 10px; }
        .mcq-option { background-color: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 15px 20px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1.05rem; transition: all 0.2s; }
        .mcq-option:hover:not(.disabled) { background-color: var(--accent); }
        .mcq-option.disabled { cursor: default; }
        .mcq-option.correct { background-color: var(--correct-bg); border-color: var(--correct-border); }
        .mcq-option.wrong { background-color: var(--wrong-bg); border-color: var(--wrong-border); }
        
        .feedback-solution { display: block; background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border); padding: 20px; font-size: 1.05rem; font-weight: normal; border-radius: 8px; }

        .quiz-nav-controls { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--accent); }
        .quiz-nav-btn { background-color: var(--highlight); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; min-width: 110px; }
        .quiz-nav-btn:hover:not(:disabled) { background-color: #666666; }
        .quiz-nav-btn:disabled { background-color: var(--bg-color); color: #555; cursor: not-allowed; border: 1px solid #333; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'flex';
        }

        // ==========================================
        // DATA ARRAYS (Awaiting Data)
        // ==========================================
        const theory_mcqs = [
            {
        q: "Direction property error is known as?",
        options: [
            "a) 180° ambiguity",
            "b) 90° ambiguity",
            "c) quadrantal error"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> Direction property error is inherently known as 180° ambiguity because a simple loop aerial cannot distinguish whether the signal is coming from a specific direction or its exact reciprocal (180° away)."
    },
    {
        q: "What is used to resolve 180° ambiguity?",
        options: [
            "a) Align radio compass to True North",
            "b) Sense Aerial",
            "c) Loop Aerial."
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> A sense aerial (omnidirectional) is combined with the loop aerial (figure-of-eight polar diagram) to produce a cardioid polar diagram, which resolves the 180° ambiguity."
    },
    {
        q: "An A/C is flying on HDG of 315°, which of the following signal will cause maximum quadrantal error.",
        options: [
            "a) 360°",
            "b) 225°",
            "c) 135°"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> Quadrantal error is maximum on relative bearings of 045°, 135°, 225°, and 315°. If the aircraft heading is 315°, a signal coming from 360° True represents a relative bearing of 045° (360° - 315°), where the error is maximum."
    },
    {
        q: "Variations of signal in NDB receivers due skywaves indicates the presence of:",
        options: [
            "a) night effect.",
            "b) coastal refraction.",
            "c) mountain or terrain effect."
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> Night effect is caused by the interference between the ground wave and the skywave (which reflects off the ionosphere at night), leading to signal fading and bearing fluctuations."
    },
    {
        q: "The BFO selector on an ADF receiver is used to:",
        options: [
            "a) find the loop \"null\" position",
            "b) stop loop rotation",
            "c) hear the IDENT of some NDB stations radiating a continuous wave signal"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> The Beat Frequency Oscillator (BFO) produces an audible tone allowing the pilot to hear the unmodulated carrier wave (NON/A1A) Morse code identification of the NDB."
    },
    {
        q: "Which one of the following disturbances is most likely to cause the greatest inaccuracy in ADF bearings?",
        options: [
            "a) Quadrantal error",
            "b) Local thunderstorm activity",
            "c) Coastal effect"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> Thunderstorms emit strong Low Frequency (LF) signals (static crashes). The ADF needle will often point towards nearby lightning instead of the tuned NDB station."
    },
    {
        q: "Factors liable to affect most NDB/ADF system performance and reliability include:",
        options: [
            "a) static interference- night effect- absence of failure warning system",
            "b) static interference- station interference- latitude error",
            "c) height error- station interference- mountain effect"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> The ADF system is heavily susceptible to static (thunderstorms), night effect (skywaves), and critically lacks a built-in failure warning system (flag) if the signal is lost."
    },
    {
        q: "There are two NDBs, one 20NM inland, and the other 50NM inland from the coast. Assuming that the error caused by coastal refraction is the same for both propagations, the extent of the error in a position line plotted by an aircraft that is over water will be:",
        options: [
            "a) greater from the beacon that is 20NM inland",
            "b) the same from both beacons when the aircraft is on a relative bearing of 180° and 360°",
            "c) greater from the beacon that is 50NM inland"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Even if the angular refraction error at the coastline is the same, the lateral displacement (position line error) increases with distance. The NDB further inland (50NM) will result in a greater position error when plotted."
    },
    {
        q: "What is the wavelength of an NDB transmitting on 373 kHz?",
        options: [
            "a) 800m",
            "b) 80m",
            "c) 8000m"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> Wavelength (λ) = Speed of Light (c) / Frequency (f). λ = 300,000,000 m/s / 373,000 Hz ≈ 804 meters, rounded to 800m."
    },
    {
        q: "An aircraft is \"homing\" to a radio beacon whilst maintaining a relative bearing of zero. If the magnetic heading decreases, the aircraft is experiencing:",
        options: [
            "a) zero drift",
            "b) right drift",
            "c) left drift"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> If maintaining a relative bearing of zero and the magnetic heading decreases, the aircraft is turning left into the wind to maintain the station on the nose, indicating it is experiencing right drift."
    },
    {
        q: "Errors caused by the effect of coastal refraction on bearings at lower altitudes are maximum when the NDB is:",
        options: [
            "a) inland and the bearing crosses the coast at an acute angle",
            "b) inland and the bearing crosses the coast at right angles",
            "c) near the coast and the bearing crosses the coast at right angles"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> Coastal refraction is worst when the radio wave crosses the coastline at a sharp/acute angle from an inland station due to the change in propagation speed between land and water."
    },
    {
        q: "Quadrantal errors associated with aircraft Automatic Direction Finding (ADF) equipment are caused by:",
        options: [
            "a) skywave/ground wave contamination",
            "b) signal bending by the aircraft metallic surfaces",
            "c) signal bending caused by electrical interference from aircraft wiring"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> The aircraft's metallic airframe re-radiates the incoming signal, causing it to bend. This is most pronounced in the quadrants (045°, 135°, etc.) relative to the aircraft's longitudinal axis."
    },
    {
        q: "\"Night Effect\" which causes loss of signal and fading, resulting in bearing errors from transmissions, is due to:",
        options: [
            "a) interference from other transmissions and is maximum at dusk when east of the NDB",
            "b) static activity increasing at night particularly in the lower frequency band",
            "c) skywave distortion of the null position and is maximum at dawn and dusk"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Night effect is caused by ground waves mixing with returning skywaves that refract off the shifting ionosphere, particularly unstable during the twilight hours of dawn and dusk."
    },
    {
        q: "Which of the following is likely to have the greatest effect on ADF accuracy?",
        options: [
            "a) Mutual interference between aircraft aerials",
            "b) Frequency drift at the ground station",
            "c) Interference from other NDBs, particularly at night"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Station interference (co-channel interference) is significantly worse at night because skywaves allow distant NDBs sharing the same frequency to be received, interfering with the local NDB."
    },
    {
        q: "An aircraft is maintaining track outbound from an NDB with a constant relative bearing of 184°. To return to the NDB the relative bearing to maintain is:",
        options: [
            "a) 184°",
            "b) 004°",
            "c) 356°"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Since the outbound RB is 184°, the aircraft is tracking with 4° of right drift (180°+4°). To fly inbound, the wind must be kept on the same side, requiring a heading alteration into the wind. The reciprocal track requires maintaining an RB of 356° (360°-4°)."
    },
    {
        q: "Consider the following statements on the NDB transmitter:",
        options: [
            "a) It is operating in the HF/VHF band.",
            "b) It is very simple, being required to transmit only a carrier wave and identification.",
            "c) In India, most NDBs operate in the frequency band 455 - 1750 kHz."
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> NDBs are simple, low-cost beacons that continuously broadcast a non-directional carrier wave superimposed with a Morse code identifier (usually in the LF/MF bands, 190-1750 kHz)."
    },
    {
        q: "The purpose of the BFO switch on the ADF receiver is to:",
        options: [
            "a) cut out the static noise.",
            "b) improve the strength of the received signal.",
            "c) make the signal audible."
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Unmodulated (NON/A1A) signals carry no audio tone on their own. The BFO generates a tone inside the receiver to make the Morse code carrier interruptions audible to the human ear."
    },
    {
        q: "When using NDBs night effect is most likely to be greatest at:",
        options: [
            "a) dusk.",
            "b) dawn or dusk.",
            "c) dawn."
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> The ionosphere is rapidly changing its height and composition during the transition between day and night (twilight hours of dawn and dusk), causing the most severe skywave interference."
    },
    {
        q: "With regard to the following types of NDB which statements is correct?",
        options: [
            "a) Locators have 200 W power, 50 nm range and are NON A2A.",
            "b) Locators have 5000 W power, 50 nm range and are NON A1A.",
            "c) Locators have 15 W power, 10-25 nm range and are NON A2A."
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Locator beacons (L) are low-powered NDBs, usually around 15 watts, providing a short operational range of 10 to 25 NM, primarily used for approach procedures (NON A2A/A2)."
    },
    {
        q: "The D layer of the ionosphere affects the accuracy of NDB bearings:",
        options: [
            "a) never.",
            "b) by day and night.",
            "c) by night only."
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Wait, the D layer absorbs LF/MF frequencies during the day, preventing skywaves. At night, the D layer disappears, allowing signals to reach the E layer, reflect back, and cause 'night effect' inaccuracies."
    },
    {
        q: "An ADF uses a sense aerial to:",
        options: [
            "a) transmit the beacon ident.",
            "b) determine the null position.",
            "c) resolve ambiguous bearings."
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> The loop aerial alone has 180° ambiguity. The sense aerial resolves this by combining its omnidirectional signal with the loop's signal to definitively identify the direction of the station."
    },
    {
        q: "Which of the following equipments does not have a system to warn the pilot that it is inoperative:",
        options: [
            "a) ADF",
            "b) ILS",
            "c) VOR"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> Unlike VOR or ILS which have failure flags, the ADF does not have a built-in warning flag to indicate a loss of signal. The pilot must continuously monitor the audio IDENT."
    },
    {
        q: "The BFO:",
        options: [
            "a) is used to make the ident from an A1A NDB audible.",
            "b) is used to determine the signal strength of an NDB.",
            "c) creates the audio ident for an NDB."
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> A1A (or NON) emissions only interrupt the carrier wave for Morse code without adding an audio tone. The BFO (Beat Frequency Oscillator) mixes with the carrier to produce an audible beat frequency."
    },
    {
        q: "An NDB signal crossing from land to sea will ... speed and bend ... the normal.",
        options: [
            "a) decrease, away from",
            "b) increase, towards.",
            "c) increase, away from."
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Radio waves travel slightly faster over water (less surface attenuation) than over land. As they speed up upon hitting the coastline, they bend away from the normal."
    },
    {
        q: "Long range NDBs normally employ:",
        options: [
            "a) A3W",
            "b) A9E",
            "c) NON/A1A"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> Long-range NDBs typically use unmodulated (NON/A1A) carrier waves for better range and efficiency, requiring the receiver's BFO to hear the identifier."
    },
    {
        q: "When using a N0N A2A NDB the BFO should be:",
        options: [
            "a) off for tuning and on for identification.",
            "b) off for tuning and off for identification.",
            "c) on for tuning and off for identification."
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> For N0N A2A, the carrier is unmodulated (N0N) but the ident is modulated (A2A). BFO should be ON to find the unmodulated carrier during tuning, but OFF to clearly hear the A2A modulated identification."
    },
    {
        q: "What is the approved frequency band assigned to aeronautical ADFs?",
        options: [
            "a) 190-1750 kHz",
            "b) 190-1750 Hz",
            "c) 190-1750 GHz"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> The standard aeronautical frequency band allocated for NDBs and ADF equipment is in the Low and Medium Frequency (LF/MF) range, specifically 190 to 1750 kHz."
    },
    {
        q: "The promulgated range for an NDB is applicable:",
        options: [
            "a) during daytime only.",
            "b) throughout 24 hours, but is most prone to error around dusk and dawn.",
            "c) during night time only."
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> The rated coverage (promulgated range) of an NDB is based strictly on daytime ground wave propagation, where skywave interference is absorbed by the D layer."
    },
    {
        q: "An aero plane is flying parallel to a coast. Which of the following NDBs will give the greatest coastal refraction LOP error?",
        options: [
            "a) NDB sited on the coast-RBI 300° .",
            "b) NDB sited 30 nm inland-RBI 330° .",
            "c) NDB sited on the coast-RBI 330° ."
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> Coastal refraction is most severe when the signal travels a significant distance inland and crosses the coastline at an acute angle (e.g., RBI 330°). Thus, the station 30 NM inland yields the highest error."
    },
    {
        q: "A radio beacon has an operational range of 10 NM. By what factor should the transmitter power be increased in order to achieve an operational range of 20 NM?",
        options: [
            "a) Eight",
            "b) Four",
            "c) Two"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> Range is proportional to the square root of power. To double the range (10 NM to 20 NM, a factor of 2), the transmission power must be quadrupled (2² = 4)."
    }
            // Format: { q: "Question?", options: ["a) Opt 1", "b) Opt 2", "c) Opt 3"], correct: 0, sol: "<strong>Explanation:</strong> text" }
        ];

        const pdf_mcqs = [
            {
        q: "The ideal length for a Marconi aerial for a frequency of 406 MHz is:",
        options: [
            "a. 36.9 cm",
            "b. 35.1 cm",
            "c. 17.5 cm",
            "d. 18.5 cm"
        ],
        correct: 2,
        sol: "<strong>Explanation:</strong> A Marconi aerial is a quarter-wave (λ/4) antenna. Wavelength λ = c/f. Using the effective propagation speed in a wire (approx 95% of c): λ = (300,000,000 * 0.95) / 406,000,000 ≈ 0.701 m. A quarter of this is ≈ 0.175 m or 17.5 cm."
    },
    {
        q: "A disadvantage of directivity is:",
        options: [
            "a. reduced range",
            "b. side lobes",
            "c. phase distortion",
            "d. ambiguity"
        ],
        correct: 1,
        sol: "<strong>Explanation:</strong> Highly directive antennas often produce unwanted \"side lobes\" of radiation in addition to the main lobe, which can cause interference or false returns in systems like radar."
    },
    {
        q: "Which of the following is not an advantage of a slotted antenna (phase array)?",
        options: [
            "a. Reduced side lobes",
            "b. Improved resolution",
            "c. Reduced power",
            "d. Directivity"
        ],
        correct: 3,
        sol: "<strong>Explanation:</strong> Directivity is a characteristic of slotted antennas, but when listed among these options in this context, the primary advantages sought are reduced side lobes, better resolution, and efficient power use. (As per standard examination keys, Directivity is considered the odd one out as an 'advantage')."
    },
    {
        q: "The ideal length of a half-wave dipole for a frequency of 75 MHz is:",
        options: [
            "a. 1.9 m",
            "b. 95 cm",
            "c. 3.8 m",
            "d. 47.5 cm"
        ],
        correct: 0,
        sol: "<strong>Explanation:</strong> A half-wave dipole is λ/2. Wavelength λ = c/f = 300 / 75 = 4 meters. Taking into account the 95% velocity factor in standard aerial wire: 4 m * 0.95 = 3.8 m. Half of that is 1.9 meters."
    },
    {
        q: "Doppler operates on the principle that ...... between a transmitter and receiver will cause the received frequency to ....... if the transmitter and receiver are moving ....... .",

        // ==========================================
        // THEORY ENGINE LOGIC
        // ==========================================
        let currentTheoryIndex = 0;
        let theoryAnswers = [];
        let theoryRightCount = 0;
        let theoryWrongCount = 0;

        function startTheory() {
            if (theory_mcqs.length === 0) { alert("Theory Engine is empty."); return; }
            switchView('theory-page');
            currentTheoryIndex = 0;
            theoryRightCount = 0;
            theoryWrongCount = 0;
            document.getElementById('theory-right').innerText = "0";
            document.getElementById('theory-wrong').innerText = "0";
            theoryAnswers = new Array(theory_mcqs.length).fill(null);
            renderTheory();
        }

        function renderTheory() {
            if (theory_mcqs.length === 0) return;
            const qData = theory_mcqs[currentTheoryIndex];
            
            document.getElementById('theory-counter').innerText = `Theory Q${currentTheoryIndex + 1} of ${theory_mcqs.length}`;
            document.getElementById('theory-progress').style.width = `${((currentTheoryIndex + 1) / theory_mcqs.length) * 100}%`;
            document.getElementById('theory-q-text').innerHTML = `<strong>Q${currentTheoryIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('theory-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = theoryAnswers[currentTheoryIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === theoryAnswers[currentTheoryIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectTheoryOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            handleSolutionBox('theory', qData, hasAnswered);
            
            document.getElementById('theory-prev-btn').disabled = currentTheoryIndex === 0;
            document.getElementById('theory-next-btn').disabled = currentTheoryIndex === theory_mcqs.length - 1;
        }

        function selectTheoryOption(selectedIndex) { 
            theoryAnswers[currentTheoryIndex] = selectedIndex;
            if (selectedIndex === theory_mcqs[currentTheoryIndex].correct) {
                theoryRightCount++;
                document.getElementById('theory-right').innerText = theoryRightCount;
            } else {
                theoryWrongCount++;
                document.getElementById('theory-wrong').innerText = theoryWrongCount;
            }
            renderTheory(); 
        }
        function goPrevTheory() { if (currentTheoryIndex > 0) { currentTheoryIndex--; renderTheory(); } }
        function goNextTheory() { if (currentTheoryIndex < theory_mcqs.length - 1) { currentTheoryIndex++; renderTheory(); } }

        // ==========================================
        // PDF ENGINE LOGIC
        // ==========================================
        let currentPdfIndex = 0;
        let pdfAnswers = [];
        let pdfRightCount = 0;
        let pdfWrongCount = 0;

        function startPdf() {
            if (pdf_mcqs.length === 0) { alert("PDF Engine is empty."); return; }
            switchView('pdf-page');
            currentPdfIndex = 0;
            pdfRightCount = 0;
            pdfWrongCount = 0;
            document.getElementById('pdf-right').innerText = "0";
            document.getElementById('pdf-wrong').innerText = "0";
            pdfAnswers = new Array(pdf_mcqs.length).fill(null);
            renderPdf();
        }

        function renderPdf() {
            if (pdf_mcqs.length === 0) return;
            const qData = pdf_mcqs[currentPdfIndex];
            
            document.getElementById('pdf-counter').innerText = `PDF Q${currentPdfIndex + 1} of ${pdf_mcqs.length}`;
            document.getElementById('pdf-progress').style.width = `${((currentPdfIndex + 1) / pdf_mcqs.length) * 100}%`;
            document.getElementById('pdf-q-text').innerHTML = `<strong>Q${currentPdfIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('pdf-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = pdfAnswers[currentPdfIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === pdfAnswers[currentPdfIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectPdfOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            handleSolutionBox('pdf', qData, hasAnswered);
            
            document.getElementById('pdf-prev-btn').disabled = currentPdfIndex === 0;
            document.getElementById('pdf-next-btn').disabled = currentPdfIndex === pdf_mcqs.length - 1;
        }

        function selectPdfOption(selectedIndex) { 
            pdfAnswers[currentPdfIndex] = selectedIndex;
            if (selectedIndex === pdf_mcqs[currentPdfIndex].correct) {
                pdfRightCount++;
                document.getElementById('pdf-right').innerText = pdfRightCount;
            } else {
                pdfWrongCount++;
                document.getElementById('pdf-wrong').innerText = pdfWrongCount;
            }
            renderPdf(); 
        }
        function goPrevPdf() { if (currentPdfIndex > 0) { currentPdfIndex--; renderPdf(); } }
        function goNextPdf() { if (currentPdfIndex < pdf_mcqs.length - 1) { currentPdfIndex++; renderPdf(); } }

        // ==========================================
        // HELPER FUNCTIONS
        // ==========================================
        function handleSolutionBox(prefix, qData, hasAnswered) {
            const solArea = document.getElementById(`${prefix}-sol-area`);
            const solBox = document.getElementById(`${prefix}-sol-box`);
            const revealBtn = document.getElementById(`${prefix}-reveal-btn`);
            
            if (qData.sol) {
                solArea.style.display = 'block';
                solBox.innerHTML = qData.sol;
                solBox.style.display = 'none';
                
                if (hasAnswered) {
                    revealBtn.style.display = 'inline-block';
                    revealBtn.onclick = () => { solBox.style.display = 'block'; };
                } else {
                    revealBtn.style.display = 'none';
                }
            } else {
                solArea.style.display = 'none';
            }
        }

        window.onload = function() {
            document.getElementById('theory-card-count').innerText = theory_mcqs.length + " MCQs";
            document.getElementById('pdf-card-count').innerText = pdf_mcqs.length + " MCQs";
        };
    </script>
