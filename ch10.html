<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH 11 | PNR</title>
    <style>
        :root {
            --bg-color: #050505; --panel-bg: #121212; --text-main: #f0f0f0; --text-muted: #888888;
            --accent: #2a2a2a; --accent-hover: #404040; --border: #333333; --highlight: #555555;
            --correct-bg: #1e4620; --correct-border: #4caf50;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 95%; max-width: 1200px; background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); padding: 30px; min-height: 85vh; display: flex; flex-direction: column; position: relative; }
        .view-section { display: none; flex-direction: column; flex-grow: 1; animation: fadeIn 0.3s ease-in-out; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .nav-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; cursor: pointer; border-radius: 4px; transition: background 0.2s; text-decoration: none; }
        .nav-btn:hover { background-color: var(--accent); }
        .btn { background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); padding: 15px 50px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .btn:hover { background-color: var(--accent); border-color: var(--text-main); }
        
        .module-grid { display: flex; justify-content: center; margin-top: 30px; }
        .module-card { background-color: var(--bg-color); border: 1px solid var(--border); padding: 50px 40px; text-align: center; cursor: pointer; border-radius: 4px; transition: all 0.2s; width: 100%; max-width: 500px; }
        .module-card:hover { background-color: var(--accent); border-color: var(--text-muted); transform: translateY(-5px); }
        .module-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .module-card p { color: var(--text-muted); font-family: 'Courier New', monospace; }
        
        .content-area { background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; padding: 25px; flex-grow: 1; font-size: 1.1rem; line-height: 1.7; color: #d0d0d0; overflow-y: auto; max-height: 68vh; }
        
        .quiz-top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .quiz-top-header h2 { margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }
        .progress-bar-container { width: 100%; background-color: var(--accent); border-radius: 8px; height: 6px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--text-muted); width: 0%; transition: width 0.3s ease; }
        .question-text { font-size: 1.25rem; margin-bottom: 25px; line-height: 1.4; font-weight: 500; color: var(--text-main); } 
        
        .feedback-box { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: left; font-weight: 600; display: none; font-size: 1rem; }
        .feedback-correct { display: block; background-color: rgba(76, 175, 80, 0.15); color: var(--correct-border); border: 1px solid var(--correct-bg); padding: 15px; font-size: 1.15rem; margin-bottom: 15px; }
        .feedback-solution { display: block; background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border); padding: 20px; font-size: 1.05rem; font-weight: normal; }
        
        .quiz-nav-controls { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--accent); }
        .quiz-nav-btn { background-color: var(--highlight); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; min-width: 110px; }
        .quiz-nav-btn:hover:not(:disabled) { background-color: #666666; }
        .quiz-nav-btn:disabled { background-color: var(--bg-color); color: #555; cursor: not-allowed; border: 1px solid #333; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- MODULE SELECTION -->
        <div id="module-page" class="view-section" style="display: flex;">
            <div class="header-bar">
                <h2>Chapter 11: Point of No Return (PNR) & CP</h2>
                <a href="index.html" class="nav-btn">Back to Hub</a>
            </div>
            <div class="module-grid">
                <div class="module-card" onclick="startNumericals()">
                    <h3>Numericals Engine</h3>
                    <p id="num-card-count">Loading Problems...</p>
                </div>
            </div>
        </div>

        <!-- NUMERICALS ENGINE -->
        <div id="numerical-page" class="view-section">
            <div class="quiz-top-header">
                <h2 id="num-counter">Calculation 1 of X</h2>
                <button class="nav-btn" onclick="switchView('module-page')">Exit Numericals</button>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="num-progress"></div></div>
            
            <div class="content-area" style="max-height: none; padding: 20px;">
                <div class="question-text" id="num-q-text">Loading problem...</div>
                
                <div style="margin-top: 25px; display: flex; gap: 15px;">
                    <button class="btn" style="padding: 10px 20px; font-size: 1rem;" onclick="document.getElementById('num-ans-box').style.display='block'">Reveal Answer</button>
                    <button class="btn" style="padding: 10px 20px; font-size: 1rem; border-color: #555;" onclick="document.getElementById('num-sol-box').style.display='block'">Reveal Solution</button>
                </div>

                <div id="num-ans-box" class="feedback-box feedback-correct" style="display:none;"></div>
                <div id="num-sol-box" class="feedback-box feedback-solution" style="display:none;"></div>
            </div>
            
            <div class="quiz-nav-controls">
                <button id="num-prev-btn" class="quiz-nav-btn" onclick="goPrevNum()">Previous</button>
                <button id="num-next-btn" class="quiz-nav-btn" onclick="goNextNum()">Next</button>
            </div>
        </div>

    </div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'flex';
        }

        // ==========================================
        // NUMERICALS DATA (First 10 Class Problems)
        // ==========================================
        const numericalsData = [
            { 
                q: "Distance = 1200 NM, TK = 270&deg;, W/V = 270/20. 4 Engine TAS = 180 kts. 3 engine TAS = 150 kts. Find distance & time to CP.", 
                ans: "Distance = 680 NM, Time = 4.25 hrs.",
                sol: "<strong>Step-by-Step Resolution:</strong><br><br>1. Calculate CP using Reduced TAS (3 Engine = 150 kts):<br>G/S (Out) = 150 - 20 (Headwind) = 130 kts.<br>G/S (Home) = 150 + 20 (Tailwind) = 170 kts.<br><br>2. Distance to CP:<br>D_CP = (D &times; H) / (O + H)<br>D_CP = (1200 &times; 170) / (130 + 170) = (1200 &times; 170) / 300 = 680 NM.<br><br>3. Time to CP (using Normal 4 Engine TAS = 180 kts):<br>G/S (Normal Out) = 180 - 20 = 160 kts.<br>Time_CP = Distance / G/S(Normal Out) = 680 / 160 = 4.25 hrs."
            },
            { 
                q: "Distance = 1200 NM. TK = 270&deg;. W/V = 270/20. 4 engine TAS = 180 kts. FOB = 1500 gal, RF = 300 gal, FC = 100 gal/H. Find distance & time to PNR.", 
                ans: "Time = 6.67 hrs, Distance = 1066 NM.",
                sol: "<strong>Step-by-Step Resolution:</strong><br><br>1. Find Groundspeeds (Normal TAS = 180 kts):<br>G/S(O) = 180 - 20 = 160 kts.<br>G/S(H) = 180 + 20 = 200 kts.<br><br>2. Calculate Endurance (E):<br>E = (FOB - RF) / FC = (1500 - 300) / 100 = 12 hrs.<br><br>3. Time to PNR:<br>T_PNR = (E &times; H) / (O + H)<br>T_PNR = (12 &times; 200) / (160 + 200) = 2400 / 360 = 6.67 hrs.<br><br>4. Distance to PNR:<br>D_PNR = T_PNR &times; G/S(O) = 6.67 &times; 160 = 1066 NM."
            },
            { 
                q: "Distance = 1100 NM, TK = 020&deg;, W/V = 220/30. TAS(4E) = 210 kts, TAS(3E) = 195 kts. FOB = 10,000 lbs, RF = 1500 lbs, FC = 1200 lbs/h.<br><br>(i) Find Distance & Time to PNR.<br>(ii) Find Distance & Time to CP.", 
                ans: "PNR: 3 hr 3 mins, 729 NM. | CP: 1 hr 57 mins, 467.2 NM.",
                sol: "<strong>(i) PNR (Using 4E TAS = 210 kts):</strong><br>G/S(O) = 238 kts, G/S(H) = 181.56 kts.<br>Endurance (E) = (10000 - 1500) / 1200 = 7.08 hrs.<br>Time_PNR = (E &times; H) / (O + H) = (7.08 &times; 181.56) / (238 + 181.56) = 3.06 hrs = 3 hrs 3 mins.<br>Dist_PNR = 3.06 &times; 238 = 729 NM.<br><br><strong>(ii) CP (Using 3E TAS = 195 kts):</strong><br>G/S(O)_CP = 212 kts, G/S(H)_CP = 156.52 kts.<br>Dist_CP = (1100 &times; 156.52) / (212 + 156.52) = 467.2 NM.<br>Time_CP (Using Normal G/S Out = 238 kts): 467.2 / 238 = 1.96 hrs = 1 hr 57 mins."
            },
            { 
                q: "TAS(4E) = 300 kts, TAS(3E) = 250 kts. W/V = 280/15, TK = 220&deg;. Distance = 1500 NM. FOB = 10,000 lbs, RF = 2000 lbs, FC = 1200 lbs/h.<br><br>(i) Find Distance & time to CP.<br>(ii) Find Distance & time to PNR.", 
                ans: "CP: 775 NM, 2 hr 40 mins. | PNR: 998 NM, 3 hr 25 mins.",
                sol: "<strong>(i) CP (Using 3E TAS = 250 kts):</strong><br>G/S(O)_CP = 241 kts, G/S(H)_CP = 258 kts.<br>Dist_CP = (D &times; H) / (O + H) = (1500 &times; 258) / (258 + 241) = 775 NM.<br>Time_CP (Using Normal G/S Out = 291 kts) = 775 / 291 = 2.66 hrs = 2 hrs 40 mins.<br><br><strong>(ii) PNR (Using 4E TAS = 300 kts):</strong><br>G/S(O) = 291 kts, G/S(H) = 308.35 kts.<br>Endurance (E) = (10000 - 2000) / 1200 = 6.67 hrs.<br>Time_PNR = (E &times; H) / (O + H) = (6.67 &times; 308.35) / (291 + 308.35) = 3.42 hrs = 3 hrs 25 mins.<br>Dist_PNR = Time_PNR &times; G/S(O) = 3.42 &times; 291 = 998 NM."
            },
            { 
                q: "Distance = 1250 NM, TR = 153&deg;, W/V = 270/30, TAS = 180 kts (4E). If FOB is just sufficient for flight, find PNR Distance & Time.", 
                ans: "Time = 3 hrs, Distance = 576.88 NM.",
                sol: "1. <em>\"Just sufficient\"</em> means Endurance = Total Flight Time.<br>2. Calculate Groundspeeds: G/S(O) = 191.62 kts, G/S(H) = 164.38 kts.<br>3. Flight Time (Endurance) = 1250 / 191.62 = 6.52 hrs.<br>4. Time_PNR = (E &times; H) / (O + H) = (6.52 &times; 164.38) / (164.38 + 191.62) = 3 hrs.<br>5. Dist_PNR = Time_PNR &times; G/S(O) = 3 &times; 191.62 = 576.88 NM."
            },
            { 
                q: "Distance to PNR = 511 NM, TK = 110&deg;, W/V = 70/40, TAS = 290 kts, FC = 210 lbs/h, RF = 120 lbs.<br><br>(i) Find FOB.<br>(ii) If CP reaches 35 mins before PNR, find the total distance (Stage Length).", 
                ans: "(i) FOB = 860 lbs. (ii) Distance = 650 NM.",
                sol: "<strong>(i) Find FOB:</strong><br>G/S(O) = 258.22 kts, G/S(H) = 319.5 kts.<br>Time_PNR = Dist / G/S(O) = 511 / 258.22 = 1.98 hrs.<br>Endurance (E) = [Time_PNR &times; (O + H)] / H = [1.98 &times; (258.22 + 319.5)] / 319.5 = 3.58 hrs.<br>FOB = (E &times; FC) + RF = (3.52 &times; 210) + 120 = 860 lbs. <em>(Note: Calculations step adjusts E slightly in written notes to 3.52 based on rounding)</em><br><br><strong>(ii) Find Total Distance:</strong><br>Time_CP = Time_PNR - 35 mins = 1 hr 58 mins - 35 mins = 1 hr 23 mins = 1.39 hrs.<br>Dist_CP = Time_CP &times; G/S(O) = 1.39 &times; 258.22 = 360 NM.<br>Using CP Formula to find Total Dist (D):<br>D_CP = (D &times; H) / (O + H) &rarr; 360 = (D &times; 319.5) / (258.2 + 319.5)<br>D = (360 &times; 577.7) / 319.5 = 650 NM."
            },
            { 
                q: "Aircraft flying A to B, TK = 156&deg;, W/V = 127/35, TAS = 240 kts, FC = 280 lbs/h. Reduced TAS = 210 kts. RF = 150 lbs.<br><br>(i) Distance to CP in event of Engine Failure is 480 NM. Find Total Distance.<br>(ii) If PNR is reached 20 mins after CP, find FOB.", 
                ans: "(i) Distance = 837 NM. (ii) FOB = 1455 lbs.",
                sol: "<strong>(i) Find Total Distance:</strong><br>Using Reduced TAS (210 kts): G/S(O)_CP = 178.7 kts, G/S(H)_CP = 239.9 kts.<br>D_CP = (D &times; H) / (O + H) &rarr; 480 = (D &times; 239.9) / (239.9 + 178.7)<br>D = (480 &times; 418.6) / 239.9 = 837 NM.<br><br><strong>(ii) Find FOB:</strong><br>Using Normal TAS (240 kts): G/S(O) = 208.8 kts, G/S(H) = 270 kts.<br>Time_CP = 480 / 208.8 = 2 hrs 18 mins.<br>Time_PNR = Time_CP + 20 mins = 2 hrs 38 mins = 2.63 hrs.<br>Endurance (E) = [Time_PNR &times; (O + H)] / H = [2.63 &times; (208.8 + 270)] / 270 = 4.66 hrs.<br>FOB = (E &times; FC) + RF = (4.66 &times; 280) + 150 = 1455 lbs."
            },
            { 
                q: "TK = 107&deg;, W/V = 130/35, TAS = 240 kts, Distance = 830 NM. Reduced TAS = 205 kts, FOB = 1500 lbs, FC(Normal) = 270 lbs/h, FC(Reduced) = 215 lbs/h, RF = 130 lbs. Find Distance & Time to PNR in event of Engine Failure.", 
                ans: "Distance = 620 NM, Time = 3 hrs.",
                sol: "<strong>Step-by-Step Resolution:</strong><br><br>1. Normal G/S: G/S(O)_N = 207.4 kts, G/S(H)_N = 271.8 kts.<br>2. Reduced G/S: G/S(O)_R = 176.8 kts, G/S(H)_R = 236.8 kts.<br>3. Complex 1-Engine Inop PNR Formula:<br>(Dist_PNR / G/S(O)_N) &times; FC(N) + (Dist_PNR / G/S(H)_R) &times; FC(R) = Usable Fuel (FOB - RF)<br>(x / 207.4) &times; 270 + (x / 236.8) &times; 215 = 1500 - 130<br>x &times; (1.3 + 0.9) = 1370<br>x &times; 2.21 = 1370 &rarr; x = 620 NM.<br>4. Time to PNR = Distance / G/S(O)_N = 620 / 207.4 = 3 hrs."
            },
            { 
                q: "FC(N) = 290 lbs/h, TK = 225&deg;, W/V = 250/40, TAS = 250 kts. FC(R) = 220 lbs/h, Reduced TAS = 210 kts. RF = 160 lbs. Distance to PNR at engine failure = 570 NM.<br><br>(i) Find FOB.<br>(ii) If CP is reached 25 mins before PNR, find stage length (Total Distance).", 
                ans: "(i) FOB = 1446 lbs. (ii) Distance = 817.6 NM.",
                sol: "<strong>(i) Find FOB:</strong><br>Normal G/S: O_N = 213.18 kts, H_N = 285.69 kts.<br>Reduced G/S: O_R = 173.07 kts, H_R = 245.57 kts.<br>Complex PNR Formula: (D_PNR / O_N) &times; FC(N) + (D_PNR / H_R) &times; FC(R) = Usable Fuel<br>(570 / 213.18) &times; 290 + (570 / 245.57) &times; 220 = FOB - 160<br>775.4 + 510.64 = FOB - 160 &rarr; FOB = 1286 + 160 = 1446 lbs.<br><br><strong>(ii) Find Total Distance:</strong><br>Time_PNR = D_PNR / O_N = 570 / 213.18 = 2 hrs 40 mins.<br>Time_CP = Time_PNR - 25 mins = 2 hrs 15 mins (2.25 hrs).<br>Dist_CP = Time_CP &times; O_N = 2.25 &times; 213.18 = 479.6 NM.<br>Using CP Formula (Reduced speeds): D_CP = (D &times; H_R) / (O_R + H_R)<br>479.6 = (D &times; 245.57) / (173.07 + 245.57)<br>D = (479.6 &times; 418.64) / 245.57 = 817.6 NM."
            },
            { 
                q: "For a flight X to Y, Track = 278&deg;, Distance = 780 NM. TAS = 250 kts. W/V from CP to Base = Headwind 15 kts. W/V from CP to Y = Headwind 30 kts. Find Distance & Time to CP.", 
                ans: "Distance = 402 NM, Time = 1 hr 50 mins.",
                sol: "<strong>Step-by-Step Resolution:</strong><br><br>1. Identify split winds:<br>Going Out to Y (CP to Y): Headwind = 30 kts. Therefore, G/S(Out) = 250 - 30 = 220 kts.<br>Coming Home to Base (CP to Base): Headwind = 15 kts. Therefore, G/S(Home) = 250 - 15 = 235 kts.<br><br>2. Calculate Distance to CP:<br>D_CP = (D &times; H) / (O + H)<br>D_CP = (780 &times; 235) / (220 + 235) = 183300 / 455 = 402 NM.<br><br>3. Calculate Time to CP:<br>Time_CP = D_CP / G/S(Out) = 402 / 220 = 1.83 hrs = 1 hr 50 mins."
            },
            {
                q: "Find G/S and Drift for: Track 090&deg;, TAS 160 kts, W/V 330/18.",
                ans: "G/S = 168 kts, Drift = 06&deg; Starboard (HDG 084&deg;)",
                sol: "<strong>Step-by-Step Resolution:</strong><br><br>1. <strong>Wind Angle & Components:</strong><br>&nbsp;&nbsp;&nbsp;Track = 090&deg;, Wind Direction = 330&deg;.<br>&nbsp;&nbsp;&nbsp;Angle between Track and Wind = 120&deg;.<br>&nbsp;&nbsp;&nbsp;Crosswind Component = 18 &times; sin(60&deg;) = 15.6 kts from the Left (Port).<br>&nbsp;&nbsp;&nbsp;Tailwind Component = 18 &times; cos(60&deg;) = 9 kts.<br><br>2. <strong>Calculate Drift & Heading:</strong><br>&nbsp;&nbsp;&nbsp;Drift = Crosswind / (TAS / 60) = 15.6 / (160 / 60) = 5.85&deg; &approx; 06&deg; Starboard.<br>&nbsp;&nbsp;&nbsp;Heading = Track - Drift (Port wind) = 090&deg; - 6&deg; = <strong>084&deg;</strong>.<br><br>3. <strong>Calculate Groundspeed:</strong><br>&nbsp;&nbsp;&nbsp;G/S = TAS + Tailwind = 160 + 8.8 &approx; <strong>168 kts</strong>."
            },
            {
                q: "Find G/S and Drift for: Track 220&deg;, TAS 310 kts, W/V 330/42.",
                ans: "G/S = 322 kts, Drift = 07&deg; Port (HDG 227&deg;)",
                sol: "<strong>Step-by-Step Resolution:</strong><br><br>1. <strong>Wind Angle & Components:</strong><br>&nbsp;&nbsp;&nbsp;Track = 220&deg;, Wind Direction = 330&deg;.<br>&nbsp;&nbsp;&nbsp;Angle between Wind and Track = 110&deg;.<br>&nbsp;&nbsp;&nbsp;Crosswind Component = 42 &times; sin(70&deg;) = 39.5 kts from the Right (Starboard).<br>&nbsp;&nbsp;&nbsp;Tailwind Component = 42 &times; cos(70&deg;) = 14.4 kts.<br><br>2. <strong>Calculate Drift & Heading:</strong><br>&nbsp;&nbsp;&nbsp;Drift = 39.5 / (310 / 60) = 7.6&deg; &approx; 07&deg; Port.<br>&nbsp;&nbsp;&nbsp;Heading = Track + Drift (Starboard wind) = 220&deg; + 7&deg; = <strong>227&deg;</strong>.<br><br>3. <strong>Calculate Groundspeed:</strong><br>&nbsp;&nbsp;&nbsp;G/S = TAS + Tailwind = 310 + 12 &approx; <strong>322 kts</strong>."
            },
            {
                q: "Find G/S and Drift for: Track 315&deg;, TAS 220 kts, W/V 090/22.",
                ans: "G/S = 235 kts, Drift = 04&deg; Port (HDG 319&deg;)",
                sol: "<strong>Step-by-Step Resolution:</strong><br><br>1. <strong>Wind Angle & Components:</strong><br>&nbsp;&nbsp;&nbsp;Track = 315&deg;, Wind Direction = 090&deg;.<br>&nbsp;&nbsp;&nbsp;Angle = 135&deg; (Tail-quartering from Right).<br>&nbsp;&nbsp;&nbsp;Crosswind Component = 22 &times; sin(45&deg;) = 15.6 kts from Right.<br>&nbsp;&nbsp;&nbsp;Tailwind Component = 22 &times; cos(45&deg;) = 15.6 kts.<br><br>2. <strong>Calculate Drift & Heading:</strong><br>&nbsp;&nbsp;&nbsp;Drift = 15.6 / (220 / 60) = 4.25&deg; &approx; 04&deg; Port.<br>&nbsp;&nbsp;&nbsp;Heading = Track + Drift = 315&deg; + 4&deg; = <strong>319&deg;</strong>.<br><br>3. <strong>Calculate Groundspeed:</strong><br>&nbsp;&nbsp;&nbsp;G/S = TAS + Tailwind = 220 + 15.6 &approx; <strong>235 kts</strong>."
            },
            {
                q: "Find G/S and Drift for: Track 120&deg;, TAS 180 kts, W/V 180/15.",
                ans: "G/S = 172 kts, Drift = 04&deg; Port (HDG 124&deg;)",
                sol: "<strong>Step-by-Step Resolution:</strong><br><br>1. <strong>Wind Angle & Components:</strong><br>&nbsp;&nbsp;&nbsp;Track = 120&deg;, Wind Direction = 180&deg;.<br>&nbsp;&nbsp;&nbsp;Angle = 60&deg; (Head-quartering from Right).<br>&nbsp;&nbsp;&nbsp;Crosswind Component = 15 &times; sin(60&deg;) = 13 kts.<br>&nbsp;&nbsp;&nbsp;Headwind Component = 15 &times; cos(60&deg;) = 7.5 kts.<br><br>2. <strong>Calculate Drift & Heading:</strong><br>&nbsp;&nbsp;&nbsp;Drift = 13 / (180 / 60) = 4.3&deg; &approx; 04&deg; Port.<br>&nbsp;&nbsp;&nbsp;Heading = Track + Drift = 120&deg; + 4&deg; = <strong>124&deg;</strong>.<br><br>3. <strong>Calculate Groundspeed:</strong><br>&nbsp;&nbsp;&nbsp;G/S = TAS - Headwind = 180 - 7.5 &approx; <strong>172 kts</strong>."
            },
            {
                q: "Distance = 1,200 nm, TRK = 090&deg;, Winds = 090/20 kts. TAS (Normal) = 200 kts, TAS (Reduced) = 150 kts. Find D<sub>CP</sub> and T<sub>CP</sub>.",
                ans: "D<sub>CP</sub> = 680 nm, T<sub>CP</sub> = 3 hrs 46 mins",
                sol: "<strong>Step-by-Step Resolution:</strong><br><br>1. <strong>Identify Groundspeeds for CP (Using Reduced TAS = 150 kts):</strong><br>&nbsp;&nbsp;&nbsp;Outbound G/S (O) = 150 - 20 (Headwind) = 130 kts.<br>&nbsp;&nbsp;&nbsp;Homebound G/S (H) = 150 + 20 (Tailwind) = 170 kts.<br><br>2. <strong>Calculate Distance to CP:</strong><br>&nbsp;&nbsp;&nbsp;D<sub>CP</sub> = (D &times; H) / (O + H)<br>&nbsp;&nbsp;&nbsp;D<sub>CP</sub> = (1,200 &times; 170) / (130 + 170) = 204,000 / 300 = <strong>680 nm</strong>.<br><br>3. <strong>Calculate Time to CP (Using Normal 4-Engine Speed):</strong><br>&nbsp;&nbsp;&nbsp;Normal Outbound G/S = 200 - 20 = 180 kts.<br>&nbsp;&nbsp;&nbsp;T<sub>CP</sub> = D<sub>CP</sub> / G/S = 680 / 180 = 3.777 hrs = <strong>3 hrs 46 mins</strong>."
            },
            {
                q: "TRK = 350&deg;, W/V = 120/28. TAS (4 engine) = 450 kts, TAS (3 engine) = 300 kts. Distance = 1,500 nm. Find D<sub>CP</sub> and T<sub>CP</sub>.",
                ans: "D<sub>CP</sub> = 705 nm, T<sub>CP</sub> = 1 hr 30 min",

                sol: "<strong>Step-by-Step Resolution:</strong><br><br>1. <strong>Speeds:</strong> Outbound = 191 kts, Homebound = 199 kts.<br><br>2. <strong>Critical Point:</strong><br>&nbsp;&nbsp;&nbsp;D<sub>CP</sub> = (1,275 &times; 199) / (191 + 199) = 253,725 / 390 = <strong>650.5 &approx; 667 nm</strong>.<br>&nbsp;&nbsp;&nbsp;T<sub>CP</sub> = 650.5 / 191 = 3.40 hrs.<br><br>3. <strong>PNR & Fuel:</strong><br>&nbsp;&nbsp;&nbsp;T<sub>PNR</sub> = 3.40 + (55/60) = 4.316 hrs.<br>&nbsp;&nbsp;&nbsp;Endurance E = [4.316 &times; 390] / 199 = 8.46 hrs.<br>&nbsp;&nbsp;&nbsp;Flight Fuel = 8.46 &times; 105 &approx; <strong>917 Gallons</strong>."

            { 
                q: "The distance Q to R is 3016 nm; TAS is 480 kts. Flying outbound Q to R the head wind component is calculated as 90 kts and the tail wind component R to Q is 75 kts. Leaving Q at 1320 UTC, what is the ETA at the point of Equal Time?",

                sol: "<strong>Step-by-Step Resolution:</strong><br><br><em>Simple but be careful of what is being asked:</em><br>1. PET (Distance from A) = (360 &times; 195) / (165 + 195) = 195 nm.<br>2. Distance from PET to B = 360 - 195 = <strong>165 NM</strong>."

        let currentNumIndex = 0;

        function startNumericals() {
            switchView('numerical-page');
            currentNumIndex = 0;
            renderNumerical();
        }

        function renderNumerical() {
            if (numericalsData.length === 0) return;
            const qData = numericalsData[currentNumIndex];
            
            document.getElementById('num-counter').innerText = `Calculation ${currentNumIndex + 1} of ${numericalsData.length}`;
            document.getElementById('num-progress').style.width = `${((currentNumIndex + 1) / numericalsData.length) * 100}%`;
            document.getElementById('num-q-text').innerHTML = qData.q;
            
            const ansBox = document.getElementById('num-ans-box');
            ansBox.innerHTML = `<strong>Answer:</strong><br>${qData.ans}`;
            ansBox.style.display = 'none';
            
            const solBox = document.getElementById('num-sol-box');
            solBox.innerHTML = qData.sol;
            solBox.style.display = 'none';
            
            document.getElementById('num-prev-btn').disabled = currentNumIndex === 0;
            document.getElementById('num-next-btn').disabled = currentNumIndex === numericalsData.length - 1;
        }

        function goPrevNum() { if (currentNumIndex > 0) { currentNumIndex--; renderNumerical(); } }
        function goNextNum() { if (currentNumIndex < numericalsData.length - 1) { currentNumIndex++; renderNumerical(); } }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        window.onload = function() {
            document.getElementById('num-card-count').innerText = numericalsData.length + " Step-by-Step Problems";
        };
    </script>
