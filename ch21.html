<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH 21 | VOR</title>
    <style>
        :root {
            --bg-color: #050505; --panel-bg: #121212; --text-main: #f0f0f0; --text-muted: #888888;
            --accent: #2a2a2a; --accent-hover: #404040; --border: #333333; --highlight: #555555;
            --correct-bg: #1e4620; --correct-border: #4caf50; --wrong-bg: #4a1919; --wrong-border: #f44336;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 95%; max-width: 1200px; background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); padding: 30px; min-height: 85vh; display: flex; flex-direction: column; position: relative; }
        .view-section { display: none; flex-direction: column; flex-grow: 1; animation: fadeIn 0.3s ease-in-out; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .nav-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; cursor: pointer; border-radius: 4px; transition: background 0.2s; text-decoration: none; font-size: 1rem; }
        .nav-btn:hover { background-color: var(--accent); }
        .btn { background-color: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); padding: 10px 20px; font-size: 1rem; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .btn:hover { background-color: var(--accent); border-color: var(--text-main); }
        
        .module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        .module-card { background-color: var(--bg-color); border: 1px solid var(--border); padding: 50px 40px; text-align: center; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .module-card:hover { background-color: var(--accent); border-color: var(--text-muted); transform: translateY(-5px); }
        .module-card h3 { font-size: 1.8rem; margin-bottom: 10px; }
        .module-card p { color: var(--text-muted); font-family: 'Courier New', monospace; }
        
        .content-area { background-color: var(--bg-color); border: 1px solid var(--border); border-radius: 4px; padding: 25px; flex-grow: 1; font-size: 1.1rem; line-height: 1.7; color: #d0d0d0; overflow-y: auto; max-height: 68vh; }
        
        .quiz-top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .quiz-top-header h2 { margin: 0; font-size: 1.1rem; color: var(--text-muted); font-weight: 600; }
        .score-tracker { font-size: 1rem; font-weight: bold; color: var(--text-muted); }
        .score-right { color: var(--correct-border); }
        .score-wrong { color: var(--wrong-border); }

        .progress-bar-container { width: 100%; background-color: var(--accent); border-radius: 8px; height: 6px; margin-bottom: 15px; overflow: hidden; }
        .progress-bar { height: 100%; background-color: var(--text-muted); width: 0%; transition: width 0.3s ease; }
        .question-text { font-size: 1.25rem; margin-bottom: 25px; line-height: 1.4; font-weight: 500; color: var(--text-main); } 
        
        .mcq-options { display: flex; flex-direction: column; gap: 10px; }
        .mcq-option { background-color: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); padding: 15px 20px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 1.05rem; transition: all 0.2s; }
        .mcq-option:hover:not(.disabled) { background-color: var(--accent); }
        .mcq-option.disabled { cursor: default; }
        .mcq-option.correct { background-color: var(--correct-bg); border-color: var(--correct-border); }
        .mcq-option.wrong { background-color: var(--wrong-bg); border-color: var(--wrong-border); }
        
        .feedback-solution { display: block; background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border); padding: 20px; font-size: 1.05rem; font-weight: normal; border-radius: 8px; }
        .flashcard-ans-box { display: block; background-color: rgba(76, 175, 80, 0.15); color: var(--correct-border); border: 1px solid var(--correct-bg); padding: 20px; font-size: 1.15rem; font-weight: bold; border-radius: 8px; margin-bottom: 15px; }

        .quiz-nav-controls { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--accent); }
        .quiz-nav-btn { background-color: var(--highlight); color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; min-width: 110px; }
        .quiz-nav-btn:hover:not(:disabled) { background-color: #666666; }
        .quiz-nav-btn:disabled { background-color: var(--bg-color); color: #555; cursor: not-allowed; border: 1px solid #333; }
        
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 25px; margin-bottom: 25px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- MODULE SELECTION -->
        <div id="module-page" class="view-section" style="display: flex;">
            <div class="header-bar">
                <h2>Chapter 21: VOR</h2>
                <a href="index.html" class="nav-btn">Back to Hub</a>
            </div>
            <div class="module-grid">
                <div class="module-card" onclick="startTheory()">
                    <h3>Theory Engine</h3>
                    <p id="theory-card-count">Loading MCQs...</p>
                </div>
                <div class="module-card" onclick="startPdf()">
                    <h3>PDF Data</h3>
                    <p id="pdf-card-count">Loading PDF MCQs...</p>
                </div>
                <div class="module-card" onclick="startNumerical()">
                    <h3>Numericals</h3>
                    <p id="num-card-count">Loading Flashcards...</p>
                </div>
            </div>
        </div>

        <!-- THEORY ENGINE (MCQ) -->
        <div id="theory-page" class="view-section">
            <div class="quiz-top-header">
                <h2 id="theory-counter">Theory Question 1 of X</h2>
                <div class="score-tracker">
                    Right: <span id="theory-right" class="score-right">0</span> | 
                    Wrong: <span id="theory-wrong" class="score-wrong">0</span>
                </div>
                <button class="nav-btn" onclick="switchView('module-page')">Exit Engine</button>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="theory-progress"></div></div>
            
            <div class="content-area">
                <div class="question-text" id="theory-q-text">Loading question...</div>
                <div class="mcq-options" id="theory-options"></div>

                <div id="theory-sol-area" style="margin-top: 20px; display: none; text-align: center;">
                    <button id="theory-reveal-btn" class="btn" style="border-color: #555;">Reveal Solution</button>
                    <div id="theory-sol-box" class="feedback-solution" style="display:none; margin-top: 15px; text-align: left;"></div>
                </div>
            </div>
            
            <div class="quiz-nav-controls">
                <button id="theory-prev-btn" class="quiz-nav-btn" onclick="goPrevTheory()">Previous</button>
                <button id="theory-next-btn" class="quiz-nav-btn" onclick="goNextTheory()">Next</button>
            </div>
        </div>

        <!-- PDF ENGINE (MCQ) -->
        <div id="pdf-page" class="view-section">
            <div class="quiz-top-header">
                <h2 id="pdf-counter">PDF Question 1 of X</h2>
                <div class="score-tracker">
                    Right: <span id="pdf-right" class="score-right">0</span> | 
                    Wrong: <span id="pdf-wrong" class="score-wrong">0</span>
                </div>
                <button class="nav-btn" onclick="switchView('module-page')">Exit PDF Data</button>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="pdf-progress"></div></div>
            
            <div class="content-area">
                <div class="question-text" id="pdf-q-text">Loading question...</div>
                <div class="mcq-options" id="pdf-options"></div>

                <div id="pdf-sol-area" style="margin-top: 20px; display: none; text-align: center;">
                    <button id="pdf-reveal-btn" class="btn" style="border-color: #555;">Reveal Solution</button>
                    <div id="pdf-sol-box" class="feedback-solution" style="display:none; margin-top: 15px; text-align: left;"></div>
                </div>
            </div>
            
            <div class="quiz-nav-controls">
                <button id="pdf-prev-btn" class="quiz-nav-btn" onclick="goPrevPdf()">Previous</button>
                <button id="pdf-next-btn" class="quiz-nav-btn" onclick="goNextPdf()">Next</button>
            </div>
        </div>

        <!-- NUMERICAL ENGINE (FLASHCARDS) -->
        <div id="numerical-page" class="view-section">
            <div class="quiz-top-header">
                <h2 id="num-counter">Numerical 1 of X</h2>
                <button class="nav-btn" onclick="switchView('module-page')">Exit Numericals</button>
            </div>
            <div class="progress-bar-container"><div class="progress-bar" id="num-progress"></div></div>
            
            <div class="content-area">
                <div class="question-text" id="num-q-text" style="font-size: 1.4rem;">Loading problem...</div>
                
                <div class="btn-group">
                    <button class="btn" onclick="document.getElementById('num-ans-box').style.display='block'">Reveal Answer</button>
                    <button class="btn" onclick="document.getElementById('num-sol-box').style.display='block'">Reveal Solution</button>
                </div>

                <div id="num-ans-box" class="flashcard-ans-box" style="display:none;"></div>
                <div id="num-sol-box" class="feedback-solution" style="display:none;"></div>
            </div>
            
            <div class="quiz-nav-controls">
                <button id="num-prev-btn" class="quiz-nav-btn" onclick="goPrevNum()">Previous</button>
                <button id="num-next-btn" class="quiz-nav-btn" onclick="goNextNum()">Next</button>
            </div>
        </div>

    <script>
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
            document.getElementById(viewId).style.display = 'flex';
        }

        // ==========================================
        // DATA ARRAYS (Awaiting Data)
        // ==========================================
        const theory_mcqs = [
            {
    q: "A VOR receiver check can be made",
    options: [
      "a) Any where on the ground",
      "b) At designated check point on airport surface.",
      "c) Any where in the air/ ground"
    ],
    correct: 1,
    sol: "<strong>Explanation:</strong> Refer to VOR operational procedures."
  },
  {
    q: "DVOR works on the principle of",
    options: [
      "a) Measuring Doppler frequency shift between fixed and variable signal.",
      "b) Measuring phase difference between fixed and variable signal.",
      "c) Measuring time difference induced by Doppler frequency shift in single signal"
    ],
    correct: 1,
    sol: "<strong>Explanation:</strong> DVOR determines bearing by measuring the phase difference between the reference and variable signals."
  },
  {
    q: "If an aircraft flies along a VOR radial it will follow a:",
    options: [
      "a) constant magnetic track",
      "b) great circle track",
      "c) Rhumb line track"
    ],
    correct: 1,
    sol: "<strong>Explanation:</strong> VOR radials are great circle tracks originating from the station."
  },
  {
    q: "An omni-bearing selector (OBS) shows full deflection to the left when within range of a serviceable VOR. What angular deviation are you from the selected radial?",
    options: [
      "a) 1.5° or more",
      "b) 2.5° or more",
      "c) 10° or more"
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> Full scale deflection on a standard VOR indicator represents 10 degrees or more of deviation."
  },
  {
    q: "The two signals transmitted by a conventional VOR ground station are 90° out of phase on magnetic:",
    options: [
      "a) north",
      "b) west",
      "c) east"
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> By convention, the signals are in phase at Magnetic North and 90° out of phase at Magnetic East."
  },
  {
    q: "The frequency range of a VOR receiver is:",
    options: [
      "a) 108 to 135.95 MHz",
      "b) 108 to 117.95 MHz",
      "c) 118 to 135.95 MHz"
    ],
    correct: 1,
    sol: "<strong>Explanation:</strong> VOR operates in the VHF band between 108.00 and 117.95 MHz."
  },
  {
    q: "VOR station position N61°E025°, variation 13°E; Estimated position of an aircraft N59°E025°, variation 20°E. What VOR radial is the aircraft on?",
    options: [
      "a) 167°",
      "b) 347°",
      "c) 160°"
    ],
    correct: 0,
    sol: "<strong>Explanation:</strong> Apply the station's magnetic variation to determine the correct radial from the station."
  },
  {
    q: "Which of the following statements concerning the variable, or directional, signal of a conventional VOR is correct?",
    options: [
      "a) The receiver adds 30Hz to the variable signal before combining it with the reference signal",
      "b) The transmitter changes the frequency of the variable signal by 30Hz either side of the allocated frequency each time it rotates",
      "c) The rotation of the variable signal at a rate of 30 times per second gives it the characteristics of a 30Hz amplitude modulation"
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> In conventional VOR, the limacon rotation produces a 30Hz AM variable signal."
  },
  {
    q: "In which frequency band do VOR transmitters operate?",
    options: [
      "a) SHF",
      "b) EHF",
      "c) VHF"
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> VOR (Very High Frequency Omni-Directional Range) operates in the VHF band."
  },
  {
    q: "If the reference phase differs 30° with the variable phase the radial from the VOR station will be:",
    options: [
      "a) 150°",
      "b) 030°",
      "c) 210°"
    ],
    correct: 1,
    sol: "<strong>Explanation:</strong> The phase difference directly corresponds to the magnetic bearing (radial) from the station."
  },
  {
    q: "In order to plot a bearing from a VOR station, a pilot needs to know the magnetic variation:",
    options: [
      "a) at the half-way point between the aircraft and the station",
      "b) at the aircraft location",
      "c) at the VOR"
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> VOR radials are oriented to Magnetic North at the station, so the station's variation must be used."
  },
  {
    q: "A VOR is sited at position A(45°00'N, 010°00'E). An aircraft is located at position B(44°00'N, 010°00'E). Assuming that the magnetic variation at A is 10°W and at B is 15°W, the aircraft is on VOR radial:",
    options: [
      "a) 180°",
      "b) 185°",
      "c) 190°"
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> True bearing is 180°. Radial = True Bearing - Variation at VOR. 180° - (-10°) = 190°."
  },
  {
    q: "An aircraft flying on the true track 090° towards a VOR station located near the equator where the magnetic variation is 15°E. The variation at the aircraft position is 8°E. The aircraft is on VOR radial:",
    options: [
      "a) 075°",
      "b) 285°",
      "c) 255°"
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> The aircraft is west of the station. True bearing from the station is 270°. Radial = 270° - 15°E = 255°."
  },
  {
    q: "The principle used in VOR bearing measurement is:",
    options: [
      "a) envelope matching",
      "b) beat frequency discrimination",
      "c) phase comparison"
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> VOR operates on the principle of phase comparison between a reference signal and a variable signal."
  },
  {
    q: "Transmissions from VOR facilities may be adversely affected by:",
    options: [
      "a) night effect",
      "b) quadrantal error",
      "c) uneven propagation over irregular ground surfaces"
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> VHF signals are line-of-sight and can be distorted by terrain (site error / scalloping)."
  },
  {
    q: "If VOR bearing information is used beyond the published protection range, errors could be caused by:",
    options: [
      "a) interference from other transmitters",
      "b) noise from precipitation static exceeding the signal strength of the transmitter",
      "c) sky wave interference from distant transmitters on the same frequency"
    ],
    correct: 0,
    sol: "<strong>Explanation:</strong> Using a VOR beyond its designated operational volume opens up the risk of co-channel interference from other VORs."
  },
  {
    q: "The TO/FROM indicator of a VOR:",
    options: [
      "a) Tells whether a track equal to the selected bearing will bring you to or away from the VOR.",
      "b) Tells whether you are now flying towards or from the VOR.",
      "c) Tells whether you should turn the aircraft towards or away from the CDI indication."
    ],
    correct: 0,
    sol: "<strong>Explanation:</strong> The flag indicates the position of the aircraft relative to the OBS selected course, regardless of the aircraft's current heading."
  },
  {
    q: "An aircraft is tracking inbound to a VOR beacon on the 105 radial. The setting the pilot should put on the OBS and the CDI indications are:",
    options: [
      "a) 105, TO.",
      "b) 285, FROM.",
      "c) 285, TO."
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> Inbound on the 105 radial means tracking a 285° course to the station. Setting 285° on the OBS gives a TO indication."
  },
  {
    q: "The principle advantage of Doppler VOR is that:",
    options: [
      "a) a readout of range as well as bearing is obtained.",
      "b) transmitter frequency instability is minimised.",
      "c) site errors are considerably reduced."
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> DVOR significantly reduces the susceptibility to reflections from terrain and obstacles (site error)."
  },
  {
    q: "When a maximum range and altitude is published for a VOR?",
    options: [
      "a) The terrain will cause bends and/or scalloping on the VOR signal and make it inaccurate outside standards in the airspace outside the published airspace.",
      "b) The reception from this VOR is guaranteed free from harmful interference from other VORs when you are within this airspace.",
      "c) The signal from the VOR will be too weak to provide information when you are outside this airspace."
    ],
    correct: 1,
    sol: "<strong>Explanation:</strong> The Designated Operational Coverage (DOC) ensures signal protection from co-channel interference."
  },
  {
    q: "During maintenance, malfunction or testing the identification signal of a VOR transmitter is (i) by (ii) or (iii).",
    options: [
      "a) (i) suppressed; (ii) a modulated tone; (iii) suppression",
      "b) (i) suppressed; (ii) a continuous tone; (iii) removed",
      "c) (i) replaced; (ii) a continuous tone; (iii) morse letter S"
    ],
    correct: 1,
    sol: "<strong>Explanation:</strong> Standard ICAO protocol for VOR facilities undergoing maintenance or testing."
  },
  {
    q: "The heading read on a standard RMI is:",
    options: [
      "a) The True heading.",
      "b) The relative heading.",
      "c) The magnetic heading."
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> A standard Radio Magnetic Indicator (RMI) compass card is slaved to the aircraft's remote indicating compass to display magnetic heading at the top index."
  },
  {
    q: "An RMI indicates aircraft heading. To convert the RMI bearings of NDBs and VORs to true bearings the correct combination for the application of magnetic variation is:",
    options: [
      "a) NDB: aircraft position, VOR: aircraft position",
      "b) NDB: aircraft position, VOR: beacon position",
      "c) NDB: beacon position, VOR: aircraft position"
    ],
    correct: 1,
    sol: "<strong>Explanation:</strong> NDB bearings are derived from the aircraft's position, so aircraft magnetic variation applies. VOR radials are permanently oriented to magnetic north at the station, so the station (beacon) variation applies."
  },
  {
    q: "If you correctly tuned in a VOT situated to your east, your RMI should read ... and .........your OBS would read.........",
    options: [
      "a) 090; 090 with needle central and FROM indicated.",
      "b) 000; 000 with needle central an TO indicated.",
      "c) 000; 000 with needle central and FROM indicated."
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> A VOR Test Facility (VOT) transmits a 360° (000°) radial in all directions regardless of your bearing to the station. When tuning a VOT, the OBS centered on 000° will always yield a FROM indication, and the RMI tail will indicate 000°."
  },
  {
    q: "An RMI slaved to a remote indicating compass has gone unserviceable and is locked on to a reading of 090°. The tail of the VOR pointer shows 135°. The available information from the VOR is:",
    options: [
      "a) Radial unknown, relative bearing 045°",
      "b) Radial 135°, relative bearing unknown",
      "c) Radial 315°, relative bearing unknown"
    ],
    correct: 1,
    sol: "<strong>Explanation:</strong> VOR signals reference magnetic north at the station independently of the aircraft's heading. The RMI VOR needle is driven to the correct radial against the compass card. Even if the card is stuck, the tail still points to the correct radial (135°). However, because the heading indication is false, relative bearing cannot be reliably determined."
  }
            // Format: { q: "Question?", options: ["a) Opt 1", "b) Opt 2", "c) Opt 3"], correct: 0, sol: "<strong>Explanation:</strong> text" }
        ];

        const pdf_mcqs = [
            {
    q: "Assuming the maximum likely error in VOR to be 5.5°, what is the maximum distance apart that beacons can be situated on the centre line of a UK airway in order that an aircraft can guarantee remaining within the airway boundary?",
    options: [
      "a) 54.5 NM",
      "b) 109 NM",
      "c) 66 NM",
      "d) 132 NM"
    ],
    correct: 1,
    sol: "<strong>Explanation:</strong> A UK airway is 10 NM wide (5 NM half-width). Using the 1-in-60 rule: Distance to boundary = (5 * 60) / 5.5 = 54.5 NM from one VOR. Total distance between two VORs = 54.5 * 2 = 109 NM."
  },
  {
    q: "The Designated Operational Coverage quoted for VOR beacons in the COMM section of the AIP:",
    options: [
      "a) is only applicable by day",
      "b) guarantees a protection ratio of at least 3 to 1 by day and night",
      "c) defines the airspace within which an aircraft is assured of protection from interference from other VORs on the same channel",
      "d) is determined by the type of surface over which the signal will have to travel"
    ],
    correct: 2,
    sol: "<strong>Explanation:</strong> DOC ensures signal protection from co-channel interference within a specified range and altitude."
  },
  {
    q: "What is the theoretical maximum range that an aircraft at flight level 360 will obtain from a VOR beacon situated at 900 ft above mean sea level?",
    options: [
      "a) 274 NM",
      "b) 255 NM",
      "c) 112 NM",
      "d) 224 NM"
    ],
    correct: 0,
    sol: "<strong>Explanation:</strong> Range = 1.25 * (√36000 + √900) = 1.25 * (189.7 + 30) = 1.25 * 219.7 ≈ 274 NM."
  },
  {
    q: "A conventional VOR:",
    options: [
      "a) has an FM reference signal and an AM variable signal",
      "b) has a 150 Hz reference signal and a 90 Hz variable signal",
      "c) has an AM reference signal and a 150 Hz variable signal",
      "d) has an AM reference signal and an FM variable signal"
    ],
    correct: 0,
    sol: "<strong>Explanation:</strong> In a conventional VOR (CVOR), the 30 Hz reference signal is Frequency Modulated (FM) on a subcarrier, and the variable directional signal is Amplitude Modulated (AM)."
  },
  {
    q: "The OBS on a deviation indicator is set to 330° and gives a 3 dots fly right demand with FROM indicated. What is the QDM of the aircraft to the station?",
    options: [
      "a) 144",
      "b) 324",
      "c) 336",
      "d) 156"
    ],
    correct: 0,
    sol: "<strong>Explanation:</strong> FROM indicates the aircraft is near the 330° radial. 3 dots right = 6° deviation. The selected course (330°) is to the right, so the actual radial is 324°. QDM (bearing to station) = 324° - 180° = 144°."
  },
  {
    q: "An aircraft is homing towards a VOR which marks the centre line of an airway. The beacon is 100 NM distant. If the pilot had the airway QDM set on the OBS what deflection of the deviation indicator would be given if the aircraft was on the boundary of the airway? Assume that one dot equals 2 degrees.",
    options: [
      "a) 3 dots",
      "b) 2 dots",
      "c) 2.5 dots",
      "d) 1.5 dots"
    ],
    correct: 3,
    sol: "<strong>Explanation:</strong> Airway half-width is 5 NM. Using 1-in-60 rule: Track Error Angle = (5 / 100) * 60 = 3°. Since 1 dot = 2°, deflection = 3 / 2 = 1.5 dots."
  },
  {

        function renderTheory() {
            if (theory_mcqs.length === 0) return;
            const qData = theory_mcqs[currentTheoryIndex];
            
            document.getElementById('theory-counter').innerText = `Theory Q${currentTheoryIndex + 1} of ${theory_mcqs.length}`;
            document.getElementById('theory-progress').style.width = `${((currentTheoryIndex + 1) / theory_mcqs.length) * 100}%`;
            document.getElementById('theory-q-text').innerHTML = `<strong>Q${currentTheoryIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('theory-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = theoryAnswers[currentTheoryIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === theoryAnswers[currentTheoryIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectTheoryOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            handleSolutionBox('theory', qData, hasAnswered);
            
            document.getElementById('theory-prev-btn').disabled = currentTheoryIndex === 0;
            document.getElementById('theory-next-btn').disabled = currentTheoryIndex === theory_mcqs.length - 1;
        }

        function selectTheoryOption(selectedIndex) { 
            theoryAnswers[currentTheoryIndex] = selectedIndex;
            if (selectedIndex === theory_mcqs[currentTheoryIndex].correct) {
                theoryRightCount++;
                document.getElementById('theory-right').innerText = theoryRightCount;
            } else {
                theoryWrongCount++;
                document.getElementById('theory-wrong').innerText = theoryWrongCount;
            }
            renderTheory(); 
        }
        function goPrevTheory() { if (currentTheoryIndex > 0) { currentTheoryIndex--; renderTheory(); } }
        function goNextTheory() { if (currentTheoryIndex < theory_mcqs.length - 1) { currentTheoryIndex++; renderTheory(); } }

        // ==========================================
        // PDF ENGINE LOGIC
        // ==========================================
        let currentPdfIndex = 0;
        let pdfAnswers = [];
        let pdfRightCount = 0;
        let pdfWrongCount = 0;

        function startPdf() {
            if (pdf_mcqs.length === 0) { alert("PDF Engine is empty."); return; }
            switchView('pdf-page');
            currentPdfIndex = 0;
            pdfRightCount = 0;
            pdfWrongCount = 0;
            document.getElementById('pdf-right').innerText = "0";
            document.getElementById('pdf-wrong').innerText = "0";
            pdfAnswers = new Array(pdf_mcqs.length).fill(null);
            renderPdf();
        }

        function renderPdf() {
            if (pdf_mcqs.length === 0) return;
            const qData = pdf_mcqs[currentPdfIndex];
            
            document.getElementById('pdf-counter').innerText = `PDF Q${currentPdfIndex + 1} of ${pdf_mcqs.length}`;
            document.getElementById('pdf-progress').style.width = `${((currentPdfIndex + 1) / pdf_mcqs.length) * 100}%`;
            document.getElementById('pdf-q-text').innerHTML = `<strong>Q${currentPdfIndex + 1}.</strong> ` + qData.q;
            
            const optionsContainer = document.getElementById('pdf-options');
            optionsContainer.innerHTML = '';
            
            const hasAnswered = pdfAnswers[currentPdfIndex] !== null;
            
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'mcq-option';
                btn.innerHTML = optText;
                
                if (hasAnswered) {
                    btn.classList.add('disabled');
                    if (index === qData.correct) {
                        btn.classList.add('correct');
                    } else if (index === pdfAnswers[currentPdfIndex]) {
                        btn.classList.add('wrong');
                    }
                } else {
                    btn.onclick = () => selectPdfOption(index);
                }
                optionsContainer.appendChild(btn);
            });

            handleSolutionBox('pdf', qData, hasAnswered);
            
            document.getElementById('pdf-prev-btn').disabled = currentPdfIndex === 0;
            document.getElementById('pdf-next-btn').disabled = currentPdfIndex === pdf_mcqs.length - 1;
        }

        function selectPdfOption(selectedIndex) { 
            pdfAnswers[currentPdfIndex] = selectedIndex;
            if (selectedIndex === pdf_mcqs[currentPdfIndex].correct) {
                pdfRightCount++;
                document.getElementById('pdf-right').innerText = pdfRightCount;
            } else {
                pdfWrongCount++;
                document.getElementById('pdf-wrong').innerText = pdfWrongCount;
            }
            renderPdf(); 
        }
        function goPrevPdf() { if (currentPdfIndex > 0) { currentPdfIndex--; renderPdf(); } }
        function goNextPdf() { if (currentPdfIndex < pdf_mcqs.length - 1) { currentPdfIndex++; renderPdf(); } }

        // ==========================================
        // NUMERICAL ENGINE LOGIC (Flashcards)
        // ==========================================
        let currentNumIndex = 0;

        function startNumerical() {
            if (numerical_data.length === 0) { alert("Numerical Engine is empty."); return; }
            switchView('numerical-page');
            currentNumIndex = 0;
            renderNumerical();
        }

        function renderNumerical() {
            if (numerical_data.length === 0) return;
            const qData = numerical_data[currentNumIndex];
            
            document.getElementById('num-counter').innerText = `Numerical Card ${currentNumIndex + 1} of ${numerical_data.length}`;
            document.getElementById('num-progress').style.width = `${((currentNumIndex + 1) / numerical_data.length) * 100}%`;
            
            // Text ONLY (No numbering)
            document.getElementById('num-q-text').innerHTML = qData.q;
            
            // Reset visibility
            document.getElementById('num-ans-box').style.display = 'none';
            document.getElementById('num-sol-box').style.display = 'none';
            
            // Populate content
            document.getElementById('num-ans-box').innerHTML = `<strong>Answer:</strong> ${qData.ans}`;
            document.getElementById('num-sol-box').innerHTML = qData.sol || "No solution provided.";
            
            document.getElementById('num-prev-btn').disabled = currentNumIndex === 0;
            document.getElementById('num-next-btn').disabled = currentNumIndex === numerical_data.length - 1;
        }

        function goPrevNum() { if (currentNumIndex > 0) { currentNumIndex--; renderNumerical(); } }
        function goNextNum() { if (currentNumIndex < numerical_data.length - 1) { currentNumIndex++; renderNumerical(); } }

        // ==========================================
        // HELPER FUNCTIONS
        // ==========================================
        function handleSolutionBox(prefix, qData, hasAnswered) {
            const solArea = document.getElementById(`${prefix}-sol-area`);
            const solBox = document.getElementById(`${prefix}-sol-box`);
            const revealBtn = document.getElementById(`${prefix}-reveal-btn`);
            
            if (qData.sol) {
                solArea.style.display = 'block';
                solBox.innerHTML = qData.sol;
                solBox.style.display = 'none';
                
                if (hasAnswered) {
                    revealBtn.style.display = 'inline-block';
                    revealBtn.onclick = () => { solBox.style.display = 'block'; };
                } else {
                    revealBtn.style.display = 'none';
                }
            } else {
                solArea.style.display = 'none';
            }
        }

        window.onload = function() {
            document.getElementById('theory-card-count').innerText = theory_mcqs.length + " MCQs";
            document.getElementById('pdf-card-count').innerText = pdf_mcqs.length + " MCQs";
            document.getElementById('num-card-count').innerText = numerical_data.length + " Cards";
        };
    </script>
</body>
</html>
